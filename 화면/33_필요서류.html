<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>랜선페이 — 필요 서류</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 스크롤바를 보이지 않게 (스크롤은 그대로 됨) */
html,body{scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0; height:0; display:none;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0; height:0;}
  :root{
    --primary:#2563EB; --primary-dark:#1D4ED8; --primary-50:#EFF4FF;
    --page-bg:#c9cdd4; --bg:#F4F5F6; --card:#FFFFFF; --line:#ECEEF1; --border:#B1B8BE;
    --tile:#EEF1F4; --icon-off:#B0B8C1; --sub:#4E5968; --ink:#191F28; --placeholder:#8B95A1;
    --warn:#B45309; --warn-bg:#FFF7ED;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{word-break:keep-all; overflow-wrap:break-word;}
  body{font-family:'Pretendard',-apple-system,sans-serif; color:var(--ink); background:var(--page-bg);
       display:flex; justify-content:center; align-items:flex-start; padding:24px 0; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; height:844px; max-width:100%; background:var(--bg); position:relative; display:flex; flex-direction:column;
         border-radius:46px; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.28);}
  iconify-icon{display:inline-block;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 30px; background:var(--bg); flex:0 0 auto;}
  .statusbar .time{font-size:15px; font-weight:700;}
  .statusbar .stat{display:flex; align-items:center; gap:7px;}
  .topbar{height:54px; display:flex; align-items:center; padding:0 10px; background:var(--bg); flex:0 0 auto;}
  .topbar .back{width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink); cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:17px; font-weight:700; margin-right:44px;}

  .body{flex:1; overflow-y:auto; padding:6px 20px 120px; scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}
  .lead{font-size:13px; color:var(--sub); line-height:1.7; margin:2px 2px 14px;}

  /* 항목 목록 */
  .cat{display:flex; align-items:center; gap:13px; background:var(--card); border-radius:16px;
       padding:15px 16px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .cat + .cat{margin-top:9px;}
  .cat .ic{width:42px; height:42px; flex:0 0 auto; border-radius:13px; background:var(--tile);
           display:flex; align-items:center; justify-content:center;}
  .cat .ic iconify-icon{font-size:21px; color:var(--primary);}
  .cat .tx{flex:1; min-width:0;}
  .cat .n{font-size:15px; font-weight:700;}
  .cat .s{font-size:12.5px; color:var(--placeholder); margin-top:3px;}
  .cat .gv{color:var(--icon-off); font-size:18px; flex:0 0 auto;}

  /* 상세 */
  .detail{display:none; flex:1; overflow-y:auto; padding:6px 20px 120px; scrollbar-width:none;}
  .detail.on{display:block;}
  .detail::-webkit-scrollbar{display:none;}
  .dttl{font-size:22px; font-weight:800; letter-spacing:-.4px;}
  .dsub{font-size:13.5px; color:var(--sub); margin-top:7px; line-height:1.7;}
  .dcase{background:var(--card); border-radius:16px; padding:16px 17px; margin-top:11px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .dcase .ct{display:flex; align-items:flex-start; gap:8px; font-size:14.5px; font-weight:700; line-height:1.5;}
  .dcase .badge{flex:0 0 auto; margin-left:auto; font-size:11px; font-weight:800; padding:4px 8px; border-radius:7px;
    color:var(--primary-dark); background:var(--primary-50);}
  .dcase ul{list-style:none; margin-top:11px;}
  .dcase li{position:relative; padding-left:15px; font-size:14px; color:var(--sub); line-height:1.7; margin-top:7px;}
  .dcase li:before{content:''; position:absolute; left:3px; top:9px; width:5px; height:5px; border-radius:50%; background:var(--primary);}
  .dkey{display:flex; gap:8px; margin-top:13px; padding:14px 15px; border-radius:13px; background:var(--primary-50);
    font-size:13px; font-weight:700; color:var(--primary-dark); line-height:1.6;}
  .dtip{display:flex; gap:8px; margin-top:9px; padding:14px 15px; border-radius:13px; background:var(--primary-50);
    font-size:13px; color:var(--primary-dark); line-height:1.65;}
  .dkey iconify-icon,.dtip iconify-icon{font-size:17px; flex:0 0 auto; margin-top:1px;}

  /* 하단 탭바 */
  .navbar{position:absolute; bottom:0; left:0; right:0; z-index:20; background:#fff;
    border-top:1px solid var(--line); padding-top:12px;}
  .nvbar{display:flex; padding:0 6px;}
  .nvtab{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    color:#8B95A1; font-size:11px; font-weight:500; cursor:pointer;}
  .nvtab iconify-icon{font-size:23px;}
  .nvtab.on{color:var(--primary); font-weight:700;}
  .nvtab.center{justify-content:center; gap:0;}
  .fab{width:56px; height:56px; margin-top:-24px; border:none; padding:0; border-radius:50%; pointer-events:none;
    display:flex; align-items:center; justify-content:center; background:var(--primary);
    box-shadow:0 6px 16px rgba(37,99,235,.45), 0 0 0 5px #fff, inset 0 1px 0 rgba(255,255,255,.28);}
  .fab img{width:29px;}
  .home-indicator{margin:10px auto 8px; width:134px; height:5px; border-radius:3px; background:var(--ink);}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2C11 2 13.3 3 15 4.7l-1.3 1.4C12.3 4.7 10.5 4 8.5 4S4.7 4.7 3.3 6.1L2 4.7C3.7 3 6 2 8.5 2z" fill="#191F28"/><circle cx="8.5" cy="10" r="1.3" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>

  <div class="topbar"><div class="back" onclick="back()">‹</div><div class="ttl" id="ttl">필요 서류</div></div>

  <div class="body" id="listView">
    <p class="lead">결제 항목을 누르면 어떤 서류가 필요한지 볼 수 있어요.</p>
    <div id="catList"></div>
  </div>

  <div class="detail" id="detailView"></div>

</div>

<script src="../홈페이지/서류.js"></script>
<script src="app.js"></script>
<script>
/* 홈페이지와 같은 서류 데이터(서류.js)를 씁니다 */
var CUR = null;
(function(){
  if (typeof CASE_DOCS === 'undefined') return;
  document.getElementById('catList').innerHTML = Object.keys(CASE_DOCS).map(function(k){
    var d = CASE_DOCS[k];
    return '<div class="cat" onclick="openCat(\'' + k + '\')">'
      + '<span class="ic"><iconify-icon icon="mingcute:' + (d.icon || 'grid-fill') + '"></iconify-icon></span>'
      + '<span class="tx"><div class="n">' + k + '</div><div class="s">' + (d.sub || '') + '</div></span>'
      + '<iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>';
  }).join('');
})();

function openCat(name){
  var d = CASE_DOCS[name];
  if (!d) return;
  CUR = name;
  var h = '<div class="dttl">' + name + '</div><div class="dsub">' + d.intro + '</div>';
  var oneOf = /하나만/.test(d.intro || '');
  d.cases.forEach(function(c){
    var title = c.t || '준비 서류';
    var badge = c.all ? '모두 준비' : (oneOf ? '이 중 하나' : '필수');
    h += '<div class="dcase"><div class="ct">' + title
       + '<span class="badge">' + badge + '</span></div><ul>'
       + c.items.map(function(i){ return '<li>' + i + '</li>'; }).join('')
       + '</ul></div>';
  });
  if (d.key) h += '<div class="dkey"><iconify-icon icon="mingcute:check-circle-fill"></iconify-icon><span>' + d.key + '</span></div>';
  if (d.tip) h += '<div class="dtip"><iconify-icon icon="mingcute:alert-fill"></iconify-icon><span>' + d.tip + '</span></div>';

  document.getElementById('detailView').innerHTML = h;
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').classList.add('on');
  document.getElementById('ttl').textContent = '필요 서류';
  document.getElementById('detailView').scrollTop = 0;
}

function back(){
  if (document.getElementById('detailView').classList.contains('on')){
    document.getElementById('detailView').classList.remove('on');
    document.getElementById('listView').style.display = 'block';
    CUR = null;
    return;
  }
  lpBack('21_더보기.html');
}
</script>
</body>
</html>
