<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>결제 요청 1 · 유형</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 스크롤바를 보이지 않게 (스크롤은 그대로 됨) */
html,body{scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0; height:0; display:none;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0; height:0;}
  :root{--primary:#2563EB; --primary-dark:#1D4ED8; --primary-50:#EFF4FF; --primary-100:#DBE7FF;
    --page-bg:#c9cdd4; --bg:#FFFFFF; --line:#ECEEF1; --border:#B1B8BE; --tile:#EEF1F4; --icon-off:#B0B8C1;
    --sub:#4E5968; --ink:#191F28; --placeholder:#8B95A1; --success:#059669;
    --primary-grad:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #ffffff), var(--primary));
    --btn-shadow:0 4px 12px color-mix(in srgb, var(--primary) 32%, transparent), inset 0 1px 0 rgba(255,255,255,.18);}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  /* 한글은 단어 단위로만 줄바꿈 (한 글자만 떨어지는 것 방지) */
  body{word-break:keep-all; overflow-wrap:break-word;}
  body{font-family:'Pretendard',sans-serif; color:var(--ink); background:var(--page-bg); display:flex; justify-content:center; align-items:flex-start; padding:24px 0; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; height:844px; max-width:100%; background:#fff; position:relative; display:flex; flex-direction:column; border-radius:46px; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.28);}
  iconify-icon{display:inline-block;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 30px; flex:0 0 auto;}
  .statusbar .time{font-size:15px; font-weight:700;}
  .statusbar .stat{display:flex; align-items:center; gap:7px;}
  .topbar{height:50px; display:flex; align-items:center; padding:0 10px; flex:0 0 auto;}
  .back{width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink); cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:16px; font-weight:700; margin-right:40px;}
  .prog{height:4px; background:var(--line); margin:0 24px 6px; border-radius:2px; overflow:hidden;}
  .prog i{display:block; height:100%; width:17%; background:var(--primary); border-radius:2px;}
  .body{flex:1; overflow-y:auto; padding:14px 24px 120px; scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}
  .q{font-size:22px; font-weight:700; letter-spacing:-.3px; margin-bottom:8px;}
  .qs{font-size:13.5px; color:var(--placeholder); margin-bottom:20px; line-height:1.6;}
  .footer{position:absolute; bottom:0; left:0; right:0; padding:14px 24px 30px; background:#fff;}
  .btn-primary{width:100%; height:56px; border:none; border-radius:15px; font-size:16px; font-weight:700; color:#fff; cursor:pointer; background:var(--primary); background:var(--primary-grad); box-shadow:var(--btn-shadow);}
  .btn-primary:disabled{background:var(--tile); box-shadow:none; color:var(--placeholder); cursor:default;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:700; color:var(--sub); margin-bottom:8px;}
  .tin{width:100%; height:52px; border:1.5px solid var(--border); border-radius:13px; padding:0 15px;
    font-family:inherit; font-size:15px; font-weight:600; color:var(--ink); background:#fff;}
  .tin:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(37,99,235,.12);}
  .hint{font-size:12.5px; color:var(--placeholder); margin-top:7px; line-height:1.6;}
  .catrow{display:flex; align-items:center; gap:14px; padding:14px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
  .catrow:last-child{border-bottom:none;}
  .catrow .cic{width:40px; height:40px; border-radius:12px; background:var(--tile); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .catrow .cic iconify-icon{font-size:22px; color:var(--primary);}
  .catrow .ct{flex:1; min-width:0;}
  .catrow .ct .cn{font-size:16px; font-weight:600;}
  .catrow .ct .cd{font-size:12px; color:var(--placeholder); margin-top:2px;}
  .catrow .gv{color:var(--icon-off); font-size:20px;}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>
  <div class="topbar"><div class="back" onclick="location.href='9_홈_사업자.html'">‹</div><div class="ttl">결제 요청 1</div></div>
  <div class="prog"><i></i></div>
  <div class="body" style="padding-bottom:24px">
    <div class="q">무엇을 청구할까요?</div>
    <div class="qs">유형에 따라 필요한 증빙 서류가 달라요.</div>
    <div class="catrow" onclick="pick('B2B 매입대금')"><div class="cic"><iconify-icon icon="mingcute:box-3-fill"></iconify-icon></div><div class="ct"><div class="cn">B2B 매입대금</div><div class="cd">거래대금 · 식자재 · 원자재</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="pick('인건비 · 용역비')"><div class="cic"><iconify-icon icon="mingcute:group-3-fill"></iconify-icon></div><div class="ct"><div class="cn">인건비 · 용역비</div><div class="cd">외주 · 프리랜서 · 용역</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="pick('부동산 임대차')"><div class="cic"><iconify-icon icon="mingcute:home-3-fill"></iconify-icon></div><div class="ct"><div class="cn">부동산 임대차</div><div class="cd">상가 · 사무실 임대료</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="pick('별도 관리비')"><div class="cic"><iconify-icon icon="mingcute:building-2-fill"></iconify-icon></div><div class="ct"><div class="cn">별도 관리비</div><div class="cd">상가 · 사무실 관리비</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="pick('렌트료 · 렌탈료')"><div class="cic"><iconify-icon icon="mingcute:car-fill"></iconify-icon></div><div class="ct"><div class="cn">렌트료 · 렌탈료</div><div class="cd">차량 · 장비 · 집기</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="pick('기타')"><div class="cic"><iconify-icon icon="mingcute:more-3-fill"></iconify-icon></div><div class="ct"><div class="cn">기타</div><div class="cd">위 유형이 아닌 청구건</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
  </div>
</div>
<script src="app.js"></script>
<script>
function pick(t){
  try{ sessionStorage.setItem('rq_type', t); }catch(e){}
  location.href = '43_요청2_금액.html';
}
</script>
</body>
</html>
