<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>랜선페이 — 카드 할부 정보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="screen.css">
<style>
/* 스크롤바를 보이지 않게 (스크롤은 그대로 됨) */
html,body{scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0; height:0; display:none;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0; height:0;}
  .calcbox{background:var(--card); border-radius:20px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .amtin{display:flex; align-items:baseline; border-bottom:2px solid var(--primary); padding-bottom:8px;}
  .amtin input{flex:1; border:none; outline:none; font-family:inherit; font-size:26px; font-weight:800; text-align:right; min-width:0; background:none;}
  .amtin span{font-size:15px; font-weight:800; color:var(--sub); margin-left:6px;}
  .mchips{display:flex; gap:7px; margin-top:14px; flex-wrap:wrap;}
  .mchips span{flex:1; min-width:62px; height:40px; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--line);
    border-radius:11px; background:#fff; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer;}
  .mchips span.on{border-color:var(--primary); background:var(--primary-50); color:var(--primary-dark);}
  .res{margin-top:16px; padding:16px; border-radius:14px; background:var(--tile);}
  .rrow{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0;}
  .rrow .v{font-weight:700;}
  .rrow.big{margin-top:8px; padding-top:11px; border-top:1px solid var(--border);}
  .rrow.big .l{font-size:14px; font-weight:700;}
  .rrow.big .v{font-size:20px; font-weight:800; color:var(--primary-dark);}
  .cardrow{display:flex; align-items:center; gap:12px; padding:15px 0;}
  .cardrow + .cardrow{border-top:1px solid var(--line);}
  .cardrow .face{width:44px; height:29px; flex:0 0 auto; border-radius:6px; background:linear-gradient(135deg,#3A4A63,#1B2432); position:relative;}
  .cardrow .face:after{content:''; position:absolute; left:6px; top:9px; width:10px; height:8px; border-radius:2px; background:linear-gradient(135deg,#F1D48A,#C9A24B);}
  .cardrow .face.s{background:linear-gradient(135deg,#2E6BD8,#1B3E82);}
  .cardrow .face.h{background:linear-gradient(135deg,#333,#000);}
  .cardrow .face.n{background:linear-gradient(135deg,#1F4EEB,#12307F);}
  .cardrow .tx{flex:1; min-width:0;}
  .cardrow .n{font-size:14.5px; font-weight:700;}
  .cardrow .s{font-size:12px; color:var(--placeholder); margin-top:3px;}
  .cardrow .mo{font-size:12px; font-weight:800; color:var(--primary-dark); background:var(--primary-50); padding:5px 9px; border-radius:7px; white-space:nowrap;}
  /* 무이자 목록 */
  .target{display:inline-block; margin:2px 0 4px; padding:5px 11px; border-radius:8px;
    background:var(--primary-50); color:var(--primary-dark); font-size:12.5px; font-weight:700;}
  .hint{font-size:13px; color:var(--sub); line-height:1.7; margin-bottom:10px;}
  .crow2{display:flex; align-items:center; gap:11px; padding:13px 0;}
  .crow2+.crow2{border-top:1px solid var(--line);}
  .clogo2{width:26px; height:22px; flex:0 0 auto; object-fit:contain; object-position:center;}
  .clogo2.wide{width:38px; height:13px;}
  .crow2 .n{flex:1; min-width:0; font-size:14.5px; font-weight:600;}
  .crow2 .mo2{font-size:13.5px; font-weight:700; color:var(--primary-dark); white-space:nowrap; text-align:right;}
  .crow2 .mo2 i{display:block; font-style:normal; font-size:12px; font-weight:600; color:var(--placeholder); margin-top:2px;}
  .fnotes{list-style:none;}
  .fnotes li{position:relative; padding-left:14px; font-size:13px; color:var(--sub); line-height:1.75; margin-bottom:9px;}
  .fnotes li:before{content:'·'; position:absolute; left:3px; color:var(--icon-off);}
  .fnotes b{color:var(--ink);}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>

  <div class="topbar"><div class="back" onclick="lpBack('9_홈_개인.html')">‹</div><div class="ttl">카드 할부 정보</div></div>

  <div class="body hasfoot">
    <div class="sec-s">이번 달 카드사별 무이자 · 부분 무이자 조건이에요.</div>
    <div class="target" id="fTarget"></div>

    <div class="sec-t">무이자 행사</div>
    <div class="box" id="freeBox"></div>

    <div class="sec-t">부분 무이자 행사</div>
    <div class="pad" style="padding-bottom:0">
      <div class="hint">앞 몇 회차의 이자만 내고 나머지는 카드사가 부담해요.</div>
    </div>
    <div class="box" id="partBox"></div>

    <div class="sec-t">유의사항</div>
    <div class="pad">
      <ul class="fnotes" id="noteBox"></ul>
    </div>
  </div>

  <div class="footer">
    <button class="btn" onclick="location.href='10_1_유형선택.html'">이 조건으로 결제하기</button>
  </div>
</div>
<script src="../홈페이지/게시글.js"></script>
<script src="app.js"></script>
<script>
/* 홈페이지와 같은 무이자 데이터(게시글.js)를 씁니다 */
(function(){
  if (typeof FREE_CARDS === 'undefined') return;
  function logo(name){
    var g = CARD_LOGO[name] || {};
    return g.img ? '<img class="clogo2' + (g.wide ? ' wide' : '') + '" src="' + g.img
                 + '" alt="" onerror="this.remove()">' : '<span class="clogo2"></span>';
  }
  document.getElementById('fTarget').textContent = '대상 : ' + FREE_TARGET;
  document.getElementById('freeBox').innerHTML = FREE_CARDS.map(function(c){
    return '<div class="crow2">' + logo(c.name) + '<span class="n">' + c.name
         + '</span><span class="mo2">' + c.term + '</span></div>';
  }).join('');
  document.getElementById('partBox').innerHTML = FREE_PARTIAL.map(function(c){
    var t = c.rows.map(function(r){ return r.term + ' <i>' + r.burden + '</i>'; }).join('');
    return '<div class="crow2">' + logo(c.name) + '<span class="n">' + c.name
         + '</span><span class="mo2">' + t + '</span></div>';
  }).join('');
  document.getElementById('noteBox').innerHTML =
    FREE_NOTES.map(function(t){ return '<li>' + t + '</li>'; }).join('');
})();
</script>
</body>
</html>
