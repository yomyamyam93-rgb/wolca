<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>결제 요청 2 · 금액</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--primary:#2563EB; --primary-dark:#1D4ED8; --primary-50:#EFF4FF; --primary-100:#DBE7FF;
    --page-bg:#c9cdd4; --bg:#FFFFFF; --line:#ECEEF1; --border:#B1B8BE; --tile:#EEF1F4; --icon-off:#B0B8C1;
    --sub:#4E5968; --ink:#191F28; --placeholder:#8B95A1; --success:#059669;
    --primary-grad:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #ffffff), var(--primary));
    --btn-shadow:0 4px 12px color-mix(in srgb, var(--primary) 32%, transparent), inset 0 1px 0 rgba(255,255,255,.18);}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:'Pretendard',sans-serif; color:var(--ink); background:var(--page-bg); display:flex; justify-content:center; align-items:flex-start; padding:24px 0; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; height:844px; max-width:100%; background:#fff; position:relative; display:flex; flex-direction:column; border-radius:46px; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.28);}
  iconify-icon{display:inline-block;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 30px; flex:0 0 auto;}
  .statusbar .time{font-size:15px; font-weight:700;}
  .statusbar .stat{display:flex; align-items:center; gap:7px;}
  .topbar{height:50px; display:flex; align-items:center; padding:0 10px; flex:0 0 auto;}
  .back{width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink); cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:16px; font-weight:700; margin-right:40px;}
  .prog{height:4px; background:var(--line); margin:0 24px 6px; border-radius:2px; overflow:hidden;}
  .prog i{display:block; height:100%; width:50%; background:var(--primary); border-radius:2px;}
  .body{flex:1; overflow-y:auto; padding:14px 24px 120px; scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}
  .q{font-size:22px; font-weight:700; letter-spacing:-.3px; margin-bottom:8px;}
  .qs{font-size:13.5px; color:var(--placeholder); margin-bottom:20px; line-height:1.6;}
  .footer{position:absolute; bottom:0; left:0; right:0; padding:14px 24px 30px; background:#fff;}
  .btn-primary{width:100%; height:56px; border:none; border-radius:15px; font-size:16px; font-weight:700; color:#fff; cursor:pointer; background:var(--primary); background:var(--primary-grad); box-shadow:var(--btn-shadow);}
  .btn-primary:disabled{background:var(--tile); box-shadow:none; color:var(--placeholder); cursor:default;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:700; color:var(--sub); margin-bottom:8px;}
  .tin{width:100%; height:52px; border:1.5px solid var(--border); border-radius:13px; padding:0 15px;
    font-family:inherit; font-size:15px; font-weight:600; color:var(--ink); background:#fff;}
  .tin:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(37,99,235,.12);}
  .hint{font-size:12.5px; color:var(--placeholder); margin-top:7px; line-height:1.6;}
  .amtbox{position:relative;}
  .amtbox input{width:100%; height:64px; border:none; border-bottom:2px solid var(--primary); font-size:30px; font-weight:800;
    text-align:right; padding-right:36px; color:var(--ink); font-family:inherit; background:none;}
  .amtbox input:focus{outline:none;}
  .amtbox .won{position:absolute; right:0; bottom:16px; font-size:22px; font-weight:800; color:var(--sub);}
  .kor{font-size:13.5px; font-weight:700; color:var(--primary); margin-top:10px; min-height:20px;}
  .quick{display:flex; gap:7px; margin-top:16px;}
  .quick span{flex:1; height:38px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
    border-radius:11px; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer;}
  .calc{margin-top:24px; padding:16px 18px; border-radius:14px; background:var(--tile);}
  .crow{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0;}
  .crow .v{font-weight:700;}
  .crow.tot{margin-top:9px; padding-top:11px; border-top:1px solid var(--border); font-size:14px;}
  .crow.tot .v{font-size:19px; font-weight:800; color:var(--primary-dark);}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>
  <div class="topbar"><div class="back" onclick="lpBack('42_요청1_유형.html')">‹</div><div class="ttl">결제 요청 2</div></div>
  <div class="prog"><i></i></div>
  <div class="body">
    <div class="q">얼마를 청구할까요?</div>
    <div class="qs" id="typeLine">B2B 매입대금</div>
    <div class="amtbox"><input id="amt" type="text" inputmode="numeric" value="3,500,000" oninput="calc()"><span class="won">원</span></div>
    <div class="kor" id="kor"></div>
    <div class="quick">
      <span onclick="add(100000)">+10만</span><span onclick="add(1000000)">+100만</span>
      <span onclick="add(5000000)">+500만</span><span onclick="setA(0)">지우기</span>
    </div>
    <div class="calc">
      <div class="crow"><span>내가 받는 금액</span><span class="v" id="get">3,500,000원</span></div>
      <div class="crow"><span>수수료 4% (거래처 부담)</span><span class="v" id="fee">140,000원</span></div>
      <div class="crow tot"><span>거래처가 결제할 금액</span><span class="v" id="tot">3,640,000원</span></div>
    </div>
    <div class="hint">수수료는 거래처가 결제할 때 함께 냅니다. 내 계좌로는 청구 금액 그대로 입금돼요.</div>
  </div>
  <div class="footer"><button class="btn-primary" id="next" onclick="go()">다음</button></div>
</div>
<script src="app.js"></script>
<script>
var fmt=function(n){return n.toLocaleString('ko-KR');};
function korMoney(n){
  if(!n) return '';
  var eok=Math.floor(n/100000000), man=Math.floor((n%100000000)/10000), rest=n%10000, out=[];
  if(eok) out.push(eok.toLocaleString()+'억');
  if(man) out.push(man.toLocaleString()+'만');
  if(rest) out.push(rest.toLocaleString());
  return out.join(' ')+'원';
}
function calc(){
  var raw=document.getElementById('amt').value.replace(/[^0-9]/g,'');
  var a=parseInt(raw||'0',10);
  document.getElementById('amt').value = a? fmt(a):'';
  var fee=Math.round(a*0.04);
  document.getElementById('kor').textContent = korMoney(a);
  document.getElementById('get').textContent = fmt(a)+'원';
  document.getElementById('fee').textContent = fmt(fee)+'원';
  document.getElementById('tot').textContent = fmt(a+fee)+'원';
  document.getElementById('next').disabled = a < 50000;
}
function add(n){
  var raw=document.getElementById('amt').value.replace(/[^0-9]/g,'');
  document.getElementById('amt').value=fmt(parseInt(raw||'0',10)+n); calc();
}
function setA(n){ document.getElementById('amt').value = n? fmt(n):''; calc(); }
function go(){
  try{ sessionStorage.setItem('rq_amt', document.getElementById('amt').value.replace(/[^0-9]/g,'')); }catch(e){}
  location.href='44_요청3_거래처.html';
}
try{ var t=sessionStorage.getItem('rq_type'); if(t) document.getElementById('typeLine').textContent=t; }catch(e){}
calc();
</script>
</body>
</html>
