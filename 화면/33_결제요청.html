<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>랜선페이 — 결제 요청</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="screen.css">
<style>
/* 스크롤바를 보이지 않게 (스크롤은 그대로 됨) */
html,body{scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0; height:0; display:none;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0; height:0;}
  /* 진행 순서 — 한 줄로 이어지는 형태 (41_대신결제요청과 동일) */
  .how{display:flex; align-items:flex-start; margin:2px 0 22px; padding:16px 6px 14px;
    background:var(--primary-50); border-radius:16px;}
  .how .st{flex:1; text-align:center; position:relative;}
  .how .st:not(:last-child):after{content:''; position:absolute; top:15px; left:calc(50% + 19px); right:calc(-50% + 19px);
    height:2px; background:var(--primary-100);}
  .how .n{width:30px; height:30px; margin:0 auto 9px; border-radius:50%;
    background:var(--primary); background:var(--primary-grad);
    box-shadow:0 4px 10px -3px color-mix(in srgb, var(--primary) 55%, transparent);
    color:#fff; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center;
    position:relative; z-index:1;}
  .how .t{font-size:12px; font-weight:700; color:var(--primary-dark); line-height:1.35; word-break:keep-all;}
  .amtbig{display:flex; align-items:baseline; justify-content:flex-end; border-bottom:2px solid var(--primary); padding-bottom:9px;}
  .amtbig input{flex:1; border:none; outline:none; font-family:inherit; font-size:30px; font-weight:800; text-align:right; min-width:0; background:none;}
  .amtbig span{font-size:16px; font-weight:800; color:var(--sub); margin-left:6px;}
  .quick{display:flex; gap:7px; margin-top:12px;}
  .quick span{flex:1; height:38px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
    border-radius:11px; background:#fff; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer;}
  .calc{margin-top:16px; padding:14px 16px; border-radius:13px; background:var(--tile);}
  .crow{display:flex; justify-content:space-between; font-size:13px; padding:4px 0;}
  .crow .v{font-weight:700;}
  .crow.tot{margin-top:8px; padding-top:10px; border-top:1px solid var(--border); font-size:14px;}
  .crow.tot .v{font-size:18px; font-weight:800;}
  /* 발송 완료 */
  .doneview{display:none; text-align:center; padding-top:20px;}
  .doneview.on{display:block;}
  .doneview .ck{width:74px; height:74px; margin:0 auto 18px; border-radius:50%; background:linear-gradient(180deg,#EAF1FF,#DCE8FF);
    display:flex; align-items:center; justify-content:center; box-shadow:0 12px 26px -10px rgba(37,99,235,.6);}
  .doneview .ck iconify-icon{font-size:40px; color:var(--primary);}
  .doneview h2{font-size:21px; font-weight:800; letter-spacing:-.4px;}
  .doneview p{font-size:14px; color:var(--sub); margin-top:11px; line-height:1.7;}
  .linkbox{display:flex; align-items:center; gap:9px; margin-top:22px; padding:14px 15px; border-radius:13px;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.05); text-align:left;}
  .linkbox .u{flex:1; min-width:0; font-size:12.5px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .linkbox button{flex:0 0 auto; height:36px; padding:0 13px; border:none; border-radius:10px; background:var(--primary-50);
    color:var(--primary-dark); font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;}

  /* 계좌 선택 시트 */
  .dim{position:absolute; inset:0; background:rgba(15,20,30,.5); opacity:0; pointer-events:none; transition:opacity .3s; z-index:20;}
  .dim.on{opacity:1; pointer-events:auto;}
  .sheet{position:absolute; left:0; right:0; bottom:0; z-index:21; background:#fff; border-radius:24px 24px 0 0;
    max-height:86%; overflow-y:auto; padding:10px 20px 26px; transform:translateY(100%);
    transition:transform .4s cubic-bezier(.2,.7,.2,1); scrollbar-width:none;}
  .sheet::-webkit-scrollbar{display:none;}
  .sheet.on{transform:translateY(0);}
  .sheet .handle{width:44px; height:4px; border-radius:3px; background:#DDE2E8; margin:0 auto 14px;}
  .sheet .s-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet .s-top h3{font-size:18px; font-weight:800; letter-spacing:-.3px;}
  .sheet .s-x{width:34px; height:34px; border:none; background:none; font-size:19px; color:var(--sub); cursor:pointer;}
  .ac{display:flex; align-items:center; gap:12px; padding:14px; border:1.5px solid var(--line); border-radius:14px;
    margin-bottom:9px; cursor:pointer; transition:.18s;}
  .ac.on{border-color:var(--primary); background:var(--primary-50);}
  .ac .ic{width:40px; height:40px; flex:0 0 auto; border-radius:13px; background:var(--tile);
    display:flex; align-items:center; justify-content:center;}
  .ac .ic iconify-icon{font-size:20px; color:var(--primary);}
  .ac .tx{flex:1; min-width:0;}
  .ac .tx .t{font-size:14.5px; font-weight:700;}
  .ac .tx .s{font-size:12px; color:var(--placeholder); margin-top:2px;}
  .ac .ck{font-size:21px; color:var(--line); flex:0 0 auto;}
  .ac.on .ck{color:var(--primary);}
  .ac-h{font-size:13px; font-weight:800; color:var(--sub); margin:20px 2px 10px;}
  .banks{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:11px;}
  .bk{height:38px; padding:0 13px; border:1.5px solid var(--line); border-radius:11px; background:#fff;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer; transition:.18s;}
  .bk.on{border-color:var(--primary); background:var(--primary-50); color:var(--primary-dark);}
  #acNo{width:100%;}
  .acmsg{font-size:12px; color:var(--placeholder); margin:9px 2px 0; line-height:1.6;}
  .acmsg.ok{color:var(--sub); font-weight:700;}
  .acbtn{width:100%; height:52px; margin-top:14px; border:none; border-radius:14px; cursor:pointer;
    background:var(--primary-grad); box-shadow:var(--btn-shadow); color:#fff; font-family:inherit; font-size:15px; font-weight:700;}
  .acbtn:disabled{background:var(--tile); box-shadow:none; color:var(--placeholder); cursor:default;}

  /* 증빙 서류 */
  .updrop{border:2px dashed var(--border); border-radius:14px; background:var(--bg); padding:26px 14px; text-align:center; cursor:pointer;}
  .updrop iconify-icon{font-size:30px; color:var(--primary);}
  .updrop .ut{font-size:14px; font-weight:700; margin-top:9px;}
  .updrop .us{font-size:12px; color:var(--placeholder); margin-top:5px;}
  .filerow{display:flex; align-items:center; gap:10px; padding:13px 14px; border-radius:12px; background:var(--primary-50);}
  .filerow iconify-icon{font-size:19px; color:var(--primary);}
  .filerow .fn{flex:1; min-width:0; font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .filerow .fx{flex:0 0 auto; border:none; background:none; font-family:inherit; font-size:12.5px; font-weight:700; color:var(--placeholder); cursor:pointer;}
  .dochelp{display:flex; align-items:center; gap:7px; margin-top:12px; padding:12px 13px; border-radius:12px;
    border:1.5px solid var(--line); font-size:13px; font-weight:700; color:var(--sub); cursor:pointer;}
  .dochelp > iconify-icon:first-child{font-size:17px; color:var(--primary);}
  .dochelp .gv{margin-left:auto; font-size:17px; color:var(--icon-off);}
  .stepbox{margin-top:22px; padding:16px 18px; border-radius:16px; background:var(--card); text-align:left;
    box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .stepbox .sp{display:flex; gap:11px; padding:9px 0;}
  .stepbox .sp .no{width:22px; height:22px; flex:0 0 auto; border-radius:50%; background:var(--tile);
    color:var(--placeholder); font-size:11.5px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .stepbox .sp.on .no{background:var(--primary); color:#fff;}
  .stepbox .sp .tx{font-size:13px; color:var(--placeholder); line-height:1.6;}
  .stepbox .sp.on .tx{color:var(--ink); font-weight:700;}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>

  <div class="topbar"><div class="back" onclick="location.href='9_홈_사업자.html'">‹</div><div class="ttl">결제 요청</div></div>

  <!-- 발송 완료 -->
  <div class="body doneview on" id="doneView">
    <div class="ck"><iconify-icon icon="mingcute:send-plane-fill"></iconify-icon></div>
    <h2>서류 심사를 시작했어요</h2>
    <p>보통 <b>30분 이내</b>에 끝나요.<br>승인되면 <b>한빛식자재</b>에게 결제 링크가 문자로 발송됩니다.</p>

    <div class="stepbox">
      <div class="sp on"><span class="no">1</span><span class="tx">서류 심사 중 · 결과를 알림으로 알려드려요</span></div>
      <div class="sp"><span class="no">2</span><span class="tx">승인되면 거래처에 결제 링크 발송</span></div>
      <div class="sp"><span class="no">3</span><span class="tx">거래처가 결제하면 내 계좌로 입금</span></div>
    </div>

    <div class="note" style="text-align:left">
      <iconify-icon icon="mingcute:time-fill"></iconify-icon>
      <div>승인되면 <b>링크 복사 · 문자 재발송</b>을 요청 목록에서 할 수 있어요.<br>링크는 발송 당일 자정까지 열려요.</div>
    </div>
  </div>

  <div class="footer" id="foot2">
    <div class="two">
      <button class="btn ghost" onclick="location.href='9_홈_사업자.html'">홈으로</button>
      <button class="btn" onclick="location.href='42_요청1_유형.html'">또 요청하기</button>
    </div>
  </div>

</div>
<script src="app.js"></script>
<script>

/* 입금받을 계좌 선택 · 등록 */


/* 복사되는 링크는 홈페이지 결제 화면으로 실제 연결됨 */

function toast(m){
  var t = document.createElement('div');
  t.textContent = m;
  t.style.cssText = "position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:#191F28;color:#fff;padding:12px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:30;opacity:0;transition:.2s;white-space:nowrap";
  document.querySelector('.phone').appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity = '1'; });
  setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 200); }, 1600);
}
</script>
</body>
</html>
