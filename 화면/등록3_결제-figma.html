<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>결제 등록 · 결제와 확인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--primary:#156FF9; --primary-dark:#0F5AD1; --primary-50:#EFF4FF; --line:#ECEEF1;
    --sub:#4E5968; --ink:#1D2023; --placeholder:#8B95A1; --danger:#DC2626;
    --grad:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #ffffff), var(--primary));}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{scrollbar-width:none;} body::-webkit-scrollbar{display:none;}
  body{font-family:'Pretendard',sans-serif; color:var(--ink); background:#EDF0F4;
    word-break:keep-all; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:100%; max-width:480px; min-height:100svh; margin:0 auto; background:#fff;
    box-shadow:0 0 44px rgba(15,23,42,.10); display:flex; flex-direction:column;}
  .topbar{height:52px; position:sticky; top:0; z-index:50; background:#fff; display:flex; align-items:center; padding:0 10px;}
  .back{width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:16px; font-weight:700; margin-right:40px;}
  .prog4{display:flex; gap:6px; margin:2px 20px 8px;}
  .prog4 i{flex:1; height:4px; border-radius:2px; background:var(--line);}
  .prog4 i.on{background:var(--primary);}
  .stepcap{margin:0 20px; font-size:12.5px; font-weight:700; color:var(--placeholder);}
  .body{flex:1; padding:10px 20px 30px;}
  .q{font-size:21px; font-weight:800; letter-spacing:-.3px; margin:6px 0 18px;}
  .fld{margin-bottom:18px;}
  .fld > label{display:block; font-size:13.5px; font-weight:700; margin-bottom:8px;}
  .cardrow{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:8px;
    padding:14px 14px; margin-bottom:8px; cursor:pointer;}
  .cardrow.on{border-color:var(--primary); background:var(--primary-50);}
  .cardrow .chip{width:44px; height:30px; border-radius:7px; flex:0 0 auto;}
  .chip.a{background:linear-gradient(135deg,#22375f,#0e1a30);}
  .chip.b{background:linear-gradient(135deg,#1596a6,#0a3f70);}
  .chip.plus{background:#F1F3F6; display:flex; align-items:center; justify-content:center; color:var(--placeholder); font-size:18px;}
  .cardrow .t{flex:1; min-width:0; font-size:15px; font-weight:700;}
  .cardrow .t small{display:block; font-size:12px; font-weight:500; color:var(--placeholder);}
  .cardrow iconify-icon{color:var(--primary); font-size:20px; opacity:0;}
  .cardrow.on iconify-icon{opacity:1;}
  select.in{width:100%; height:50px; border:1px solid var(--line); border-radius:8px;
    padding:0 14px; font:inherit; font-size:15.5px; background:#fff; outline:none;}
  .seg2{display:flex; gap:8px;}
  .seg2 button{flex:1; height:48px; border-radius:8px; border:1px solid var(--line); background:#fff;
    font:inherit; font-size:14.5px; font-weight:700; color:var(--sub); cursor:pointer;}
  .seg2 button.on{border-color:var(--primary); background:var(--primary-50); color:var(--primary-dark);}
  .datebtn{text-align:left; color:var(--placeholder); cursor:pointer;}
  .datebtn.set{color:var(--ink); font-weight:700;}
  .ddim{position:fixed; inset:0; z-index:110; background:rgba(15,23,42,.45); display:none;}
  .ddim.on{display:block;}
  .dsheet{position:fixed; left:50%; bottom:0; transform:translateX(-50%) translateY(102%); z-index:120;
    width:100%; max-width:480px; background:#fff; border-radius:24px 24px 0 0;
    padding:14px 20px 30px; transition:transform .3s ease;}
  .dsheet.on{transform:translateX(-50%) translateY(0);}
  .dsheet .handle{width:44px; height:4px; border-radius:3px; background:#DDE2E8; margin:0 auto 14px;}
  .dhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .dhead b{font-size:16px;}
  .dhead button{width:36px; height:36px; border:none; background:#F7F8FA; border-radius:8px;
    font-size:16px; color:var(--ink); cursor:pointer;}
  .dhead button:disabled{color:#C6CDD6; cursor:default;}
  .dgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center;}
  .dgrid .wd{font-size:12px; color:var(--placeholder); padding:6px 0;}
  .dgrid button{height:40px; border:none; background:none; border-radius:999px; font:inherit;
    font-size:14.5px; color:var(--ink); cursor:pointer;}
  .dgrid button:disabled{color:#C6CDD6; cursor:default;}
  .dgrid button.pick{background:var(--primary); background:var(--grad); color:#fff; font-weight:700;}
  .mmcap{margin:16px 2px 8px; font-size:13.5px; font-weight:700; color:var(--sub);}
  .drep{display:flex; gap:8px; margin-top:16px;}
  .drep button{flex:1; height:44px; border-radius:8px; border:1px solid var(--line); background:#fff;
    font:inherit; font-size:14px; font-weight:700; color:var(--sub); cursor:pointer;}
  .drep button.on{border-color:var(--primary); background:var(--primary-50); color:var(--primary-dark);}
  .dok{width:100%; height:50px; margin-top:10px; border:none; border-radius:8px; font:inherit;
    font-size:15.5px; font-weight:700; color:#fff; cursor:pointer;
    background:var(--primary); background:var(--grad);}
  .dok:disabled{opacity:.45; cursor:default;}
  .appgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .appc{display:flex; flex-direction:column; align-items:center; gap:7px; padding:14px 4px 12px;
    border:1px solid var(--line); border-radius:8px; background:#fff; font:inherit;
    font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer;}
  .appc.on{border-color:var(--primary); background:var(--primary-50);}
  .appc img{height:26px; max-width:64px; object-fit:contain;}
  .c4{display:flex; gap:8px;}
  .c4 .in{min-width:0; padding:0; text-align:center;}
  .two{display:flex; gap:10px;}
  .two > div{flex:1;}
  .two label{display:block; font-size:13.5px; font-weight:700; margin-bottom:7px;}
  #새카드폼{margin-top:14px; border-top:1px dashed var(--line); padding-top:14px;}
  #새카드폼 .sub{display:block; font-size:13.5px; font-weight:700; margin-bottom:7px;}
  .in{width:100%; height:50px; border:1px solid var(--line); border-radius:8px; padding:0 14px;
    font:inherit; font-size:15.5px; outline:none;}
  .hint{margin-top:6px; font-size:12px; color:var(--placeholder);}
  .hint.err{color:var(--danger); font-weight:700;}
  .sum{margin-top:20px; border:1px solid var(--line); border-radius:8px; padding:15px 16px;}
  .sum b{display:block; font-size:13.5px; margin-bottom:9px;}
  .sr{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px;}
  .sr span{color:var(--placeholder);}
  .sr em{font-style:normal; font-weight:700; text-align:right;}
  .hint{margin-top:10px; font-size:12px; color:var(--placeholder);}
  .navs{display:flex; gap:10px; margin-top:22px;}
  .navs button{flex:1; height:52px; border-radius:8px; font:inherit; font-size:15.5px; font-weight:700; cursor:pointer;}
  .prev{border:1px solid var(--line); background:#fff; color:var(--ink);}
  .next{border:none; color:#fff; background:var(--primary); background:var(--grad);
    box-shadow:0 4px 12px color-mix(in srgb, var(--primary) 32%, transparent);}
  /* 휴대폰 글줄 정리: 본문은 줄 끝까지 채우고 제목·강조는 어절을 지킨다 */
  p, li, dd, .a, .dr, .tx{word-break:normal; overflow-wrap:anywhere; letter-spacing:-.2px;}
  p b, li b, strong, h1, h2, h3, b{word-break:keep-all;}

</style>

<style id="figma-fix-app">/* 피그마 가져오기용(앱) */
*,*::before,*::after{animation:none!important;transition:none!important}
.apphull{min-height:0!important; position:relative!important;}
body{position:relative!important;} /* .atab 이 body 직계라 기준을 화면이 아닌 문서 전체로 */
.atab{position:absolute!important; left:0!important; right:0!important; bottom:0!important; transform:none!important; width:100%!important; max-width:none!important;}
.figma-drawer .drawer{height:780px!important; top:0!important; bottom:auto!important;}
.figma-drawer .dim{height:780px!important; top:0!important; bottom:auto!important;}
.figma-sheet .docsheet, .figma-sheet .dsheet, .figma-sheet .pksheet, .figma-sheet .gsheet{max-height:none!important;}
/* figma-app-scroll: 안쪽 스크롤 틀을 펼쳐 페이지가 내용 길이만큼 길어지게 (가져오기는 화면 높이만큼만 담기 때문) */
html,body{height:auto!important; max-height:none!important; overflow:visible!important;}
.apphull{height:auto!important; max-height:none!important; overflow:visible!important;}
/* ?slides=all → 롤링 배너 7장을 세로로 전부 펼침 */
.figma-slides .atrack{flex-direction:column!important; width:100%!important; transform:none!important;}
.figma-slides .aup{flex:none!important; width:100%!important; margin:0 0 12px!important;}
.figma-slides #uspdots{display:none!important;}
/* ?slides=row → 롤링 배너 7장만 가로 한 줄(장당 360px)로 */
.figma-row body{width:2520px!important; margin:0!important; padding:0!important; background:#fff!important; display:block!important; min-height:0!important;}
.figma-row .apphull{width:2520px!important; max-width:none!important; box-shadow:none!important; padding:0!important;}
.figma-row .sheet{width:2520px!important; border-radius:0!important; padding:0!important; margin:0!important;}
.figma-row .aband{overflow:visible!important; margin:0!important; padding:0!important; width:2520px!important; border-radius:0!important;}
.figma-row .atrack{display:flex!important; flex-direction:row!important; transform:none!important; width:2520px!important;}
.figma-row .aup{flex:0 0 360px!important; width:360px!important; margin:0!important;}
.figma-row #uspdots{display:none!important;}
/* 기본 앱 홈: 배너 7장이 프레임 오른쪽 밖으로 이어져 보이게 (잘라내기 해제) */
.figma-strip .sheet, .figma-strip .uspband, .figma-strip .aband{overflow:visible!important;}
.figma-strip .atrack{width:max-content!important;}
/* 목록 행: 아이콘과 글자 사이 간격을 gap 대신 margin 으로 (피그마 가져오기에서 gap 이 빠지던 문제) */
.gbtn.grow{gap:0!important;} .gbtn.grow > .ic{margin-right:12px!important;}
/* ?only=1: 시트만 남긴 화면 */
.figma-only body, .figma-only .apphull{background:transparent!important; box-shadow:none!important; min-height:0!important; padding:0!important; margin:0!important; width:360px!important; max-width:none!important;}
.figma-only .atab{display:none!important;}
</style>

<body>
<div class="phone">
  <div class="topbar"><div class="back" onclick="location.href='등록2_정보.html'">‹</div><div class="ttl">결제 등록</div></div>
  <div class="prog4"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
  <div class="stepcap">STEP 3 / 4</div>

  <div class="body">
    <div class="q">어떻게 결제할까요?</div>

    <div class="fld"><label>누가 결제하나요?</label>
      <div class="seg2">
        <button type="button" id="자기" class="on">내가 결제</button>
        <button type="button" id="요청">다른 사람에게 요청</button>
      </div>
    </div>

    <div id="요청칸" style="display:none">
      <div class="fld"><label>요청받을 분 이름</label>
        <input class="in" id="요청이름" placeholder="예: 김부모">
      </div>
      <div class="fld"><label>요청받을 분 휴대폰 번호</label>
        <input class="in" id="요청번호" inputmode="numeric" placeholder="- 없이 숫자만">
      </div>
      <p class="hint" style="margin-top:-4px">문자로 결제 링크를 보내드려요. 상대가 카드로 결제하면<br>계약서에 적힌 계좌로 송금됩니다.</p>
    </div>

    <div id="자기칸">
    <div class="fld"><label>결제 수단</label>
      <div class="seg2">
        <button type="button" id="수단신용" class="on">신용카드</button>
        <button type="button" id="수단앱">앱카드</button>
      </div>
    </div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var 저장 = {};
  try { 저장 = JSON.parse(sessionStorage.getItem('lp_reg') || '{}'); } catch (e) {}

  function 수단(앱임) {
    $('수단신용').classList.toggle('on', !앱임);
    $('수단앱').classList.toggle('on', 앱임);
    document.getElementById('탭신용').style.display = 앱임 ? 'none' : '';
    document.getElementById('탭앱').style.display = 앱임 ? '' : 'none';
  }
  $('수단신용').addEventListener('click', function () { 수단(false); });
  $('수단앱').addEventListener('click', function () { 수단(true); });
  document.querySelectorAll('.appc').forEach(function (r) {
    r.addEventListener('click', function () {
      document.querySelectorAll('.appc').forEach(function (x) { x.classList.toggle('on', x === r); });
    });
  });
  if (저장.수단 === '앱카드') {
    수단(true);
    document.querySelectorAll('.appc').forEach(function (x) { x.classList.toggle('on', x.dataset.v === 저장.카드); });
  }

  document.querySelectorAll('.cardrow').forEach(function (r) {
    r.addEventListener('click', function () {
      document.querySelectorAll('.cardrow').forEach(function (x) { x.classList.toggle('on', x === r); });
      $('새카드폼').style.display = r.dataset.v === '새 카드' ? '' : 'none';
    });

  if (저장.할부) $('할부').value = 저장.할부;

  function 시점(예약임) {
    $('즉시').classList.toggle('on', !예약임);
    $('예약').classList.toggle('on', 예약임);
    $('예약일버튼').style.display = 예약임 ? 'block' : 'none';
    $('시점힌트').textContent = 예약임 ? '정한 날짜에 맞춰 자동으로 송금됩니다. 전날까지 취소할 수 있어요.' : '검토가 끝나면 바로 송금됩니다.';
  }
  $('즉시').addEventListener('click', function () { 시점(false); });
  $('예약').addEventListener('click', function () { 시점(true); });
  if (저장.시점 === '예약') { 시점(true); if (저장.예약일) 날짜적용(저장.예약일, 저장.반복 === '매달'); }

  /* 하단 달력 시트 */
  var 보임 = new Date(); 보임.setDate(1);
  var 오늘 = new Date(); 오늘.setHours(0,0,0,0);
  function 두자리(n){ return (n < 10 ? '0' : '') + n; }
  var 고른날 = '', 매달임 = false;
  function 날짜적용(v, 매달) {
    $('예약일').value = v;
    매달임 = !!매달;
    var 표기 = v.replace(/-/g, '.');
    $('예약일버튼').textContent = 매달 ? '매달 ' + Number(v.slice(8)) + '일 · ' + 표기 + ' 첫 송금' : 표기;
    $('예약일버튼').classList.add('set');
  }
  function 달그리기() {
    $('d제목').textContent = 보임.getFullYear() + '년 ' + (보임.getMonth() + 1) + '월';
    var 이번달 = new Date(오늘.getFullYear(), 오늘.getMonth(), 1);
    $('d이전').disabled = 보임 <= 이번달;
    var g = $('dgrid'); g.innerHTML = '';
    ['일','월','화','수','목','금','토'].forEach(function (w) {
      var el = document.createElement('span'); el.className = 'wd'; el.textContent = w; g.appendChild(el);
    });
    for (var i = 0; i < 보임.getDay(); i++) g.appendChild(document.createElement('span'));
    var 끝 = new Date(보임.getFullYear(), 보임.getMonth() + 1, 0).getDate();
    for (var d = 1; d <= 끝; d++) {
      (function (d) {
        var 날 = new Date(보임.getFullYear(), 보임.getMonth(), d);
        var v = 날.getFullYear() + '-' + 두자리(날.getMonth() + 1) + '-' + 두자리(d);
        var bt = document.createElement('button'); bt.type = 'button'; bt.textContent = d;
        if (날 <= 오늘) bt.disabled = true;
        if (고른날 === v) bt.classList.add('pick');
        bt.addEventListener('click', function () {
          고른날 = v; 달그리기();
        });
        g.appendChild(bt);
      })(d);
    }
  }
  function 시트열기(열림) {
    if (열림) {
      고른날 = $('예약일').value || '';
      if (매달임 && 고른날) 고른일 = Number(고른날.slice(8));
      모드보기(매달임);
    }
    document.getElementById('ddim').classList.toggle('on', 열림);
    document.getElementById('dsheet').classList.toggle('on', 열림);
    if (열림) 달그리기();
    $('d확인').disabled = !고른날;
  }
  var 고른일 = 0;
  function 확인상태() {
    var 매달모드 = $('rep매달').classList.contains('on');
    $('d확인').disabled = 매달모드 ? !고른일 : !고른날;
  }
  var 원래달그리기 = 달그리기;
  달그리기 = function () { 원래달그리기(); 확인상태(); };
  function 매달그리기() {
    var g = $('mgrid'); g.innerHTML = '';
    for (var d = 1; d <= 32; d++) {
      (function (d) {
        var bt = document.createElement('button'); bt.type = 'button';
        bt.textContent = d === 32 ? '말일' : d;
        if (d === 32) bt.style.fontSize = '12.5px';
        if (고른일 === d) bt.classList.add('pick');
        bt.addEventListener('click', function () { 고른일 = d; 매달그리기(); });
        g.appendChild(bt);
      })(d);
    }
    확인상태();
  }
  function 모드보기(매달모드) {
    $('rep매달').classList.toggle('on', 매달모드);
    $('rep한번').classList.toggle('on', !매달모드);
    document.getElementById('한번모드').style.display = 매달모드 ? 'none' : '';
    document.getElementById('매달모드').style.display = 매달모드 ? '' : 'none';
    if (매달모드) 매달그리기(); else 달그리기();
  }
  $('rep한번').addEventListener('click', function () { 모드보기(false); });
  $('rep매달').addEventListener('click', function () { 모드보기(true); });
  $('d확인').addEventListener('click', function () {
    var 매달모드 = $('rep매달').classList.contains('on');
    if (매달모드) {
      if (!고른일) return;
      var 오늘일 = 28;                      /* 2026-08-28 기준 */
      var 말일임 = 고른일 === 32;
      var y = 2026, m = (말일임 || 고른일 > 오늘일) ? 8 : 9;
      var 끝 = new Date(y, m, 0).getDate();
      var d = 말일임 ? 끝 : Math.min(고른일, 끝);
      var v = y + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
      날짜적용(v, true);
      if (말일임) {
        $('예약일버튼').textContent = '매달 말일 · ' + v.replace(/-/g, '.') + ' 첫 송금';
      }
    } else {
      if (!고른날) return;
      날짜적용(고른날, false);
    }
    시트열기(false);
  });
  $('예약일버튼').addEventListener('click', function () { 시트열기(true); });
  document.getElementById('ddim').addEventListener('click', function () { 시트열기(false); });
  $('d이전').addEventListener('click', function () { 보임.setMonth(보임.getMonth() - 1); 달그리기(); });
  $('d다음').addEventListener('click', function () { 보임.setMonth(보임.getMonth() + 1); 달그리기(); });

  var 요청모드 = false;
  function 결제자(요청임) {
    요청모드 = 요청임;
    $('요청').classList.toggle('on', 요청임);
    $('자기').classList.toggle('on', !요청임);
    $('요청칸').style.display = 요청임 ? 'block' : 'none';
    $('자기칸').style.display = 요청임 ? 'none' : 'block';
  }
  $('자기').addEventListener('click', function () { 결제자(false); });
  $('요청').addEventListener('click', function () { 결제자(true); });

  $('다음').addEventListener('click', function () {
    var 예약임 = $('예약').classList.contains('on');
    if (예약임 && !$('예약일').value) {
      $('오류').style.display = 'block'; $('오류').textContent = '예약 송금 날짜를 골라주세요.'; return;
    }
    if (요청모드) {
      var 이름 = $('요청이름').value.trim(), 번호 = $('요청번호').value.replace(/[^0-9]/g, '');
      if (!이름 || 번호.length < 10) {
        $('오류').style.display = 'block';
        $('오류').textContent = '요청받을 분 이름과 휴대폰 번호를 입력해주세요.'; return;
      }
      저장.결제자 = '요청';
      저장.요청이름 = 이름;
      저장.요청번호 = 번호;
      저장.수단 = '결제 요청';
      저장.카드 = 이름 + '님에게 요청';
      저장.할부 = '요청받는 분이 선택';
      저장.시점 = 예약임 ? '예약' : '즉시';
      저장.예약일 = 예약임 ? $('예약일').value : '';
      저장.반복 = (예약임 && 매달임) ? '매달' : '한번';
      sessionStorage.setItem('lp_reg', JSON.stringify(저장));
      location.href = '등록4_서류.html';
      return;
    }
    var 앱임 = $('수단앱').classList.contains('on');
    저장.결제자 = '본인';
    저장.수단 = 앱임 ? '앱카드' : '신용카드';
    저장.카드 = 앱임 ? document.querySelector('.appc.on').dataset.v
                     : document.querySelector('.cardrow.on').dataset.v;
    if (!앱임 && 저장.카드 === '새 카드') {
      var 번호다 = ['cno1','cno2','cno3','cno4'].every(function (k) { return $(k).value.length === 4; });
      if (!번호다 || !$('cexp').value || $('ccvc').value.length !== 3 || $('cpw').value.length !== 2) {
        $('오류').style.display = 'block'; $('오류').textContent = '새 카드 정보를 모두 입력해주세요.'; return;
      }
      저장.카드 = '새 카드 ' + $('cno4').value;
    }
    저장.할부 = $('할부').value;
    저장.시점 = 예약임 ? '예약' : '즉시';
    저장.예약일 = 예약임 ? $('예약일').value : '';
    저장.반복 = (예약임 && 매달임) ? '매달' : '한번';
    sessionStorage.setItem('lp_reg', JSON.stringify(저장));
    location.href = '등록4_서류.html';
  });
})();

 document.querySelectorAll('img').forEach(function(im){var f=getComputedStyle(im).filter||''; if(f.indexOf('invert')<0) return;

(function(){var q=new URLSearchParams(location.search);
 if(q.get('drawer')==='open'){document.documentElement.classList.add('figma-drawer'); if(typeof drawer==='function') drawer(true);}
 else{['drawer','dim'].forEach(function(id){var e=document.getElementById(id); if(e) e.remove();});}
 if(q.get('open')==='all'){document.querySelectorAll('details').forEach(function(d){d.open=true;});}
 var doList=q.get('do');
 if(q.get('sheet')==='1'){document.documentElement.classList.add('figma-sheet'); var b=document.getElementById('ap-doclink')||document.querySelector('.pickbtn'); if(b) b.click();}
 else if(doList){document.documentElement.classList.add('figma-sheet');
   doList.split(';').forEach(function(step){var i=step.indexOf(':'), kind=step.slice(0,i), arg=step.slice(i+1), el=null;
     if(kind==='click') el=document.querySelector(arg);
     else if(kind==='clickn'){var pp=arg.split('|'); el=document.querySelectorAll(pp[0])[+pp[1]||0];}
     else if(kind==='text'){el=Array.prototype.find.call(document.querySelectorAll('button,a,div,span,label,li'), function(e){return e.children.length<3 && e.textContent.trim()===arg;});}
     if(el){el.click();}});}
 /* 열려 있지 않은 시트·서랍·어둠막은 전부 지운다 (화면 밖 아래에 숨어 있다가 긴 프레임에 찍히던 문제) */
 var OVL='.docdim,.docsheet,.ask-layer,.pkdim,.pksheet,.ddim,.dsheet,.gdim,.gsheet,.drawer,.dim';
 function isOn(e){ var cs=getComputedStyle(e); if(cs.display==='none'||cs.visibility==='hidden'||cs.opacity==='0') return false;
   var r=e.getBoundingClientRect(); return r.height>0 && r.top<innerHeight-1 && r.bottom>1; }   /* 지금 화면 안에 실제로 보이는 것만 */
 document.querySelectorAll(OVL).forEach(function(e){ if(!isOn(e)) e.remove(); });
 /* ?only=1 → 열린 시트(또는 서랍)만 남기고 페이지는 전부 숨겨, 시트 하나가 곧 프레임이 되게 */
 if(q.get('only')==='1'){
   var panels=Array.prototype.filter.call(document.querySelectorAll(OVL), function(e){ return isOn(e) && !/dim|ask-layer/.test(e.className); });
   /* 여러 개가 겹쳐 열려 있으면 맨 위(z-index 큰 것)를, 같으면 큰 것을 고른다 */
   panels.sort(function(a,b){ var za=+getComputedStyle(a).zIndex||0, zb=+getComputedStyle(b).zIndex||0; return (zb-za) || (b.getBoundingClientRect().height - a.getBoundingClientRect().height); });
   var panel=panels[0];
   if(panel){
     document.querySelectorAll('.docdim,.pkdim,.ddim,.gdim,.dim').forEach(function(e){e.remove();});
     var node=panel; while(node && node!==document.body){ var par=node.parentElement;
       Array.prototype.forEach.call(par.children, function(c){ if(c!==node) c.style.setProperty('display','none','important'); }); node=par; }
     ['position','transform','left','right','top','bottom','margin','max-height','height'].forEach(function(k){ panel.style.setProperty(k, k==='position'?'static':(k==='transform'?'none':(k==='margin'?'0':'auto')),'important'); });
     panel.style.setProperty('width','360px','important'); panel.style.setProperty('max-width','none','important');
     document.documentElement.classList.add('figma-only');
   }
 }
 /* 롤링 배너: 자동 넘김을 멈추고 1번 장에 고정 · ?slides=all 이면 7장(중복 제거) 전부 세로로 */
 for(var t=1;t<50000;t++){clearInterval(t);}
 var band=document.querySelector('.uspband'), tk=document.getElementById('usptrack');
 if(band&&tk){var ups=Array.prototype.slice.call(tk.querySelectorAll('.aup')), seen={}, uniq=[];
   ups.forEach(function(u){var im=u.querySelector('img'); var k=im?im.getAttribute('src'):u.textContent.trim(); if(!seen[k]){seen[k]=1; uniq.push(u);}});
   if(q.get('slides')==='row'){document.documentElement.classList.add('figma-row'); ups.forEach(function(u){if(uniq.indexOf(u)<0) u.remove();});
     /* 배너는 제자리에 두고(스타일이 조상에 묶여 있음) 조상 사슬의 형제들만 숨긴다 */
     var node=band; while(node && node!==document.body){ var par=node.parentElement;
       Array.prototype.forEach.call(par.children, function(c){ if(c!==node) c.style.setProperty('display','none','important'); }); node=par; }
     tk.style.setProperty('transform','none','important');}
   else if(q.get('slides')==='all'){document.documentElement.classList.add('figma-slides'); ups.forEach(function(u){if(uniq.indexOf(u)<0) u.remove();}); tk.style.setProperty('transform','none','important');}
   else if(q.get('slides')==='strip'){ /* 7장을 왼쪽부터 가로로 쭉 (프레임 밖으로 이어짐) */
     document.documentElement.classList.add('figma-strip'); ups.forEach(function(u){if(uniq.indexOf(u)<0) u.remove();});
     tk.style.transition='none'; tk.style.setProperty('transform','none','important');}
   else{ /* 기본: 1번 장에 고정 */
     var f=uniq[0]; tk.style.transition='none'; tk.style.transform='translateX('+(band.clientWidth/2-(f.offsetLeft+f.offsetWidth/2))+'px)';}
 }
 /* 안쪽에서 스크롤되는 상자를 전부 펼친다 */
 document.querySelectorAll('*').forEach(function(el){var cs=getComputedStyle(el);
   if(/(auto|scroll)/.test(cs.overflowY) && el.scrollHeight>el.clientHeight+4){el.style.setProperty('overflow','visible','important'); el.style.setProperty('height','auto','important'); el.style.setProperty('max-height','none','important');}});
 /* 그림 크기 고정: 그려진 크기를 px 로 못 박아 피그마에서 찌그러지지 않게 (지연 로딩도 즉시) */
 document.querySelectorAll('img').forEach(function(im){im.loading='eager';});
 setTimeout(function(){document.querySelectorAll('img').forEach(function(im){var r=im.getBoundingClientRect(); if(r.width>0&&r.height>0){im.style.setProperty('width',r.width+'px','important'); im.style.setProperty('height',r.height+'px','important'); im.style.setProperty('max-width','none','important'); im.style.setProperty('max-height','none','important');}});},250);
})();
/* 글줄: 크롬이 실제로 줄을 끊은 자리에 <br> 을 넣는다 (피그마는 한글을 글자 단위로 끊어 '누르세/요'가 됨) */
/* 여러 줄 글은 줄을 미리 끊지 않고, 높이만 그대로 둔 채 한 줄(nowrap)로 만들어 html.to.design 이 엔터를 박지 않게 한다.
   가져온 뒤 피그마에서 상자 폭만 원래대로 돌리면(MCP) 글이 자연스럽게 흐른다 */
function figmaFlow(){
  /* 태그 없이 바로 놓인 글 덩어리(예: div 안의 맨글)는 block span 으로 감싼다 — 배치는 그대로, 상자만 생김 */
  document.querySelectorAll('div,article,section,li,td,dd').forEach(function(box){
    if(box.closest('svg,script,style')) return; if(!box.children.length) return;
    /* 형제 요소가 전부 블록일 때만 (문장 속 b·span 같은 인라인이 섞여 있으면 문단이 끊기므로 건드리지 않음) */
    var allBlock=Array.prototype.every.call(box.children, function(c){ var d=getComputedStyle(c).display; return d!=='inline' && d!=='inline-block' && d!=='inline-flex'; });
    if(!allBlock) return;
    Array.prototype.slice.call(box.childNodes).forEach(function(n){ if(n.nodeType===3 && n.nodeValue.trim()){ var sp=document.createElement('span'); sp.className='figma-txt'; sp.style.display='block'; box.insertBefore(sp,n); sp.appendChild(n); } });
  });
  var sel='p,li,h1,h2,h3,h4,dd,dt,summary,label,b,strong,em,span,div,.tx,.gtx,.dbody,.dh,.sub,.lead,.q,.a,td,th';
  document.querySelectorAll(sel).forEach(function(el){
    if(el.closest('svg,script,style,textarea,input,iconify-icon')) return;
    var cs=getComputedStyle(el); if(cs.display==='none'||cs.whiteSpace==='nowrap'||cs.whiteSpace==='pre') return;
    if(/^(B|STRONG|EM|SPAN)$/.test(el.tagName) && cs.display==='inline') return;   /* 문장 속 강조는 부모 문단이 처리 */
    if(el.querySelector('br,img,svg,ul,ol,div,p,table,button')) return;
    if(!el.textContent.trim()) return;
    var r=el.getBoundingClientRect(); var lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.5; if(r.height<lh*1.6) return;
    el.style.setProperty('white-space','nowrap','important'); el.style.setProperty('height',r.height+'px','important');
    el.style.setProperty('overflow','visible','important'); el.style.setProperty('text-overflow','clip','important'); el.setAttribute('data-flow', String(Math.round(r.width)));
  });
}
function figmaPrebreak(){
  var sel='p,li,h1,h2,h3,h4,dd,dt,summary,label,.head-sub,.tx,.tt,.lm,small,b,em,strong,.cd,.cn,.sub';
  document.querySelectorAll(sel).forEach(function(bl){
    if(bl.closest('svg,iconify-icon,script,style,textarea,input')) return;
    var cs=getComputedStyle(bl); if(cs.display==='none'||cs.whiteSpace==='nowrap'||cs.whiteSpace==='pre') return;
    if(cs.wordBreak!=='keep-all') return;   /* 본문(글자 단위 줄바꿈)은 고정 폭 상자로 자연스럽게 흐르게 두고, 어절을 지키는 제목·강조만 줄을 미리 끊는다 */
    var lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.5; if(bl.getBoundingClientRect().height<lh*1.6) return;
    var w=document.createTreeWalker(bl,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(function(tn){ var t=tn.nodeValue; if(!t||!t.trim()) return; if(tn.parentNode.closest('svg,iconify-icon')) return;
      var r=document.createRange(), lastTop=null, breaks=[];
      for(var i=0;i<t.length;i++){ if(/\s/.test(t[i])) continue; r.setStart(tn,i); r.setEnd(tn,i+1); var rc=r.getClientRects()[0]; if(!rc||!rc.height) continue;
        if(lastTop!==null && rc.top-lastTop>rc.height*0.5) breaks.push(i); lastTop=rc.top; }
      if(!breaks.length) return;
      var pos=0, frag=document.createDocumentFragment();
      breaks.forEach(function(bi){ frag.appendChild(document.createTextNode(t.slice(pos,bi).replace(/\s+$/,''))); frag.appendChild(document.createElement('br')); pos=bi; });
      frag.appendChild(document.createTextNode(t.slice(pos).replace(/^\s+/,''))); tn.parentNode.replaceChild(frag,tn); });
  });
}
/* 기호 글자(✓ › ‹ ▾ ✕ ↗ ·)를 글꼴 윤곽 SVG로 (굵기 맞춤) — 피그마가 다른 글꼴로 그리는 문제 */
function figmaGlyphs(){
  var G=window.FIGMA_GLYPHS||{}; var chars=Object.keys(G); if(!chars.length) return;
  var re=new RegExp('['+chars.map(function(c){return '\\u'+c.charCodeAt(0).toString(16).padStart(4,'0');}).join('')+']');
  var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()){ var n=w.currentNode; if(re.test(n.nodeValue)) nodes.push(n); }
  nodes.forEach(function(tn){ var par=tn.parentNode; if(!par||par.closest('svg,script,style,textarea,iconify-icon')) return; if(par.querySelector&&par.querySelector('svg.glyph')) return;
    var core=tn.nodeValue.replace(/\s+/g,''); if(!core||core.split('').some(function(c){return !G[c];})) return;
    var cs=getComputedStyle(par), fw=+cs.fontWeight||400, ws=['400','500','600','700','800'], wk=ws.reduce(function(a,b){return Math.abs(+b-fw)<Math.abs(+a-fw)?b:a;});
    var frag=document.createDocumentFragment(), t=tn.nodeValue, buf='';
    for(var i=0;i<t.length;i++){ var c=t[i]; if(G[c]){ if(buf){frag.appendChild(document.createTextNode(buf)); buf='';}
        var g=G[c][wk]||G[c]['700']; var svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','glyph'); svg.setAttribute('viewBox','0 '+(-g.asc)+' '+g.adv+' '+(g.asc-g.desc));
        svg.setAttribute('style','display:inline-block;width:'+(g.adv/g.upm)+'em;height:'+((g.asc-g.desc)/g.upm)+'em;vertical-align:'+(g.desc/g.upm)+'em;overflow:visible');
        svg.innerHTML='<g transform="scale(1,-1)"><path fill="currentColor" d="'+g.d+'"/></g>'; frag.appendChild(svg); }
      else buf+=c; }
    if(buf) frag.appendChild(document.createTextNode(buf)); par.replaceChild(frag,tn); });
  /* 굵은 글자(b·strong)로 시작하는 문장은 html.to.design 이 층을 쪼갠다 → 문장 전체를 굵게 하고 뒷부분을 보통 굵기 span 으로 (보기엔 같음, 한 층으로 들어감) */
  document.querySelectorAll('p,li,dd,dt,td,th,h1,h2,h3,h4,summary,label,.a,.dr,.tx').forEach(function(el){
    var kids=Array.prototype.slice.call(el.childNodes).filter(function(n){ return !(n.nodeType===3&&!n.nodeValue.trim()) && !(n.nodeType===1&&(getComputedStyle(n).position==='absolute'||n.tagName==='BR')); });
    var f=kids[0]; if(!f||f.nodeType!==1||!/^(B|STRONG)$/.test(f.tagName)||kids.length<2) return;
    if(getComputedStyle(f).display!=='inline'||f.querySelector('*')) return;
    var pcs=getComputedStyle(el), bcs=getComputedStyle(f);
    var span=document.createElement('span'); span.style.fontWeight=pcs.fontWeight; span.style.color=pcs.color;
    var n=f.nextSibling; while(n){ var nx=n.nextSibling; if(!(n.nodeType===1&&getComputedStyle(n).position==='absolute')) span.appendChild(n); n=nx; }
    el.style.fontWeight=bcs.fontWeight; el.style.color=bcs.color; el.replaceChild(document.createTextNode(f.textContent),f); el.appendChild(span); });
  /* 이용가이드 5단계: 연결선 실제 요소 */
  document.querySelectorAll('.flow .fs:not(:last-child)').forEach(function(fs){ if(!fs.querySelector('.ln')){var i=document.createElement('i'); i.className='ln'; fs.appendChild(i);} });
}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){figmaGlyphs(); setTimeout(figmaFlow,120);});} else {setTimeout(function(){figmaGlyphs(); figmaFlow();},400);}
</script>
