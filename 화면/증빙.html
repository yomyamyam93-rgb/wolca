<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>랜선페이 — 증빙 발급</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../style.css?v=26">
<style>
  body{background:#EDF0F4;}
  .apphull{width:100%; max-width:480px; min-height:100svh; margin:0 auto; background:#fff;
    box-shadow:0 0 44px rgba(15,23,42,.10); display:flex; flex-direction:column; padding-bottom:40px;}
  .topbar{height:52px; position:sticky; top:0; z-index:50; background:#fff; display:flex; align-items:center; padding:0 10px; flex:0 0 auto;}
  .back{width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    font-size:24px; color:var(--ink); cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:16px; font-weight:700; margin-right:40px;}
  .abody{flex:1; padding:10px 20px 30px;}

  .lead{background:var(--primary-50); border:1px solid #DCE6F7; border-radius:8px; padding:15px 16px; font-size:13.5px;
    line-height:1.7; color:var(--sub); margin-bottom:20px;}
  .lead b{color:var(--ink);}

  .fld{margin-bottom:16px;}
  .fld > label{display:block; font-size:13.5px; font-weight:700; margin-bottom:7px;}
  .in, select.in{width:100%; height:50px; border:1px solid var(--line); border-radius:8px;
    padding:0 14px; font:inherit; font-size:15px; background:#fff; color:var(--ink); outline:none;}
  .in:focus{border-color:var(--primary);}
  .gobtn{width:100%; height:52px; margin-top:10px; border:none; border-radius:8px; font:inherit;
    font-size:15.5px; font-weight:700; color:#fff; cursor:pointer;
    background:var(--primary); background:var(--grad); box-shadow:var(--btn-shadow);}

  /* 접수 완료 */
  .done{display:none; text-align:center; padding-top:46px;}
  .done.on{display:block;}
  .done .chk{width:64px; height:64px; margin:0 auto; border-radius:999px; color:#fff; font-size:28px;
    background:var(--primary); background:var(--grad); display:flex; align-items:center; justify-content:center;}
  .done b{display:block; margin-top:18px; font-size:19px; font-weight:800; letter-spacing:-.3px;}
  .done p{margin-top:8px; font-size:13.5px; color:var(--sub); line-height:1.7;}
  .done .gobtn{margin-top:28px;}
  /* 하단 탭바 — 모든 콘텐츠 화면 공통 */
  .apphull, .phone{padding-bottom:110px !important;}
  .atab{position:fixed; left:50%; transform:translateX(-50%); bottom:0; z-index:60;
    width:100%; max-width:480px; display:flex; background:rgba(255,255,255,.97);
    backdrop-filter:blur(8px); border-top:1px solid #E9EDF3;
    border-radius:26px 26px 0 0; box-shadow:0 -4px 18px rgba(15,23,42,.08);
    padding:22px 0 calc(24px + var(--safe));}
  .atab a,.atab button{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:11.5px; font-weight:700; color:var(--placeholder); background:none; border:none; cursor:pointer;}
  .atab iconify-icon{font-size:24px;}
  .atab .on{color:var(--primary);}

  /* 증빙 종류 선택 — 기존 seg 버튼 규격 */
  .kinds{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px;}
  .kbtn{height:46px; border-radius:8px; border:1px solid var(--line); background:#fff;
    font:inherit; font-size:14.5px; font-weight:600; color:var(--sub); cursor:pointer;}
  .kbtn.on{border-color:var(--primary); background:var(--primary-50); color:var(--primary-600); font-weight:700;}

  .lead .who{display:block; width:fit-content; padding:4px 10px; border-radius:6px; background:#fff;
    border:1px solid var(--primary-100); color:var(--primary-600); font-size:12px; font-weight:700;
    margin-bottom:10px;}
  .lead .get{display:block; margin-top:9px; font-size:13px; font-weight:700; color:var(--ink);}

  .ganot{margin:0 0 22px;}
  .ganot h4{font-size:14.5px; font-weight:800; color:var(--ink); letter-spacing:-.3px;
    margin:20px 0 9px; padding-left:11px; border-left:3px solid var(--primary); line-height:1.4;}
  .ganot h4:first-child{margin-top:2px;}
  .ganot p{font-size:13.5px; line-height:1.75; color:var(--sub); margin:0 0 12px;}
  .ganot ol{margin:0 0 14px; list-style:none; background:#F7F9FC; border-radius:10px; padding:12px 14px;}
  .ganot ol li{display:flex; gap:8px; font-size:13.5px; line-height:1.7; color:var(--ink); padding:7px 0; min-width:0;}
  .ganot ol li > span:last-child{flex:1 1 auto; min-width:0; word-break:keep-all;}
  .ganot ol li + li{border-top:1px solid #EDF1F6;}
  .ganot ol li .n{flex:0 0 auto; min-width:16px; color:var(--primary); font-weight:800;}
  .ganot .warn{background:var(--primary-50); border-radius:10px; padding:15px 16px; margin:16px 0 0;
    font-size:12.8px; line-height:1.8; color:var(--sub);}
  .ganot .warn b{display:inline-block; color:var(--ink); font-weight:800; margin-bottom:3px;}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="apphull">
  <div class="topbar"><div class="back" onclick="history.length>1?history.back():location.href='../app.html'">‹</div><div class="ttl" id="제목">증빙 발급</div></div>

  <div class="abody">
    <div class="kinds" id="종류탭"></div>
    <div id="폼">
      <div class="lead" id="설명"></div>
      <div class="ganot" id="안내글"></div>
      <div id="칸들"></div>
      <button type="button" class="gobtn" id="신청">발급 신청하기</button>
    </div>

    <div class="done" id="완료">
      <div class="chk">✓</div>
      <b>신청이 접수됐어요</b>
      <p>서류가 준비되면 문자와 메일로 보내드려요.<br>보통 10분 안에 도착합니다.</p>
      <button type="button" class="gobtn" onclick="history.length>1?history.back():location.href='../app.html'">확인</button>
    </div>
  </div>
</div>

<script>
(function () {
  var 종류들 = {
    '세액공제': {
      안내: '<h4>어떤 서류인가요</h4><p>연말정산 때 월세 세액공제를 받기 위한 <b>납입 증명서</b>예요. 랜선페이로 낸 월세가 기간별로 정리되어 나옵니다.</p><h4>누가 받을 수 있나요</h4><ol><li><span class="n">1</span><span>총급여 8,000만원 이하의 <b>무주택 세대주</b> (세입자 본인)</span></li><li><span class="n">2</span><span>전용면적 85㎡ 이하 또는 기준시가 4억원 이하 주택 거주</span></li><li><span class="n">3</span><span>계약서 주소와 주민등록상 주소가 같은 경우</span></li></ol><h4>이렇게 쓰세요</h4><ol><li><span class="n">1</span><span>발급 신청하면 보통 10분 안에 메일 · 문자로 도착해요</span></li><li><span class="n">2</span><span>회사 연말정산 서류로 내거나 홈택스에 첨부하면 끝</span></li><li><span class="n">3</span><span>총급여 5,500만원 이하 <b>17%</b> · 8,000만원 이하 <b>15%</b> 공제</span></li></ol><div class="warn"><b>유의사항</b><br>공제 요건과 한도는 세법 개정에 따라 달라질 수 있어요. 본인이 요건에 맞는지는 홈택스나 세무 전문가에게 확인하는 것이 정확합니다.</div>',
      제목: '월세 세액공제 증빙 발급',
      설명: '<span class="who">직장인 · 세입자용</span>연말정산 <b>월세 세액공제</b>에 쓰는 서류예요. 회사나 홈택스에 그대로 제출하면 총급여에 따라 월세의 최대 17%를 돌려받습니다.<span class="get">받는 서류 — 월세 납입 증명서 (PDF)</span>',
      칸: [
        ['대상 계약', ['월세 · 김집주 · 700,000원', '관리비 · 행복아파트 관리사무소']],
        ['대상 연도', ['2026년', '2025년']],
        ['받을 방법', ['메일 (miyeok@naver.com)', '문자 (010-1234-5678)']]
      ]
    },
    '입금확인서': {
      안내: '<h4>어떤 서류인가요</h4><p>랜선페이가 <b>받는 분 계좌로 입금을 완료했다는 확인서</b>예요. 입금일 · 금액 · 받는 분 정보가 표기됩니다.</p><h4>이런 때 쓰세요</h4><ol><li><span class="n">1</span><span>집주인이 <b>입금 확인</b>을 요청할 때</span></li><li><span class="n">2</span><span>거래처에 <b>지급 증빙</b>을 보내야 할 때</span></li><li><span class="n">3</span><span>분쟁에 대비해 기록을 남겨두고 싶을 때</span></li></ol><h4>이렇게 발급돼요</h4><ol><li><span class="n">1</span><span>대상 내역을 고르고 신청하면 보통 10분 안에 도착해요</span></li><li><span class="n">2</span><span>메일 또는 문자로 PDF 파일을 받아요</span></li></ol><div class="warn"><b>유의사항</b><br>입금 사실을 증명하는 서류이고 세금 증빙(세금계산서 · 현금영수증)을 대신하지는 않아요. 세금 처리용은 다른 탭을 이용하세요.</div>',
      제목: '무통장 입금 확인서 발급',
      설명: '<span class="who">모든 회원용</span>송금이 <b>받는 분 계좌에 입금됐다는 확인서</b>예요. 집주인 · 거래처에 입금 증빙이 필요할 때 쓰면 됩니다.<span class="get">받는 서류 — 무통장 입금 확인서 (PDF)</span>',
      칸: [
        ['대상 내역', ['2026.08.05 · 월세 · 700,000원', '2026.08.05 · 관리비 · 184,000원', '2026.08.12 · 학원비 · 450,000원']],
        ['받을 방법', ['메일 (miyeok@naver.com)', '문자 (010-1234-5678)']]
      ]
    },
    '부가세': {
      안내: '<h4>어떤 자료인가요</h4><p>부가세 신고 기간에 쓰는 <b>기간별 거래 내역서</b>예요. 임차료 · 매입대금 · 인건비 결제가 항목별로 정리되어 나옵니다.</p><h4>이렇게 쓰세요</h4><ol><li><span class="n">1</span><span>부가세 신고 기간(<b>1월 · 7월</b>)에 맞춰 발급받아요</span></li><li><span class="n">2</span><span>홈택스 신고 때 경비 정리 근거로 참고해요</span></li><li><span class="n">3</span><span>세무사무소에 맡긴다면 자료를 그대로 전달하면 됩니다</span></li></ol><div class="warn"><b>유의사항</b><br>이 자료는 참고용 정리 자료예요. 매입세액 공제를 받으려면 세금계산서 같은 적격증빙이 따로 필요합니다. 랜선페이 수수료분 세금계산서는 「세금계산서」 탭에서 발행하세요.</div>',
      제목: '부가세 신고용 참고자료',
      설명: '<span class="who">사업자용</span>부가세 신고(1월 · 7월)에 쓸 <b>기간별 거래 내역 자료</b>예요. 임차료 · 매입대금 · 인건비를 사업 경비로 정리해 홈택스 신고에 참고하면 됩니다.<span class="get">받는 서류 — 기간별 이용내역서 (엑셀 · PDF)</span>',
      칸: [
        ['대상 기간', ['2026년 상반기 (1~6월)', '2025년 하반기 (7~12월)']],
        ['받을 방법', ['메일 (miyeok@naver.com)']]
      ]
    },
    '세금계산서': {
      안내: '<h4>어떤 서류인가요</h4><p>랜선페이 이용 <b>수수료에 대한 전자세금계산서</b>예요. 발행되면 홈택스로 자동 전송됩니다.</p><h4>발행 전에 확인하세요</h4><ol><li><span class="n">1</span><span>마이페이지에 <b>사업자 정보</b>가 등록되어 있어야 해요</span></li><li><span class="n">2</span><span>사업자등록번호와 계산서 수신 이메일을 확인해주세요</span></li></ol><h4>이렇게 발행돼요</h4><ol><li><span class="n">1</span><span>신청하면 다음 영업일까지 홈택스로 전송돼요</span></li><li><span class="n">2</span><span>매입세액 공제와 종합소득세 비용처리에 쓰면 됩니다</span></li></ol><div class="warn"><b>유의사항</b><br>세금계산서 대상은 랜선페이 <b>수수료</b>예요. 결제 원금(월세 · 매입대금 등)은 대상이 아니며 원금 증빙이 필요하면 입금 확인서나 부가세 자료를 이용하세요.</div>',
      제목: '세금계산서 발행 신청',
      설명: '<span class="who">사업자용</span>랜선페이 이용 <b>수수료분 세금계산서</b>를 발행해드려요. 매입세액 공제와 비용처리에 쓰면 됩니다. 마이페이지에 사업자 정보가 등록돼 있어야 해요.<span class="get">받는 서류 — 전자세금계산서 (홈택스 전송)</span>',
      칸: [
        ['사업자등록번호', null],
        ['대상 기간', ['2026년 8월', '2026년 7월', '2026년 6월']],
        ['받을 방법', ['메일 (miyeok@naver.com)']]
      ]
    }
  };
  var 라벨 = { '세액공제': '월세 세액공제', '입금확인서': '입금 확인서', '부가세': '부가세 자료', '세금계산서': '세금계산서' };
  var 탭판 = document.getElementById('종류탭');
  Object.keys(종류들).forEach(function (key) {
    var t = document.createElement('button'); t.type = 'button'; t.className = 'kbtn';
    t.textContent = 라벨[key] || key; t.dataset.k = key;
    t.addEventListener('click', function () { 그리기(key); history.replaceState(null, '', '#' + key); });
    탭판.appendChild(t);
  });
  function 그리기(k) {
    var 자료 = 종류들[k] || 종류들['세액공제'];
    [].forEach.call(탭판.children, function (t) { t.classList.toggle('on', t.dataset.k === k); });
    document.getElementById('제목').textContent = 자료.제목;
    document.getElementById('설명').innerHTML = 자료.설명;
    document.getElementById('안내글').innerHTML = 자료.안내 || '';
    var 판 = document.getElementById('칸들');
    판.innerHTML = '';
    자료.칸.forEach(function (c) {
      var d = document.createElement('div'); d.className = 'fld';
      if (c[1]) {
        d.innerHTML = '<label>' + c[0] + '</label><select class="in">' +
          c[1].map(function (o) { return '<option>' + o + '</option>'; }).join('') + '</select>';
      } else {
        d.innerHTML = '<label>' + c[0] + '</label><input class="in" inputmode="numeric" placeholder="- 없이 숫자만">';
      }
      판.appendChild(d);
    });
    document.getElementById('폼').style.display = '';
    document.getElementById('완료').classList.remove('on');
  }
  var 시작 = decodeURIComponent(location.hash.replace('#', ''));
  그리기(종류들[시작] ? 시작 : '세액공제');
  document.getElementById('신청').addEventListener('click', function () {
    var 빈입력 = document.querySelector('#칸들 input');
    if (빈입력 && !빈입력.value) { 빈입력.focus(); 빈입력.style.borderColor = 'var(--danger, #DC2626)'; return; }
    document.getElementById('폼').style.display = 'none';
    document.getElementById('완료').classList.add('on');
    window.scrollTo(0, 0);
  });
})();
</script>
<nav class="atab">
  <a href="../app.html"><iconify-icon icon="mingcute:home-4-fill"></iconify-icon>홈</a>

</nav>
<script src="선택시트.js?v=1"></script>
</body>
</html>
