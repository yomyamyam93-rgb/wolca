<style>
  :root{--primary:#156FF9; --primary-dark:#0F5AD1; --primary-50:#EFF4FF; --line:#ECEEF1;
    --sub:#4E5968; --ink:#1D2023; --placeholder:#8B95A1; --ok:#059669;
    --grad:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #ffffff), var(--primary));}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{scrollbar-width:none;} body::-webkit-scrollbar{display:none;}
  body{font-family:'Pretendard',sans-serif; color:var(--ink); background:#EDF0F4;
    word-break:keep-all; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:100%; max-width:480px; min-height:100svh; margin:0 auto; background:#fff;
    box-shadow:0 0 44px rgba(15,23,42,.10); display:flex; flex-direction:column;}
  .topbar{height:52px; position:sticky; top:0; z-index:50; background:#fff;
    display:flex; align-items:center; padding:0 10px; flex:0 0 auto;}
  .back{width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    font-size:24px; cursor:pointer;}
  .body{flex:1; padding:18px 20px 30px; display:flex; flex-direction:column;}

  .mark{width:52px; height:52px; border-radius:16px; background:var(--primary); background:var(--grad);
    display:flex; align-items:center; justify-content:center; margin-bottom:20px;
    box-shadow:0 6px 16px color-mix(in srgb, var(--primary) 30%, transparent);}
  .mark img{width:30px; height:auto;}
  .q{font-size:23px; font-weight:800; letter-spacing:-.5px; line-height:1.35;}
  .q em{font-style:normal; color:var(--primary);}
  .qs{margin-top:9px; font-size:14.5px; color:var(--sub); line-height:1.7;}

  .fld{margin-top:26px;}
  .fld > label{display:block; font-size:13.5px; font-weight:700; margin-bottom:7px;}
  .in{width:100%; height:52px; border:1px solid var(--line); border-radius:8px;
    padding:0 14px; font:inherit; font-size:16px; background:#fff; color:var(--ink); outline:none;}
  .in.on{border-color:var(--primary);}
  .in::placeholder{color:var(--placeholder);}
  .withbtn{display:flex; gap:8px;}
  .withbtn .in{flex:1; min-width:0;}
  .chkbtn{flex:0 0 auto; padding:0 16px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font:inherit; font-size:13.5px; font-weight:700; color:var(--primary-dark); cursor:pointer;}
  .hint{margin-top:7px; font-size:12px; color:var(--placeholder);}
  .hint.ok{color:var(--ok); font-weight:700;}
  .timer{float:right; font-size:12.5px; font-weight:700; color:var(--primary-dark);}

  .agree{margin-top:24px; background:var(--primary-50); border-radius:10px; padding:14px 15px;
    font-size:12.5px; color:var(--sub); line-height:1.7;}
  .agree b{color:var(--ink);}

  .go{width:100%; height:54px; margin-top:auto; border:none; border-radius:8px; cursor:pointer;
    font:inherit; font-size:16px; font-weight:700; color:#fff;
    background:var(--primary); background:var(--grad);
    box-shadow:0 4px 12px color-mix(in srgb, var(--primary) 32%, transparent);}
  .sub{margin-top:14px; text-align:center; font-size:13.5px; color:var(--placeholder);}
  .sub a{color:var(--primary-dark); font-weight:700; text-decoration:none;}
  /* 휴대폰 글줄 정리: 본문은 줄 끝까지 채우고 제목·강조는 어절을 지킨다 */
  p, li, dd, .a, .dr, .tx{word-break:normal; overflow-wrap:anywhere; letter-spacing:-.2px;}
  p b, li b, strong, h1, h2, h3, b{word-break:keep-all;}

</style>

<style id="figma-fix-app">/* 피그마 가져오기용(앱) */
*,*::before,*::after{animation:none!important;transition:none!important}
.apphull{min-height:0!important; position:relative!important;}
body{position:relative!important;} /* .atab 이 body 직계라 기준을 화면이 아닌 문서 전체로 */
.atab{position:absolute!important; left:0!important; right:0!important; bottom:0!important; transform:none!important; width:100%!important; max-width:none!important;}
.figma-drawer .drawer{height:780px!important; top:0!important; bottom:auto!important;}
.figma-drawer .dim{height:780px!important; top:0!important; bottom:auto!important;}
.figma-sheet .docsheet, .figma-sheet .dsheet, .figma-sheet .pksheet, .figma-sheet .gsheet{max-height:none!important;}
/* figma-app-scroll: 안쪽 스크롤 틀을 펼쳐 페이지가 내용 길이만큼 길어지게 (가져오기는 화면 높이만큼만 담기 때문) */
html,body{height:auto!important; max-height:none!important; overflow:visible!important;}
.apphull{height:auto!important; max-height:none!important; overflow:visible!important;}
/* ?slides=all → 롤링 배너 7장을 세로로 전부 펼침 */
.figma-slides .atrack{flex-direction:column!important; width:100%!important; transform:none!important;}

.figma-slides #uspdots{display:none!important;}
/* ?slides=row → 롤링 배너 7장만 가로 한 줄(장당 360px)로 */

.figma-row .aband{overflow:visible!important; margin:0!important; padding:0!important; width:2520px!important; border-radius:0!important;}

<script>/* 피그마 가져오기용(앱): ?drawer=open 서랍 열림 · ?sheet=1 첫 번째 시트 열림 · 그 외엔 서랍·시트 요소 제거 */
 /* 색 반전 필터로 흰색을 만든 로고는 진짜 흰 로고 그림으로 교체 (필터는 피그마로 안 옮겨짐) */
 document.querySelectorAll('img').forEach(function(im){var f=getComputedStyle(im).filter||''; if(f.indexOf('invert')<0) return;
   var src=im.getAttribute('src')||''; if(src.indexOf('logo-text')>=0) im.src=src.replace(/logo-text[^/]*\.png/,'logo-text-white.png');
   else if(src.indexOf('logo3.png')>=0) im.src=src.replace('logo3.png','logo3-white.png');
   else if(/item3d\/(\d+)\.png/.test(src)) im.src=src.replace(/item3d\/(\d+)\.png/,'item3d/w$1.png');
   im.style.setProperty('filter','none','important');});
(function(){var q=new URLSearchParams(location.search);
 if(q.get('drawer')==='open'){document.documentElement.classList.add('figma-drawer'); if(typeof drawer==='function') drawer(true);}
 else{['drawer','dim'].forEach(function(id){var e=document.getElementById(id); if(e) e.remove();});}
 if(q.get('open')==='all'){document.querySelectorAll('details').forEach(function(d){d.open=true;});}
 var doList=q.get('do');
 if(q.get('sheet')==='1'){document.documentElement.classList.add('figma-sheet'); var b=document.getElementById('ap-doclink')||document.querySelector('.pickbtn'); if(b) b.click();}
 else if(doList){document.documentElement.classList.add('figma-sheet');
   doList.split(';').forEach(function(step){var i=step.indexOf(':'), kind=step.slice(0,i), arg=step.slice(i+1), el=null;
     if(kind==='click') el=document.querySelector(arg);
     else if(kind==='clickn'){var pp=arg.split('|'); el=document.querySelectorAll(pp[0])[+pp[1]||0];}
     else if(kind==='text'){el=Array.prototype.find.call(document.querySelectorAll('button,a,div,span,label,li'), function(e){return e.children.length<3 && e.textContent.trim()===arg;});}
     if(el){el.click();}});}
 /* 열려 있지 않은 시트·서랍·어둠막은 전부 지운다 (화면 밖 아래에 숨어 있다가 긴 프레임에 찍히던 문제) */
 var OVL='.docdim,.docsheet,.ask-layer,.pkdim,.pksheet,.ddim,.dsheet,.gdim,.gsheet,.drawer,.dim';
 function isOn(e){ var cs=getComputedStyle(e); if(cs.display==='none'||cs.visibility==='hidden'||cs.opacity==='0') return false;
   var r=e.getBoundingClientRect(); return r.height>0 && r.top<innerHeight-1 && r.bottom>1; }   /* 지금 화면 안에 실제로 보이는 것만 */
 document.querySelectorAll(OVL).forEach(function(e){ if(!isOn(e)) e.remove(); });
 /* ?only=1 → 열린 시트(또는 서랍)만 남기고 페이지는 전부 숨겨, 시트 하나가 곧 프레임이 되게 */
 if(q.get('only')==='1'){
   var panels=Array.prototype.filter.call(document.querySelectorAll(OVL), function(e){ return isOn(e) && !/dim|ask-layer/.test(e.className); });
   /* 여러 개가 겹쳐 열려 있으면 맨 위(z-index 큰 것)를, 같으면 큰 것을 고른다 */
   panels.sort(function(a,b){ var za=+getComputedStyle(a).zIndex||0, zb=+getComputedStyle(b).zIndex||0; return (zb-za) || (b.getBoundingClientRect().height - a.getBoundingClientRect().height); });
   var panel=panels[0];
   if(panel){
     document.querySelectorAll('.docdim,.pkdim,.ddim,.gdim,.dim').forEach(function(e){e.remove();});
     var node=panel; while(node && node!==document.body){ var par=node.parentElement;
       Array.prototype.forEach.call(par.children, function(c){ if(c!==node) c.style.setProperty('display','none','important'); }); node=par; }
     ['position','transform','left','right','top','bottom','margin','max-height','height'].forEach(function(k){ panel.style.setProperty(k, k==='position'?'static':(k==='transform'?'none':(k==='margin'?'0':'auto')),'important'); });
     panel.style.setProperty('width','360px','important'); panel.style.setProperty('max-width','none','important');
     document.documentElement.classList.add('figma-only');
   }
 }
 /* 롤링 배너: 자동 넘김을 멈추고 1번 장에 고정 · ?slides=all 이면 7장(중복 제거) 전부 세로로 */
 for(var t=1;t<50000;t++){clearInterval(t);}
 var band=document.querySelector('.uspband'), tk=document.getElementById('usptrack');
 if(band&&tk){var ups=Array.prototype.slice.call(tk.querySelectorAll('.aup')), seen={}, uniq=[];
   ups.forEach(function(u){var im=u.querySelector('img'); var k=im?im.getAttribute('src'):u.textContent.trim(); if(!seen[k]){seen[k]=1; uniq.push(u);}});
   if(q.get('slides')==='row'){document.documentElement.classList.add('figma-row'); ups.forEach(function(u){if(uniq.indexOf(u)<0) u.remove();});
     /* 배너는 제자리에 두고(스타일이 조상에 묶여 있음) 조상 사슬의 형제들만 숨긴다 */
     var node=band; while(node && node!==document.body){ var par=node.parentElement;
       Array.prototype.forEach.call(par.children, function(c){ if(c!==node) c.style.setProperty('display','none','important'); }); node=par; }
     tk.style.setProperty('transform','none','important');}
   else if(q.get('slides')==='all'){document.documentElement.classList.add('figma-slides'); ups.forEach(function(u){if(uniq.indexOf(u)<0) u.remove();}); tk.style.setProperty('transform','none','important');}
   else if(q.get('slides')==='strip'){ /* 7장을 왼쪽부터 가로로 쭉 (프레임 밖으로 이어짐) */
     document.documentElement.classList.add('figma-strip'); ups.forEach(function(u){if(uniq.indexOf(u)<0) u.remove();});
     tk.style.transition='none'; tk.style.setProperty('transform','none','important');}
   else{ /* 기본: 1번 장에 고정 */
     var f=uniq[0]; tk.style.transition='none'; tk.style.transform='translateX('+(band.clientWidth/2-(f.offsetLeft+f.offsetWidth/2))+'px)';}
 }
 /* 안쪽에서 스크롤되는 상자를 전부 펼친다 */
 document.querySelectorAll('*').forEach(function(el){var cs=getComputedStyle(el);
   if(/(auto|scroll)/.test(cs.overflowY) && el.scrollHeight>el.clientHeight+4){el.style.setProperty('overflow','visible','important'); el.style.setProperty('height','auto','important'); el.style.setProperty('max-height','none','important');}});
 /* 그림 크기 고정: 그려진 크기를 px 로 못 박아 피그마에서 찌그러지지 않게 (지연 로딩도 즉시) */
 document.querySelectorAll('img').forEach(function(im){im.loading='eager';});
 setTimeout(function(){document.querySelectorAll('img').forEach(function(im){var r=im.getBoundingClientRect(); if(r.width>0&&r.height>0){im.style.setProperty('width',r.width+'px','important'); im.style.setProperty('height',r.height+'px','important'); im.style.setProperty('max-width','none','important'); im.style.setProperty('max-height','none','important');}});},250);
})();
/* 글줄: 크롬이 실제로 줄을 끊은 자리에 <br> 을 넣는다 (피그마는 한글을 글자 단위로 끊어 '누르세/요'가 됨) */
function figmaPrebreak(){
  var sel='p,li,h1,h2,h3,h4,dd,dt,summary,label,.head-sub,.tx,.tt,.lm,small,b,em,strong,.cd,.cn,.sub';
  document.querySelectorAll(sel).forEach(function(bl){
    if(bl.closest('svg,iconify-icon,script,style,textarea,input')) return;
    var cs=getComputedStyle(bl); if(cs.display==='none'||cs.whiteSpace==='nowrap'||cs.whiteSpace==='pre') return;
    if(cs.wordBreak!=='keep-all') return;   /* 본문(글자 단위 줄바꿈)은 고정 폭 상자로 자연스럽게 흐르게 두고, 어절을 지키는 제목·강조만 줄을 미리 끊는다 */
    var lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.5; if(bl.getBoundingClientRect().height<lh*1.6) return;
    var w=document.createTreeWalker(bl,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(function(tn){ var t=tn.nodeValue; if(!t||!t.trim()) return; if(tn.parentNode.closest('svg,iconify-icon')) return;
      var r=document.createRange(), lastTop=null, breaks=[];
      for(var i=0;i<t.length;i++){ if(/\s/.test(t[i])) continue; r.setStart(tn,i); r.setEnd(tn,i+1); var rc=r.getClientRects()[0]; if(!rc||!rc.height) continue;
        if(lastTop!==null && rc.top-lastTop>rc.height*0.5) breaks.push(i); lastTop=rc.top; }
      if(!breaks.length) return;
      var pos=0, frag=document.createDocumentFragment();
      breaks.forEach(function(bi){ frag.appendChild(document.createTextNode(t.slice(pos,bi).replace(/\s+$/,''))); frag.appendChild(document.createElement('br')); pos=bi; });
      frag.appendChild(document.createTextNode(t.slice(pos).replace(/^\s+/,''))); tn.parentNode.replaceChild(frag,tn); });
  });
}
/* 기호 글자(✓ › ‹ ▾ ✕ ↗ ·)를 글꼴 윤곽 SVG로 (굵기 맞춤) — 피그마가 다른 글꼴로 그리는 문제 */
function figmaGlyphs(){
  var G=window.FIGMA_GLYPHS||{}; var chars=Object.keys(G); if(!chars.length) return;
  var re=new RegExp('['+chars.map(function(c){return '\\u'+c.charCodeAt(0).toString(16).padStart(4,'0');}).join('')+']');
  var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()){ var n=w.currentNode; if(re.test(n.nodeValue)) nodes.push(n); }
  nodes.forEach(function(tn){ var par=tn.parentNode; if(!par||par.closest('svg,script,style,textarea,iconify-icon')) return; if(par.querySelector&&par.querySelector('svg.glyph')) return;
    var core=tn.nodeValue.replace(/\s+/g,''); if(!core||core.split('').some(function(c){return !G[c];})) return;
    var cs=getComputedStyle(par), fw=+cs.fontWeight||400, ws=['400','500','600','700','800'], wk=ws.reduce(function(a,b){return Math.abs(+b-fw)<Math.abs(+a-fw)?b:a;});
    var frag=document.createDocumentFragment(), t=tn.nodeValue, buf='';
    for(var i=0;i<t.length;i++){ var c=t[i]; if(G[c]){ if(buf){frag.appendChild(document.createTextNode(buf)); buf='';}
        var g=G[c][wk]||G[c]['700']; var svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','glyph'); svg.setAttribute('viewBox','0 '+(-g.asc)+' '+g.adv+' '+(g.asc-g.desc));
        svg.setAttribute('style','display:inline-block;width:'+(g.adv/g.upm)+'em;height:'+((g.asc-g.desc)/g.upm)+'em;vertical-align:'+(g.desc/g.upm)+'em;overflow:visible');
        svg.innerHTML='<g transform="scale(1,-1)"><path fill="currentColor" d="'+g.d+'"/></g>'; frag.appendChild(svg); }
      else buf+=c; }
    if(buf) frag.appendChild(document.createTextNode(buf)); par.replaceChild(frag,tn); });
  /* 굵은 글자(b·strong)로 시작하는 문장은 html.to.design 이 층을 쪼갠다 → 문장 전체를 굵게 하고 뒷부분을 보통 굵기 span 으로 (보기엔 같음, 한 층으로 들어감) */
  document.querySelectorAll('p,li,dd,dt,td,th,h1,h2,h3,h4,summary,label,.a,.dr,.tx').forEach(function(el){
    var kids=Array.prototype.slice.call(el.childNodes).filter(function(n){ return !(n.nodeType===3&&!n.nodeValue.trim()) && !(n.nodeType===1&&(getComputedStyle(n).position==='absolute'||n.tagName==='BR')); });
    var f=kids[0]; if(!f||f.nodeType!==1||!/^(B|STRONG)$/.test(f.tagName)||kids.length<2) return;
    if(getComputedStyle(f).display!=='inline'||f.querySelector('*')) return;
    var pcs=getComputedStyle(el), bcs=getComputedStyle(f);
    var span=document.createElement('span'); span.style.fontWeight=pcs.fontWeight; span.style.color=pcs.color;
    var n=f.nextSibling; while(n){ var nx=n.nextSibling; if(!(n.nodeType===1&&getComputedStyle(n).position==='absolute')) span.appendChild(n); n=nx; }
    el.style.fontWeight=bcs.fontWeight; el.style.color=bcs.color; el.replaceChild(document.createTextNode(f.textContent),f); el.appendChild(span); });
  /* 이용가이드 5단계: 연결선 실제 요소 */
  document.querySelectorAll('.flow .fs:not(:last-child)').forEach(function(fs){ if(!fs.querySelector('.ln')){var i=document.createElement('i'); i.className='ln'; fs.appendChild(i);} });
}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){figmaGlyphs(); setTimeout(figmaPrebreak,120);});} else {setTimeout(function(){figmaGlyphs(); figmaPrebreak();},400);}
</script>
