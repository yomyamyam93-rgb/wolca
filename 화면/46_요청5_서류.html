<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>결제 요청 5 · 증빙 서류</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 스크롤바를 보이지 않게 (스크롤은 그대로 됨) */
html,body{scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0; height:0; display:none;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0; height:0;}
  :root{
    --primary:#2563EB; --primary-dark:#1D4ED8; --primary-50:#EFF4FF; --primary-100:#DBE7FF;
    --page-bg:#c9cdd4; --bg:#FFFFFF; --line:#ECEEF1; --border:#B1B8BE;
    --tile:#F2F4F6; --icon-off:#B0B8C1; --sub:#4E5968; --ink:#191F28; --placeholder:#8B95A1;
    --success:#059669;
    --primary-grad:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #ffffff), var(--primary));
    --btn-shadow:0 4px 12px color-mix(in srgb, var(--primary) 32%, transparent), inset 0 1px 0 rgba(255,255,255,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  /* 한글은 단어 단위로만 줄바꿈 (한 글자만 떨어지는 것 방지) */
  body{word-break:keep-all; overflow-wrap:break-word;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
       color:var(--ink); background:var(--page-bg); display:flex; justify-content:center; align-items:flex-start; padding:24px 0; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; height:844px; max-width:100%; background:#fff; position:relative; display:flex; flex-direction:column; border-radius:46px; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.28);}
  iconify-icon{display:inline-block;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 30px; flex:0 0 auto;}
  .statusbar .time{font-size:15px; font-weight:700; letter-spacing:.3px;}
  .statusbar .stat{display:flex; align-items:center; gap:7px;}
  .topbar{height:50px; display:flex; align-items:center; padding:0 10px; flex:0 0 auto;}
  .back{width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--ink); cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:16px; font-weight:700; margin-right:40px;}
  .prog{height:4px; background:var(--line); margin:0 24px 6px; border-radius:2px; overflow:hidden;}
  .prog i{display:block; height:100%; width:83%; background:var(--primary); border-radius:2px;}

  .body{flex:1; overflow-y:auto; padding:6px 20px 128px; scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}
  h1.dt{font-size:23px; font-weight:700; letter-spacing:-.4px; margin:8px 0 6px;}
  .dintro{font-size:15px; color:var(--sub); margin-bottom:20px; line-height:1.6;}

  /* 준비 서류 카드 */
  .dcard{background:#fff; border:1px solid var(--line); border-radius:16px; padding:15px 16px; margin-bottom:12px;}
  .dhead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .dcase{font-size:15px; font-weight:700; line-height:1.4;}
  .dbadge{font-size:11px; font-weight:700; color:var(--primary-dark); background:var(--primary-50); padding:5px 10px; border-radius:8px; flex:0 0 auto; white-space:nowrap;}
  .ditem{display:flex; align-items:flex-start; gap:10px; font-size:15px; color:var(--ink); padding:7px 0; line-height:1.5;}
  .ditem iconify-icon{font-size:20px; color:var(--primary); flex:0 0 auto; margin-top:1px;}

  .keybox{display:flex; gap:11px; align-items:flex-start; background:var(--primary-50); border-radius:14px; padding:15px; margin:16px 0 8px;}
  .keybox iconify-icon{font-size:21px; color:var(--primary); flex:0 0 auto; margin-top:1px;}
  .keybox .kt{font-size:14px; font-weight:600; color:var(--primary-dark); line-height:1.55;}

  .tips{margin-top:16px;}
  .tips-h{font-size:13px; font-weight:700; color:var(--sub); margin-bottom:10px;}
  .tip{display:flex; gap:9px; align-items:flex-start; font-size:13px; color:var(--sub); line-height:1.6; margin-bottom:8px;}
  .tip .tdot{width:5px; height:5px; border-radius:50%; background:var(--icon-off); flex:0 0 auto; margin-top:8px;}

  /* 첨부된 서류 */
  .filerow{display:flex; align-items:center; gap:11px; padding:14px 15px; border-radius:14px; background:var(--primary-50); margin-top:16px;}
  .filerow > iconify-icon{font-size:20px; color:var(--primary); flex:0 0 auto;}
  .filerow .fn{flex:1; min-width:0; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .filerow .fx{border:none; background:none; font-family:inherit; font-size:13px; font-weight:700; color:var(--placeholder); cursor:pointer;}

  /* 요청 요약 */
  .sect{font-size:16px; font-weight:700; margin:26px 0 12px;}
  .sum{padding:16px 18px; border-radius:16px; border:1px solid var(--line);}
  .srow{display:flex; justify-content:space-between; gap:12px; font-size:13.5px; padding:5px 0;}
  .srow .v{font-weight:700; text-align:right; word-break:break-all;}
  .sdiv{border-top:1px solid var(--line); margin:10px 0;}
  .stot{display:flex; justify-content:space-between; align-items:baseline;}
  .stot .l{font-size:13.5px; font-weight:700;}
  .stot .v{font-size:19px; font-weight:800; color:var(--primary-dark);}

  .footer{position:absolute; bottom:0; left:0; right:0; padding:14px 20px 26px; background:linear-gradient(180deg, rgba(255,255,255,0), #fff 28%);}
  .btn-primary{width:100%; height:54px; border:none; border-radius:14px; font-size:16px; font-weight:700; color:#fff; cursor:pointer; background:var(--primary); background:var(--primary-grad); box-shadow:var(--btn-shadow);}
  .inq{display:block; text-align:center; width:100%; background:none; border:none; font-family:inherit; font-size:14px; color:var(--placeholder); margin-top:12px; cursor:pointer;}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span class="time">9:41</span>
    <span class="stat">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
    </span>
  </div>
  <div class="topbar"><div class="back" onclick="lpBack('45_요청4_계좌.html')">‹</div><div class="ttl">결제 요청 5</div></div>
  <div class="prog"><i></i></div>

  <div class="body">
    <h1 class="dt" id="dTitle">B2B 매입대금</h1>
    <div class="dintro" id="dIntro">아래 중 하나만 준비하면 돼요.</div>

    <div class="dcard">
      <div class="dhead"><span class="dcase">준비 서류</span><span class="dbadge" id="dBadge">이 중 하나</span></div>
      <div id="dItems"></div>
    </div>

    <div class="keybox">
      <iconify-icon icon="mingcute:information-fill"></iconify-icon>
      <div class="kt" id="dKey">증빙에서 금액과 입금계좌가 보여야 해요.</div>
    </div>

    <div class="tips">
      <div class="tips-h">이런 점도 확인하세요</div>
      <div class="tip"><span class="tdot"></span><span>서류는 <b>거래처가 아니라 내가</b> 올려요. 계약서 · 명세서는 우리 쪽에 있으니까요.</span></div>
      <div class="tip"><span class="tdot"></span><span>주민등록번호 · 연락처는 가려서 올려주세요. (사업자번호는 안 가려도 돼요)</span></div>
    </div>

    <div class="filerow" id="fileRow" style="display:none">
      <iconify-icon icon="mingcute:document-fill"></iconify-icon>
      <span class="fn">거래명세서_한빛식자재.pdf</span>
      <button class="fx" onclick="dropDoc()">삭제</button>
    </div>

  </div>

  <div class="footer" id="footAttach">
    <button class="btn-primary" onclick="pickDoc()">서류 촬영하기</button>
    <button class="inq" onclick="pickDoc()">앨범 · 파일에서 선택할게요</button>
  </div>
  <div class="footer" id="footSend" style="display:none">
    <button class="btn-primary" onclick="send()">다음</button>
    <button class="inq" onclick="pickDoc()">서류 다시 올리기</button>
  </div>
</div>
<script src="app.js"></script>
<script>
/* 유형별 필요 서류 — 확인서류안내(11)와 같은 기준 */
var DOCS = {

  },
  '인건비 · 용역비': {

  },
  '별도 관리비': {
    intro: '아래 중 하나만 준비하면 돼요.',
    badge: '이 중 하나',
    items: ['관리비 고지서(청구서)', '관리비 영수증', '세금계산서'],
    key: '증빙에서 관리비 금액과 입금계좌가 보여야 해요.'
  },
  '렌트료 · 렌탈료': {

    items: ['렌탈 계약서', '계약 내용 온라인 조회 화면 캡처', '납부안내 문자 캡처'],
    key: '증빙에서 금액과 입금계좌가 보여야 해요.'
  },
  '기타': {
    intro: '거래를 증명할 수 있는 서류를 준비해주세요.',
    badge: '이 중 하나',
    items: ['상품명 · 거래금액 · 입금계좌가 확인되는 객관적인 증빙'],
    key: '수기로 쓴 약식 증빙은 이용이 어려워요.'
  }
};

var g = function(k, d){ try{ return sessionStorage.getItem(k) || d; }catch(e){ return d; } };
var fmt = function(n){ return n.toLocaleString('ko-KR'); };

(function(){
  var type = g('rq_type', 'B2B 매입대금');
  var d = DOCS[type] || DOCS['기타'];

  document.getElementById('dTitle').textContent = type;
  document.getElementById('dIntro').textContent = d.intro;
  document.getElementById('dBadge').textContent = d.badge;
  document.getElementById('dKey').textContent = d.key;
  document.getElementById('dItems').innerHTML = d.items.map(function(t){
    return '<div class="ditem"><iconify-icon icon="mingcute:check-circle-fill"></iconify-icon><span>' + t + '</span></div>';
  }).join('');

  document.getElementById('sName').textContent = g('rq_name', '한빛식자재');
  document.getElementById('sAcct').textContent = g('rq_acct', '기업 302-1122-3344');
  document.getElementById('sFee').textContent  = fmt(fee) + '원';
})();

function pickDoc(){
  document.getElementById('fileRow').style.display = 'flex';
  document.getElementById('footAttach').style.display = 'none';
  document.getElementById('footSend').style.display = 'block';
}
function dropDoc(){
  document.getElementById('fileRow').style.display = 'none';
  document.getElementById('footAttach').style.display = 'block';
  document.getElementById('footSend').style.display = 'none';
}
function send(){ location.href = '47_요청6_확인.html'; }
</script>
</body>
</html>
