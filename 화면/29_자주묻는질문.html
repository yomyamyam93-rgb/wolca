<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>랜선페이 — FAQ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 스크롤바를 보이지 않게 (스크롤은 그대로 됨) */
html,body{scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0; height:0; display:none;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0; height:0;}
  :root{
    --primary:#2563EB; --primary-dark:#1D4ED8; --primary-50:#EFF4FF;
    --page-bg:#c9cdd4; --bg:#F4F5F6; --card:#FFFFFF; --line:#ECEEF1; --border:#B1B8BE;
    --tile:#EEF1F4; --icon-off:#B0B8C1; --sub:#4E5968; --ink:#191F28; --placeholder:#8B95A1;
    --primary-grad:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #ffffff), var(--primary));
    --btn-shadow:0 4px 12px color-mix(in srgb, var(--primary) 32%, transparent), inset 0 1px 0 rgba(255,255,255,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  /* 한글은 단어 단위로만 줄바꿈 (한 글자만 떨어지는 것 방지) */
  body{word-break:keep-all; overflow-wrap:break-word;}
  body{font-family:'Pretendard',-apple-system,sans-serif; color:var(--ink); background:var(--page-bg);
       display:flex; justify-content:center; align-items:flex-start; padding:24px 0; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; height:844px; max-width:100%; background:var(--bg); position:relative; display:flex; flex-direction:column;
         border-radius:46px; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.28);}
  iconify-icon{display:inline-block;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 30px; background:var(--bg); flex:0 0 auto;}
  .statusbar .time{font-size:15px; font-weight:700;}
  .statusbar .stat{display:flex; align-items:center; gap:7px;}
  .topbar{height:54px; display:flex; align-items:center; padding:0 10px; background:var(--bg); flex:0 0 auto;}
  .topbar .back{width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink); cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:17px; font-weight:700; margin-right:44px;}

  .cats{display:flex; flex-wrap:wrap; gap:7px; padding:2px 20px 14px; background:var(--bg); flex:0 0 auto;}
  .cats::-webkit-scrollbar{display:none;}
  .cats span{flex:0 0 auto; padding:9px 15px; border-radius:999px; border:none; background:var(--tile);
    font-size:13px; font-weight:700; color:var(--sub); cursor:pointer; white-space:nowrap;}
  .cats span.on{background:var(--primary); color:#fff;}

  .body{flex:1; overflow-y:auto; padding:0 20px 40px; scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}

  .q{background:var(--card); border-radius:16px; margin-bottom:9px; box-shadow:0 1px 3px rgba(0,0,0,.04); overflow:hidden;}
  .q .head{display:flex; align-items:flex-start; gap:10px; padding:17px 16px; cursor:pointer;}
  .q .qm{font-size:15px; font-weight:800; color:var(--primary-dark); flex:0 0 auto; line-height:1.5;}
  .q .qt{flex:1; font-size:14.5px; font-weight:600; line-height:1.55;}
  .q .arw{flex:0 0 auto; font-size:19px; color:var(--icon-off); transition:transform .3s;}
  .q.on .arw{transform:rotate(180deg);}
  .q .ans{max-height:0; overflow:hidden; transition:max-height .35s ease;}
  .q.on .ans{max-height:400px;}
  .q .ac{padding:0 16px 18px 42px; font-size:13.5px; color:var(--sub); line-height:1.75;}
  .q .ac b{color:var(--ink);}

  .ask{background:var(--card); border-radius:18px; padding:22px; margin-top:20px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .ask .t{font-size:15px; font-weight:700;}
  .ask .s{font-size:13px; color:var(--placeholder); margin-top:7px; line-height:1.6;}
  .ask .btns{display:flex; gap:9px; margin-top:16px;}
  .ask button{flex:1; height:48px; border-radius:13px; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer;}
  .ask .g{border:1.5px solid var(--border); background:#fff; color:var(--sub);}
  .ask .b{border:none; background:var(--primary-grad); box-shadow:var(--btn-shadow); color:#fff;}

  /* ===== 하단 탭바 (더보기에서 들어온 화면도 동일하게) ===== */
  .navbar{position:absolute; bottom:0; left:0; right:0; z-index:20; background:#fff;
    border-top:1px solid var(--line); padding-top:12px;}
  .nvbar{display:flex; padding:0 6px;}
  .nvtab{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    color:#8B95A1; font-size:11px; font-weight:500; cursor:pointer;}
  .nvtab iconify-icon{font-size:23px;}
  .nvtab.on{color:var(--primary); font-weight:700;}
  .nvtab.center{justify-content:center; gap:0;}
  .fab{width:56px; height:56px; margin-top:-24px; border:none; padding:0; border-radius:50%; pointer-events:none;
    display:flex; align-items:center; justify-content:center; background:var(--primary);
    box-shadow:0 6px 16px rgba(37,99,235,.45), 0 0 0 5px #fff, inset 0 1px 0 rgba(255,255,255,.28);}
  .fab img{width:29px;}
  .home-indicator{margin:10px auto 8px; width:134px; height:5px; border-radius:3px; background:var(--ink);}
  /* 탭바에 내용이 가리지 않게 */
  .body{padding-bottom:112px !important;}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2C11 2 13.3 3 15 4.7l-1.3 1.4C12.3 4.7 10.5 4 8.5 4S4.7 4.7 3.3 6.1L2 4.7C3.7 3 6 2 8.5 2z" fill="#191F28"/><circle cx="8.5" cy="10" r="1.3" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>

  <div class="topbar"><div class="back" onclick="goBack()">‹</div><div class="ttl">FAQ</div></div>

  <div class="cats" id="cats"></div>
  <div class="body">
    <div id="faqList"></div>

  </div>

  <div class="navbar">
    <div class="nvbar">
      <div class="nvtab" onclick="location.href='9_홈_개인.html'"><iconify-icon icon="mingcute:home-4-fill"></iconify-icon><span>홈</span></div>
      <div class="nvtab" onclick="location.href='15_내결제.html'"><iconify-icon icon="mingcute:bill-fill"></iconify-icon><span>내 결제</span></div>

      <div class="nvtab" onclick="location.href='19_혜택.html'"><iconify-icon icon="mingcute:gift-fill"></iconify-icon><span>혜택</span></div>
      <div class="nvtab on" onclick="location.href='21_더보기.html'"><iconify-icon icon="mingcute:menu-fill"></iconify-icon><span>더보기</span></div>
    </div>
    <div class="home-indicator"></div>
  </div>

</div>
<script src="../홈페이지/게시글.js?v=20260812c"></script>
<script src="app.js?v=20260812c"></script>
<script>
function tg(el){ el.classList.toggle('on'); }

/* 홈페이지와 같은 FAQ 데이터(게시글.js 의 FAQS)를 씁니다 */
var FQ_CAT = '전체';
function fqCats(){
  var list = ['전체'].concat(FAQS.map(function(f){ return f.c; })
                            .filter(function(v,i,a){ return a.indexOf(v)===i; }));
  document.getElementById('cats').innerHTML = list.map(function(c){
    return '<span' + (c===FQ_CAT?' class="on"':'') + ' onclick="setC(\'' + c + '\')">' + c + '</span>';
  }).join('');
}
function fqList(){
  var rows = FAQS.filter(function(f){ return FQ_CAT==='전체' || f.c===FQ_CAT; });
  document.getElementById('faqList').innerHTML = rows.map(function(f){
    return '<div class="q" onclick="tg(this)">'
      + '<div class="head"><span class="qm">Q</span><span class="qt">' + f.q + '</span>'
      + '<iconify-icon class="arw" icon="mingcute:down-line"></iconify-icon></div>'
      + '<div class="ans"><div class="ac">' + f.a + '</div></div></div>';
  }).join('');
}
function setC(c){ FQ_CAT = c; fqCats(); fqList(); }
if (typeof FAQS !== 'undefined'){ fqCats(); fqList(); }
function goBack(){ lpBack('21_더보기.html'); }
</script>
