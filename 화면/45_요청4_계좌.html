<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>결제 요청 4 · 입금 계좌</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 스크롤바를 보이지 않게 (스크롤은 그대로 됨) */
html,body{scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0; height:0; display:none;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0; height:0;}
  :root{--primary:#2563EB; --primary-dark:#1D4ED8; --primary-50:#EFF4FF; --primary-100:#DBE7FF;
    --page-bg:#c9cdd4; --bg:#FFFFFF; --line:#ECEEF1; --border:#B1B8BE; --tile:#EEF1F4; --icon-off:#B0B8C1;
    --sub:#4E5968; --ink:#191F28; --placeholder:#8B95A1; --success:#059669;
    --primary-grad:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #ffffff), var(--primary));
    --btn-shadow:0 4px 12px color-mix(in srgb, var(--primary) 32%, transparent), inset 0 1px 0 rgba(255,255,255,.18);}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  /* 한글은 단어 단위로만 줄바꿈 (한 글자만 떨어지는 것 방지) */
  body{word-break:keep-all; overflow-wrap:break-word;}
  body{font-family:'Pretendard',sans-serif; color:var(--ink); background:var(--page-bg); display:flex; justify-content:center; align-items:flex-start; padding:24px 0; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; height:844px; max-width:100%; background:#fff; position:relative; display:flex; flex-direction:column; border-radius:46px; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.28);}
  iconify-icon{display:inline-block;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 30px; flex:0 0 auto;}
  .statusbar .time{font-size:15px; font-weight:700;}
  .statusbar .stat{display:flex; align-items:center; gap:7px;}
  .topbar{height:50px; display:flex; align-items:center; padding:0 10px; flex:0 0 auto;}
  .back{width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink); cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:16px; font-weight:700; margin-right:40px;}
  .prog{height:4px; background:var(--line); margin:0 24px 6px; border-radius:2px; overflow:hidden;}
  .prog i{display:block; height:100%; width:67%; background:var(--primary); border-radius:2px;}
  .body{flex:1; overflow-y:auto; padding:14px 20px 120px; scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}
  .q{font-size:22px; font-weight:700; letter-spacing:-.3px; margin-bottom:8px;}
  .qs{font-size:13.5px; color:var(--placeholder); margin-bottom:20px; line-height:1.6;}
  .footer{position:absolute; bottom:0; left:0; right:0; padding:14px 20px 30px; background:#fff;}
  .btn-primary{width:100%; height:56px; border:none; border-radius:15px; font-size:16px; font-weight:700; color:#fff; cursor:pointer; background:var(--primary); background:var(--primary-grad); box-shadow:var(--btn-shadow);}
  .btn-primary:disabled{background:var(--tile); box-shadow:none; color:var(--placeholder); cursor:default;}

  .ac{display:flex; align-items:center; gap:12px; padding:15px 16px; border:1.5px solid var(--line);
    border-radius:15px; margin-bottom:10px; cursor:pointer; transition:.18s;}
  .ac.on{border-color:var(--primary); background:var(--primary-50);}
  .ac .ic{width:42px; height:42px; flex:0 0 auto; border-radius:13px; background:var(--tile);
    display:flex; align-items:center; justify-content:center;}
  .ac.on .ic{background:#fff;}
  .ac .ic iconify-icon{font-size:21px; color:var(--primary);}
  .ac .tx{flex:1; min-width:0;}
  .ac .t{font-size:15px; font-weight:700;}
  .ac .s{font-size:12px; color:var(--placeholder); margin-top:3px;}
  .ac .ck{font-size:22px; color:var(--line); flex:0 0 auto;}
  .ac.on .ck{color:var(--primary);}

  .addbtn{display:flex; align-items:center; justify-content:center; gap:7px; width:100%; height:52px;
    border:1.5px dashed var(--border); border-radius:15px; background:#fff; font-family:inherit;
    font-size:14.5px; font-weight:700; color:var(--sub); cursor:pointer;}
  .addbtn iconify-icon{font-size:19px; color:var(--primary);}

  .newbox{margin-top:14px; padding:16px; border:1.5px solid var(--primary-100); border-radius:15px; background:var(--primary-50);}
  .newbox .nh{font-size:13px; font-weight:800; color:var(--primary-dark); margin-bottom:11px;}
  .banks{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:11px;}
  .bk{height:38px; padding:0 13px; border:1.5px solid var(--line); border-radius:11px; background:#fff;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer;}
  .bk.on{border-color:var(--primary); background:#fff; color:var(--primary-dark);}
  .tin{width:100%; height:50px; border:1.5px solid var(--border); border-radius:12px; padding:0 14px;
    font-family:inherit; font-size:15px; font-weight:600; background:#fff;}
  .tin:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(37,99,235,.12);}
  .acmsg{font-size:12px; color:var(--placeholder); margin:9px 2px 0; line-height:1.6;}
  .acmsg.ok{color:var(--sub); font-weight:700;}
  .acbtn{width:100%; height:48px; margin-top:12px; border:none; border-radius:13px; cursor:pointer;
    background:var(--primary-grad); box-shadow:var(--btn-shadow); color:#fff; font-family:inherit; font-size:14.5px; font-weight:700;}
  .acbtn:disabled{background:#fff; box-shadow:none; color:var(--placeholder); cursor:default; border:1.5px solid var(--line);}
  .note{display:flex; gap:8px; margin-top:18px; padding:14px 15px; border-radius:13px; background:var(--tile);
    font-size:12.5px; color:var(--sub); line-height:1.7;}
  .note iconify-icon{font-size:16px; flex:0 0 auto; color:var(--primary); margin-top:2px;}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>
  <div class="topbar"><div class="back" onclick="lpBack('44_요청3_거래처.html')">‹</div><div class="ttl">결제 요청 4</div></div>
  <div class="prog"><i></i></div>

  <div class="body">
    <div class="q">어느 계좌로 받을까요?</div>
    <div class="qs">거래처가 결제하고 심사가 끝나면 이 계좌로 입금돼요.</div>

    <div id="acList">
      <div class="ac on" onclick="pick(this)" data-no="기업 302-1122-3344" data-nm="미라클상사 (사업자 계좌)">
        <span class="ic"><iconify-icon icon="mingcute:bank-fill"></iconify-icon></span>
        <span class="tx"><div class="t">기업 302-1122-3344</div><div class="s">미라클상사 (사업자 계좌)</div></span>
        <iconify-icon class="ck" icon="mingcute:check-circle-fill"></iconify-icon>
      </div>
      <div class="ac" onclick="pick(this)" data-no="국민 123456-04-567890" data-nm="미라클상사 (정산 전용)">
        <span class="ic"><iconify-icon icon="mingcute:bank-fill"></iconify-icon></span>
        <span class="tx"><div class="t">국민 123456-04-567890</div><div class="s">미라클상사 (정산 전용)</div></span>
        <iconify-icon class="ck" icon="mingcute:check-circle-fill"></iconify-icon>
      </div>
    </div>

    <button class="addbtn" onclick="openNew()"><iconify-icon icon="mingcute:add-fill"></iconify-icon>새 계좌 등록</button>

    <div class="newbox" id="newBox" style="display:none">
      <div class="nh">새 계좌 등록</div>
      <div class="banks" id="banks">
        <button class="bk on" onclick="pickBank(this)">기업</button>
        <button class="bk" onclick="pickBank(this)">국민</button>
        <button class="bk" onclick="pickBank(this)">신한</button>
        <button class="bk" onclick="pickBank(this)">우리</button>
        <button class="bk" onclick="pickBank(this)">하나</button>
        <button class="bk" onclick="pickBank(this)">농협</button>
        <button class="bk" onclick="pickBank(this)">카카오뱅크</button>
        <button class="bk" onclick="pickBank(this)">토스뱅크</button>
      </div>
      <input class="tin" id="acNo" inputmode="numeric" placeholder="계좌번호 (- 없이 숫자만)" oninput="chk()">
      <div class="acmsg" id="acMsg">사업자 명의 계좌만 등록할 수 있어요.</div>
      <button class="acbtn" id="acBtn" onclick="addAcct()" disabled>계좌 확인하고 등록</button>
    </div>

    <div class="note">
      <iconify-icon icon="mingcute:information-fill"></iconify-icon>
      <div>사업자 명의 계좌로만 받을 수 있어요. 대표 개인계좌로 받으려면 사업자등록증 사본이 추가로 필요합니다.</div>
    </div>
  </div>

  <div class="footer"><button class="btn-primary" onclick="go()">다음</button></div>
</div>
<script src="app.js?v=20260812c"></script>
<script>
function pick(el){
  document.querySelectorAll('#acList .ac').forEach(function(x){ x.classList.remove('on'); });
  el.classList.add('on');
}
function openNew(){
  var b = document.getElementById('newBox');
  b.style.display = b.style.display === 'none' ? 'block' : 'none';
}
function pickBank(el){
  document.querySelectorAll('#banks .bk').forEach(function(x){ x.classList.remove('on'); });
  el.classList.add('on');
  chk();
}
function chk(){
  var v = document.getElementById('acNo').value.replace(/[^0-9]/g, '');
  document.getElementById('acNo').value = v;
  var ok = v.length >= 10;
  document.getElementById('acBtn').disabled = !ok;
  var m = document.getElementById('acMsg');
  m.className = ok ? 'acmsg ok' : 'acmsg';
  m.textContent = ok ? '등록할 수 있는 계좌예요.' : '사업자 명의 계좌만 등록할 수 있어요.';
}
function addAcct(){
  var bank = document.querySelector('#banks .bk.on').textContent;
  var no = document.getElementById('acNo').value;
  var el = document.createElement('div');
  el.className = 'ac';
  el.dataset.no = bank + ' ' + no;
  el.dataset.nm = '미라클상사 (사업자 계좌)';
  el.setAttribute('onclick', 'pick(this)');
  el.innerHTML = '<span class="ic"><iconify-icon icon="mingcute:bank-fill"></iconify-icon></span>' +
    '<span class="tx"><div class="t">' + bank + ' ' + no + '</div><div class="s">미라클상사 (사업자 계좌)</div></span>' +
    '<iconify-icon class="ck" icon="mingcute:check-circle-fill"></iconify-icon>';
  document.getElementById('acList').appendChild(el);
  document.getElementById('acNo').value = '';
  chk();
  document.getElementById('newBox').style.display = 'none';
  pick(el);
}
function go(){
  var sel = document.querySelector('#acList .ac.on');
  try{ sessionStorage.setItem('rq_acct', sel ? sel.dataset.no : '기업 302-1122-3344'); }catch(e){}
  location.href = '46_요청5_서류.html';
}
</script>
</body>
</html>
