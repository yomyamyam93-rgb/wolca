<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>결제 등록 1 · 유형</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 스크롤바를 보이지 않게 (스크롤은 그대로 됨) */
html,body{scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0; height:0; display:none;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0; height:0;}
  :root{--primary:#1463F3; --primary-dark:#0E4FC7; --primary-50:#EFF4FF; --page-bg:#c9cdd4; --bg:#FFFFFF; --line:#ECEEF1; --border:#CCD0D8; --tile:#EEF1F4; --icon-off:#B0B8C1; --sub:#4E5968; --ink:#1D2023; --placeholder:#8B95A1;}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  /* 한글은 단어 단위로만 줄바꿈 (한 글자만 떨어지는 것 방지) */
  body{word-break:keep-all; overflow-wrap:break-word;}
  body{font-family:'Pretendard',sans-serif; color:var(--ink); background:var(--page-bg); display:flex; justify-content:center; align-items:flex-start; padding:24px 0; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; height:844px; max-width:100%; background:#fff; position:relative; display:flex; flex-direction:column; border-radius:46px; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.28);}
  iconify-icon{display:inline-block;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 30px; flex:0 0 auto;}
  .statusbar .time{font-size:15px; font-weight:700;}
  .statusbar .stat{display:flex; align-items:center; gap:7px;}
  .topbar{height:50px; position:sticky; top:0; z-index:50; background:#fff; display:flex; align-items:center; padding:0 10px; flex:0 0 auto;}
  .back{width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink); cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:16px; font-weight:700; margin-right:40px;}
  .prog4{display:flex; gap:6px; margin:2px 20px 8px;}
  .prog4 i{flex:1; height:4px; border-radius:2px; background:var(--line);}
  .prog4 i.on{background:var(--primary);}
  .stepcap{margin:0 20px 4px; font-size:12.5px; font-weight:700; color:var(--placeholder);}
  .body{flex:1; overflow-y:auto; padding:14px 20px 24px; scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}
  .q{font-size:22px; font-weight:700; letter-spacing:-.3px; margin-bottom:16px;}
  .catrow{display:flex; align-items:center; gap:14px; padding:14px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
  .catrow:last-child{border-bottom:none;}
  .catrow .ct{flex:1; min-width:0; display:flex; align-items:baseline; gap:9px;}
  .catrow .ct .cn{font-size:17px; font-weight:800; color:var(--ink); letter-spacing:-.3px; flex:0 0 auto;}
  .catrow .ct .cd{font-size:12.5px; color:var(--placeholder); min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .catrow .gv{color:var(--icon-off); font-size:20px;}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
/* ===== 웹앱 모드 — 폰 프레임 제거 · 웹과 앱 공용 화면 ===== */
body{display:block !important; padding:0 !important; background:#EDF0F4 !important;}
.phone{width:100% !important; max-width:480px !important; height:auto !important; min-height:100svh;
  margin:0 auto !important; border-radius:0 !important; box-shadow:0 0 44px rgba(15,23,42,.10) !important;}
.statusbar,.home-indicator{display:none !important;}
.screen,.body{overflow:visible !important;}
.tabbar{position:fixed !important; left:50% !important; right:auto !important; transform:translateX(-50%);
  width:100%; max-width:480px; bottom:0 !important; z-index:80;}
.cta,.bottom,.btm{position:fixed !important; left:50% !important; right:auto !important; transform:translateX(-50%);
  width:100%; max-width:480px; bottom:0 !important; z-index:80;}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2C11 2 13.3 3 15 4.7l-1.3 1.4C12.3 4.7 10.5 4 8.5 4S4.7 4.7 3.3 6.1L2 4.7C3.7 3 6 2 8.5 2z" fill="#191F28"/><circle cx="8.5" cy="10" r="1.3" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>
  <div class="topbar"><div class="back" onclick="goBack()">‹</div><div class="ttl">결제 등록</div></div>
  <div class="prog4"><i class="on"></i><i></i><i></i><i></i></div>
  <div class="stepcap">STEP 1 / 4</div>

  <div class="body">
    <div class="q">무엇을 결제할까요?</div>
    <div class="catrow" onclick="go('월세')"><div class="ct"><div class="cn">월세</div><div class="cd">부동산 임대차 월세</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('관리비')"><div class="ct"><div class="cn">관리비</div><div class="cd">아파트 · 상가 관리비</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('인건비')"><div class="ct"><div class="cn">인건비</div><div class="cd">급여 · 알바 · 프리랜서</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('보증금')"><div class="ct"><div class="cn">보증금</div><div class="cd">계약금 · 보증금</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('매입대금')"><div class="ct"><div class="cn">매입대금</div><div class="cd">거래처 · 식자재 대금</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('학원비')"><div class="ct"><div class="cn">학원비</div><div class="cd">학원 · 수강료 · 과외</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('학교공과금')"><div class="ct"><div class="cn">학교공과금</div><div class="cd">등록금 · 기숙사비</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('인테리어')"><div class="ct"><div class="cn">인테리어</div><div class="cd">공사 · 수리 · 시공 · 철거</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('이사')"><div class="ct"><div class="cn">이사</div><div class="cd">용달 · 포장이사</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('청소비')"><div class="ct"><div class="cn">청소비</div><div class="cd">입주 · 정기 청소</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('중개수수료')"><div class="ct"><div class="cn">중개수수료</div><div class="cd">부동산 중개보수</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
    <div class="catrow" onclick="go('기타')"><div class="ct"><div class="cn">기타</div><div class="cd">위 유형이 아닌 납부건</div></div><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon></div>
  </div>
</div>
<script>
function go(t){
  try{ var r=JSON.parse(sessionStorage.getItem('lp_reg')||'{}'); r.유형=t; sessionStorage.setItem('lp_reg',JSON.stringify(r)); }catch(e){}
  location.href='등록2_정보.html';
}
/* 탭바에서 바로 들어온 경우엔 되돌아갈 기록이 없으므로 홈으로 */
function goBack(){
  /* 첫 단계라 항상 홈으로 (개인·사업자 자동 구분) */
  var biz=false;
  try{ biz = sessionStorage.getItem('lp_type')==='biz'; }catch(e){}
  location.href = biz ? '../app.html' : '../app.html';
}
</script>
<script src="app.js?v=20260812c"></script>
</body>
</html>
