<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>랜선페이 — 채팅 상담</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 스크롤바를 보이지 않게 (스크롤은 그대로 됨) */
html,body{scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0; height:0; display:none;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0; height:0;}
  :root{
    --primary:#2563EB; --primary-dark:#1D4ED8; --primary-50:#EFF4FF;
    --page-bg:#c9cdd4; --bg:#F4F5F6; --card:#FFFFFF; --line:#ECEEF1; --border:#B1B8BE;
    --tile:#EEF1F4; --icon-off:#B0B8C1; --sub:#4E5968; --ink:#191F28; --placeholder:#8B95A1;
    --success:#059669;
    --primary-grad:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #ffffff), var(--primary));
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  /* 한글은 단어 단위로만 줄바꿈 (한 글자만 떨어지는 것 방지) */
  body{word-break:keep-all; overflow-wrap:break-word;}
  body{font-family:'Pretendard',-apple-system,sans-serif; color:var(--ink); background:var(--page-bg);
       display:flex; justify-content:center; align-items:flex-start; padding:24px 0; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; height:844px; max-width:100%; background:var(--bg); position:relative; display:flex; flex-direction:column;
         border-radius:46px; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.28);}
  iconify-icon{display:inline-block;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 30px; background:#fff; flex:0 0 auto;}
  .statusbar .time{font-size:15px; font-weight:700;}
  .statusbar .stat{display:flex; align-items:center; gap:7px;}

  .topbar{height:58px; display:flex; align-items:center; gap:10px; padding:0 10px; background:#fff; border-bottom:1px solid var(--line); flex:0 0 auto;}
  .topbar .back{width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink); cursor:pointer;}
  .topbar .av{width:36px; height:36px; border-radius:12px; background:var(--primary-50); display:flex; align-items:center; justify-content:center;}
  .topbar .av img{width:22px;}
  .topbar .who{flex:1; min-width:0;}
  .topbar .n{font-size:15px; font-weight:700;}
  .topbar .s{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--sub); font-weight:600; margin-top:2px;}
  .topbar .s i{width:6px; height:6px; border-radius:50%; background:var(--success); display:inline-block;}

  .chat{flex:1; overflow-y:auto; padding:18px 16px 10px; scrollbar-width:none; display:flex; flex-direction:column; gap:10px;}
  .chat::-webkit-scrollbar{display:none;}
  .day{text-align:center; font-size:11.5px; color:var(--placeholder); margin:4px 0 6px;}

  .msg{display:flex; gap:9px; max-width:84%;}
  .msg .av{width:30px; height:30px; flex:0 0 auto; border-radius:10px; background:var(--primary-50); display:flex; align-items:center; justify-content:center;}
  .msg .av img{width:18px;}
  .bub{padding:12px 14px; border-radius:16px; font-size:14px; line-height:1.6; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .bub b{font-weight:700;}
  .time{font-size:10.5px; color:var(--placeholder); align-self:flex-end; margin-bottom:2px;}

  .me{align-self:flex-end; flex-direction:row-reverse;}
  .me .bub{background:var(--primary); background:var(--primary-grad); color:#fff; box-shadow:0 3px 10px -4px rgba(37,99,235,.5);}

  .quick{display:flex; gap:7px; flex-wrap:wrap; padding:4px 16px 12px;}
  .quick span{padding:9px 14px; border-radius:999px; border:1px solid var(--primary-100, #DBE7FF); background:#fff;
    font-size:12.5px; font-weight:700; color:var(--primary-dark); cursor:pointer;}

  .inputbar{flex:0 0 auto; display:flex; align-items:center; gap:9px; padding:12px 16px 26px; background:#fff; border-top:1px solid var(--line);}
  .inputbar .plus{width:40px; height:40px; flex:0 0 auto; border-radius:50%; background:var(--tile); border:none;
    display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--sub); cursor:pointer;}
  .inputbar input{flex:1; height:44px; border:1.5px solid var(--line); border-radius:22px; padding:0 16px; font-family:inherit;
    font-size:14.5px; background:#fff;}
  .inputbar input:focus{outline:none; border-color:var(--primary);}
  .inputbar .send{width:44px; height:44px; flex:0 0 auto; border-radius:50%; border:none; background:var(--primary-grad);
    display:flex; align-items:center; justify-content:center; font-size:19px; color:#fff; cursor:pointer;}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2C11 2 13.3 3 15 4.7l-1.3 1.4C12.3 4.7 10.5 4 8.5 4S4.7 4.7 3.3 6.1L2 4.7C3.7 3 6 2 8.5 2z" fill="#191F28"/><circle cx="8.5" cy="10" r="1.3" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>

  <div class="topbar">
    <div class="back" onclick="goBack()">‹</div>
    <div class="av"><img src="../img/logo3.png" alt=""></div>
    <div class="who">
      <div class="n">랜선페이 상담</div>
      <div class="s"><i></i>지금 상담 가능 · 평일 9~18시</div>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="day">2026년 8월 4일</div>

    <div class="msg">
      <span class="av"><img src="../img/logo3.png" alt=""></span>
      <div class="bub">안녕하세요 김랜선님 👋<br>랜선페이 상담원입니다. 무엇을 도와드릴까요?</div>
      <span class="time">9:38</span>
    </div>

    <div class="msg">
      <span class="av"><img src="../img/logo3.png" alt=""></span>
      <div class="bub">아래에서 골라주시면 더 빠르게 안내해드릴 수 있어요.</div>
      <span class="time">9:38</span>
    </div>
  </div>

  <div class="quick" id="quick">
    <span onclick="ask('결제가 언제 입금되나요?')">입금 언제 되나요?</span>
    <span onclick="ask('서류가 반려됐어요')">서류가 반려됐어요</span>
    <span onclick="ask('결제를 취소하고 싶어요')">결제 취소하고 싶어요</span>
    <span onclick="ask('수수료가 궁금해요')">수수료가 궁금해요</span>
  </div>

  <div class="inputbar">
    <button class="plus" onclick="alert('사진 첨부는 준비 중이에요')"><iconify-icon icon="mingcute:add-line"></iconify-icon></button>
    <input id="inp" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')send()">
    <button class="send" onclick="send()"><iconify-icon icon="mingcute:send-plane-fill"></iconify-icon></button>
  </div>
</div>
<script src="app.js"></script>
<script>
var ANS = {
  '결제가 언제 입금되나요?': '담당자가 서류를 확인한 뒤 입금해드려요. 보통 <b>영업일 기준 30분 이내</b>에 완료됩니다. 지금 진행 중인 건은 <b>12분 경과</b>했어요.',
  '서류가 반려됐어요': '반려 사유를 확인해보시고 <b>다시 올려주시면</b> 재검토해드려요. 금액과 계좌번호가 잘 보이게 촬영해주시면 통과율이 높아요.',
  '결제를 취소하고 싶어요': '입금 전이라면 <b>결제 상세 화면</b>에서 바로 취소할 수 있어요. 수수료도 들지 않습니다.',
  '수수료가 궁금해요': '결제 금액의 <b>4%</b>예요. 가입비나 월 이용료는 없어요.'
};
function now(){
  var d = new Date();
  return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}
function bubble(text, mine){
  var wrap = document.createElement('div');
  wrap.className = 'msg' + (mine ? ' me' : '');
  wrap.innerHTML = (mine ? '' : '<span class="av"><img src="../img/logo3.png" alt=""></span>') +
    '<div class="bub">' + text + '</div><span class="time">' + now() + '</span>';
  document.getElementById('chat').appendChild(wrap);
  var c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}
function ask(q){
  bubble(q, true);
  document.getElementById('quick').style.display = 'none';
  setTimeout(function(){ bubble(ANS[q] || '확인 후 안내해드릴게요. 잠시만 기다려주세요.', false); }, 700);
}
function send(){
  var i = document.getElementById('inp');
  var v = i.value.trim();
  if (!v) return;
  i.value = '';
  bubble(v, true);
  document.getElementById('quick').style.display = 'none';
  setTimeout(function(){ bubble('확인하고 있어요. 잠시만 기다려주세요 🙂', false); }, 800);
}
function goBack(){ lpBack('21_더보기.html'); }
</script>
</body>
</html>
