<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>랜선페이 — 공지사항</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 스크롤바를 보이지 않게 (스크롤은 그대로 됨) */
html,body{scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0; height:0; display:none;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0; height:0;}
html{scrollbar-gutter:stable;}

  :root{
    --primary:#2563EB; --primary-dark:#1D4ED8; --primary-50:#EFF4FF;
    --page-bg:#c9cdd4; --bg:#F4F5F6; --card:#FFFFFF; --line:#ECEEF1; --border:#B1B8BE;
    --tile:#EEF1F4; --icon-off:#B0B8C1; --sub:#4E5968; --ink:#191F28; --placeholder:#8B95A1;
    --warn:#B45309; --warn-bg:#FFF7ED;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  /* 한글은 단어 단위로만 줄바꿈 (한 글자만 떨어지는 것 방지) */
  body{word-break:keep-all; overflow-wrap:break-word;}
  body{font-family:'Pretendard',-apple-system,sans-serif; color:var(--ink); background:var(--page-bg);
       display:flex; justify-content:center; align-items:flex-start; padding:24px 0; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; height:844px; max-width:100%; background:var(--bg); position:relative; display:flex; flex-direction:column;
         border-radius:46px; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.28);}
  iconify-icon{display:inline-block;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 30px; background:var(--bg); flex:0 0 auto;}
  .statusbar .time{font-size:15px; font-weight:700;}
  .statusbar .stat{display:flex; align-items:center; gap:7px;}
  .topbar{height:54px; display:flex; align-items:center; padding:0 10px; background:var(--bg); flex:0 0 auto;}
  .topbar .back{width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink); cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:17px; font-weight:700; margin-right:44px;}

  .body{flex:1; overflow-y:auto; padding:6px 20px 40px; scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}

  .list{background:var(--card); border-radius:18px; padding:2px 16px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .it{padding:17px 0; cursor:pointer;}
  .it+.it{border-top:1px solid var(--line);}
  .it .top{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .it .tag{font-size:11px; font-weight:800; padding:4px 8px; border-radius:7px; color:var(--primary-dark); background:var(--primary-50);}
  .it .tag.fix{color:var(--primary-dark); background:var(--primary-50);}
  .it .new{width:16px; height:16px; border-radius:50%; background:#EF4444; color:#fff; font-size:9px; font-weight:800;
    display:flex; align-items:center; justify-content:center;}
  .it .d{margin-left:auto; font-size:12px; color:var(--placeholder);}
  .it .t{font-size:14.5px; font-weight:600; line-height:1.5;}

  /* 상세 */
  .detail{display:none; padding:6px 20px 40px;}
  .detail.on{display:block;}
  .dh{background:var(--card); border-radius:18px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .dh .tag{font-size:11px; font-weight:800; padding:4px 8px; border-radius:7px; color:var(--primary-dark); background:var(--primary-50);}
  .dh .t{font-size:19px; font-weight:800; letter-spacing:-.4px; margin-top:11px; line-height:1.4;}
  .dh .d{font-size:12.5px; color:var(--placeholder); margin-top:9px;}
  .dc{background:var(--card); border-radius:18px; padding:20px; margin-top:11px; box-shadow:0 1px 3px rgba(0,0,0,.04);
    font-size:14px; color:var(--sub); line-height:1.8;}
  .dc b{color:var(--ink);}
  .dc ul{margin:10px 0 0 2px; list-style:none;}
  .dc li{position:relative; padding-left:16px; margin-bottom:7px;}
  .dc li:before{content:''; position:absolute; left:2px; top:9px; width:5px; height:5px; border-radius:50%; background:var(--primary);}

  /* ===== 하단 탭바 ===== */
  .navbar{position:absolute; bottom:0; left:0; right:0; z-index:20; background:#fff;
    border-top:1px solid var(--line); padding-top:12px;}
  .nvbar{display:flex; padding:0 6px;}
  .nvtab{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    color:#8B95A1; font-size:11px; font-weight:500; cursor:pointer;}
  .nvtab iconify-icon{font-size:23px;}
  .nvtab.on{color:var(--primary); font-weight:700;}
  .nvtab.center{justify-content:center; gap:0;}
  .fab{width:56px; height:56px; margin-top:-24px; border:none; padding:0; border-radius:50%; pointer-events:none;
    display:flex; align-items:center; justify-content:center; background:var(--primary);
    box-shadow:0 6px 16px rgba(37,99,235,.45), 0 0 0 5px #fff, inset 0 1px 0 rgba(255,255,255,.28);}
  .fab img{width:29px;}
  .home-indicator{margin:10px auto 8px; width:134px; height:5px; border-radius:3px; background:var(--ink);}
  .body,.detail{padding-bottom:112px !important;}
  .detail{overflow-y:auto;}
  .dnote{margin-top:18px; padding:14px 16px; border-radius:12px; background:var(--primary-50);
    color:var(--primary-dark); font-size:13px; line-height:1.75;}
  .dnote b{color:var(--primary-dark);}
  /* 무이자 표 (홈페이지와 같은 데이터) */
  .fsec{margin-top:24px; font-size:15.5px; font-weight:800; color:var(--ink);}
  .fsub{margin-top:6px; font-size:13px; color:var(--sub); line-height:1.6;}
  .ftarget{display:block; width:fit-content; margin-top:12px; padding:5px 10px; border-radius:8px;
    background:var(--primary-50); color:var(--primary-dark); font-size:12.5px; font-weight:800;}
  .ftable{width:100%; border-collapse:collapse; margin-top:12px;}
  .ftable th,.ftable td{padding:10px 2px; border-bottom:1px solid var(--line); font-size:13.5px; text-align:left; color:var(--ink);}
  .ftable thead th{font-size:12px; font-weight:800; color:var(--placeholder); border-bottom:1.5px solid var(--ink);}
  .ftable .r{text-align:right;}
  .ftable tbody td{font-weight:800; color:var(--primary-dark);}
  .fcard{display:flex; align-items:center; gap:8px; min-height:28px;}
  .flogo-slot{flex:0 0 auto; width:44px; height:20px; display:flex; align-items:center;}
  .flogo{max-width:100%; max-height:100%; object-fit:contain; object-position:left center;}
  .flogo.wide{max-height:11px;}
  .fname{font-size:13.5px; font-weight:700; white-space:nowrap;}
  .ftable.part th,.ftable.part td{padding:8px 2px; border-bottom:none; vertical-align:middle;}
  .ftable.part tr.grp th,.ftable.part tr.grp td{border-top:1px solid var(--line);}
  .ftable.part tr.grp:first-child th,.ftable.part tr.grp:first-child td{border-top:none;}
  .ftable.part .mo{font-size:13px; font-weight:700; color:var(--ink);}
  .ftable.part .bd{font-size:12.5px; font-weight:600; color:var(--sub);}
  .fnotes{list-style:none; margin-top:12px;}
  .fnotes li{position:relative; padding-left:13px; font-size:13px; color:var(--sub); line-height:1.7; margin-bottom:8px;}
  .fnotes li:before{content:'·'; position:absolute; left:2px; color:var(--icon-off);}
  .fnotes b{color:var(--ink);}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2C11 2 13.3 3 15 4.7l-1.3 1.4C12.3 4.7 10.5 4 8.5 4S4.7 4.7 3.3 6.1L2 4.7C3.7 3 6 2 8.5 2z" fill="#191F28"/><circle cx="8.5" cy="10" r="1.3" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>

  <div class="topbar"><div class="back" onclick="back()">‹</div><div class="ttl" id="ttl">공지사항</div></div>

  <!-- 목록 -->
  <div class="body" id="listView">
    <div class="list" id="noList"></div>
  </div>
  <!-- 상세 -->
  <div class="detail" id="detailView">
    <div class="dh"><span class="tag" id="dTag"></span>
      <div class="t" id="dTtl"></div><div class="d" id="dDate"></div></div>
    <div class="dc" id="dBody"></div>
  </div>
  <div class="navbar">
    <div class="nvbar">
      <div class="nvtab" onclick="location.href='9_홈_개인.html'"><iconify-icon icon="mingcute:home-4-fill"></iconify-icon><span>홈</span></div>
      <div class="nvtab" onclick="location.href='15_내결제.html'"><iconify-icon icon="mingcute:bill-fill"></iconify-icon><span>내 결제</span></div>
      <div class="nvtab center" onclick="location.href='10_1_유형선택.html'" aria-label="결제하기"><button class="fab"><img src="../img/logo3-white.png" alt="결제하기"></button></div>
      <div class="nvtab" onclick="location.href='19_혜택.html'"><iconify-icon icon="mingcute:gift-fill"></iconify-icon><span>혜택</span></div>
      <div class="nvtab on" onclick="location.href='21_더보기.html'"><iconify-icon icon="mingcute:menu-fill"></iconify-icon><span>더보기</span></div>
    </div>
    <div class="home-indicator"></div>
  </div>

</div>
<script src="../홈페이지/게시글.js"></script>
<script src="app.js"></script>
<script>
/* 홈페이지와 같은 공지 데이터(게시글.js 의 NOS)를 씁니다 */
var NO_ORDER = (typeof NOS === 'undefined') ? [] :
  NOS.map(function(n, i){ return {n:n, i:i}; })
     .sort(function(a, b){ return (b.n.pin ? 1 : 0) - (a.n.pin ? 1 : 0); });

function drawList(){
  document.getElementById('noList').innerHTML = NO_ORDER.map(function(r){
    return '<div class="it" onclick="open1(' + r.i + ')">'
      + '<div class="top"><span class="tag' + (r.n.tag === '점검' ? ' fix' : '') + '">' + r.n.tag + '</span>'
      + (r.n.pin ? '<span class="new">N</span>' : '')
      + '<span class="d">' + r.n.meta + '</span></div>'
      + '<div class="t">' + r.n.ttl + '</div></div>';
  }).join('');
}

function open1(i){
  var n = NOS[i];
  if (!n) return;
  document.getElementById('dTag').textContent = n.tag;
  document.getElementById('dTtl').innerHTML = n.ttl;
  document.getElementById('dDate').textContent = n.meta;
  document.getElementById('dBody').innerHTML =
      n.body.replace(/\n/g, '<br>')
      + (n.table && typeof freeHTML === 'function' ? freeHTML() : '')
      + (n.note ? '<div class="dnote"><b>유의사항</b><br>' + n.note + '</div>' : '');
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').classList.add('on');
  document.getElementById('detailView').scrollTop = 0;
}
drawList();
/* 홈에서 '카드 할부 정보'로 들어오면 무이자 공지를 바로 열어줍니다 */
if (location.hash === '#free'){
  var fi = NOS.findIndex(function(n){ return n.table; });
  if (fi > -1) open1(fi);
}
function back(){
  if (document.getElementById('detailView').classList.contains('on')) {
    document.getElementById('detailView').classList.remove('on');
    document.getElementById('listView').style.display = 'block';
    return;
  }
  lpBack('21_더보기.html');
}
</script>
</body>
</html>
