<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>결제 등록 · 서류 등록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--primary:#156FF9; --primary-dark:#0F5AD1; --primary-50:#EFF4FF; --line:#ECEEF1;
    --sub:#4E5968; --ink:#1D2023; --placeholder:#8B95A1; --danger:#DC2626; --ok:#059669;
    --grad:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #ffffff), var(--primary));}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{scrollbar-width:none;} body::-webkit-scrollbar{display:none;}
  body{font-family:'Pretendard',sans-serif; color:var(--ink); background:#EDF0F4;
    word-break:keep-all; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:100%; max-width:480px; min-height:100svh; margin:0 auto; background:#fff;
    box-shadow:0 0 44px rgba(15,23,42,.10); display:flex; flex-direction:column;}
  .topbar{height:52px; position:sticky; top:0; z-index:50; background:#fff; display:flex; align-items:center; padding:0 10px;}
  .back{width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:16px; font-weight:700; margin-right:40px;}
  .prog4{display:flex; gap:6px; margin:2px 20px 8px;}
  .prog4 i{flex:1; height:4px; border-radius:2px; background:var(--line);}
  .prog4 i.on{background:var(--primary);}
  .stepcap{margin:0 20px; font-size:12.5px; font-weight:700; color:var(--placeholder);}
  .body{flex:1; padding:10px 20px 30px;}
  .q{font-size:21px; font-weight:800; letter-spacing:-.3px; margin:6px 0 16px;}
  .docs{background:var(--primary-50); border-radius:8px; padding:15px 16px; margin-bottom:16px;}
  .docs b{display:block; font-size:13.5px; margin-bottom:8px;}
  .docs .dr{display:flex; gap:8px; font-size:13px; color:var(--sub); margin-bottom:5px; line-height:1.55;}
  .docs .dr:last-child{margin-bottom:0;}
  .docs .dr i{font-style:normal; color:var(--primary); font-weight:800;}
  .up{border:1.5px dashed var(--line); border-radius:8px; padding:22px 16px; text-align:center; cursor:pointer;}
  .up iconify-icon{font-size:26px; color:var(--primary);}
  .up p{margin-top:6px; font-size:13.5px; font-weight:700;}
  .up small{display:block; margin-top:3px; font-size:11.5px; color:var(--placeholder);}
  .files{margin-top:10px;}
  .frow{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub);
    padding:9px 12px; background:#F7F8FA; border-radius:8px; margin-bottom:6px;}
  .frow iconify-icon{color:var(--ok);}
  .sum{margin-top:20px; border:1px solid var(--line); border-radius:8px; padding:15px 16px;}
  .sum b{display:block; font-size:13.5px; margin-bottom:9px;}
  .sr{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px;}
  .sr span{color:var(--placeholder);}
  .sr em{font-style:normal; font-weight:700; text-align:right;}
  .hint{margin-top:8px; font-size:12px; color:var(--placeholder);}
  .hint.err{color:var(--danger); font-weight:700;}
  .navs{display:flex; gap:10px; margin-top:24px;}
  .navs button{flex:1; height:52px; border-radius:8px; font:inherit; font-size:15.5px; font-weight:700; cursor:pointer;}
  .prev{border:1px solid var(--line); background:#fff; color:var(--ink);}
  .next{border:none; color:#fff; background:var(--primary); background:var(--grad);
    box-shadow:0 4px 12px color-mix(in srgb, var(--primary) 32%, transparent);}
  /* 서류 준비 안내 버튼 · 시트 */
  .gbtn2{width:100%; height:46px; margin:-6px 0 16px; border:1px solid var(--line);
    border-radius:8px; background:#fff; font:inherit; font-size:14px; font-weight:700;
    color:var(--primary-dark); display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;}
  .gbtn2 iconify-icon{font-size:17px;}
  .gdim{position:fixed; inset:0; z-index:110; background:rgba(15,23,42,.45); display:none;}
  .gdim.on{display:block;}
  .gsheet{position:fixed; left:50%; bottom:0; transform:translateX(-50%) translateY(102%);
    z-index:120; width:100%; max-width:480px;
    max-height:92svh; min-height:min(72svh, 620px); background:#fff;
    border-radius:16px 16px 0 0; transition:transform .28s cubic-bezier(.3,.7,.3,1);
    display:flex; flex-direction:column;}
  .gsheet.on{transform:translateX(-50%) translateY(0);}
  .gsheet .gh{flex:0 0 auto; padding:18px 26px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;}
  .gsheet .gh b{font-size:16.5px; font-weight:800; letter-spacing:-.3px;}
  .gsheet .gh button{border:none; background:none; font-size:22px; color:var(--sub); cursor:pointer;}
  .gbody{flex:1 1 auto; overflow-y:auto;
    padding:24px 26px calc(34px + env(safe-area-inset-bottom, 0px));}
  .gbody *{max-width:100%; box-sizing:border-box;}
  .gbody a{word-break:break-all;}
  /* 큰 단계 제목 */
  .gbody h4{font-size:15.5px; font-weight:800; color:var(--ink); letter-spacing:-.3px;
    margin:32px 0 12px; padding-left:12px; border-left:3px solid var(--primary); line-height:1.4;}
  .gbody h4:first-child{margin-top:0;}
  /* 설명 문장 */
  .gbody p{font-size:14px; line-height:1.78; color:var(--sub); margin:0 0 14px;}
  .gbody p.mid{font-size:14px; font-weight:700; color:var(--ink); margin:18px 0 10px;}
  /* 서류 목록: 번호와 글이 어긋나지 않게 */
  .gbody ol{margin:0 0 18px; padding:0; list-style:none;
    background:#F7F9FC; border-radius:10px; padding:14px 16px;}
  .gbody ol li{display:flex; gap:9px; font-size:14px; line-height:1.72; color:var(--ink);
    padding:8px 0; min-width:0;}
  .gbody ol li > span:last-child{flex:1 1 auto; min-width:0; word-break:keep-all;}
  .gbody ol li + li{border-top:1px solid #EDF1F6;}
  .gbody ol li .n{flex:0 0 auto; min-width:17px; color:var(--primary); font-weight:800;
    font-variant-numeric:tabular-nums;}
  .gbody ol li b{font-weight:700;}
  /* 유의사항 */
  .gbody .warn{background:var(--primary-50); border-radius:10px; padding:18px 18px; margin:24px 0 0;
    font-size:13.2px; line-height:1.85; color:var(--sub);}
  .gbody .warn b{display:inline-block; color:var(--ink); font-weight:800; margin-bottom:4px;}
  .gbody a{color:var(--primary-dark); font-weight:700; text-decoration:underline;}
  /* 휴대폰 글줄 정리: 본문은 줄 끝까지 채우고 제목·강조는 어절을 지킨다 */
  p, li, dd, .a, .dr, .tx{word-break:normal; overflow-wrap:anywhere; letter-spacing:-.2px;}
  p b, li b, strong, h1, h2, h3, b{word-break:keep-all;}

</style>
<style id="figma-icons">iconify-icon{display:inline-block;width:1em;height:1em;line-height:0;vertical-align:-0.125em}iconify-icon>svg{display:block;width:1em;height:1em}</style>
<script>/* 피그마 가져오기용: ?type=관리비 → 이 화면이 그 유형으로 열리게 (페이지 스크립트보다 먼저) */
(function(){try{var q=new URLSearchParams(location.search), t=q.get('type'); if(t){var r=JSON.parse(sessionStorage.getItem('lp_reg')||'{}'); r.유형=t; sessionStorage.setItem('lp_reg', JSON.stringify(r));}}catch(e){}})();
</script>
<style id="figma-fix-app">/* 피그마 가져오기용(앱) */
*,*::before,*::after{animation:none!important;transition:none!important}
.apphull{min-height:0!important; position:relative!important;}
.atab{position:absolute!important; left:0!important; right:0!important; bottom:0!important; transform:none!important; width:100%!important; max-width:none!important;}
.figma-drawer .drawer{height:780px!important; top:0!important; bottom:auto!important;}
.figma-drawer .dim{height:780px!important; top:0!important; bottom:auto!important;}
.figma-sheet .docsheet, .figma-sheet .dsheet, .figma-sheet .pksheet, .figma-sheet .gsheet{max-height:none!important;}
/* figma-app-scroll: 안쪽 스크롤 틀을 펼쳐 페이지가 내용 길이만큼 길어지게 (가져오기는 화면 높이만큼만 담기 때문) */
html,body{height:auto!important; max-height:none!important; overflow:visible!important;}
.apphull{height:auto!important; max-height:none!important; overflow:visible!important;}
/* ?slides=all → 롤링 배너 7장을 세로로 전부 펼침 */
.figma-slides .atrack{flex-direction:column!important; width:100%!important; transform:none!important;}
.figma-slides .aup{flex:none!important; width:100%!important; margin:0 0 12px!important;}
.figma-slides #uspdots{display:none!important;}
/* ?slides=row → 롤링 배너 7장만 가로 한 줄(장당 360px)로 */
.figma-row body{width:2520px!important; margin:0!important; padding:0!important; background:#fff!important; display:block!important; min-height:0!important;}
.figma-row .apphull{width:2520px!important; max-width:none!important; box-shadow:none!important; padding:0!important;}
.figma-row .sheet{width:2520px!important; border-radius:0!important; padding:0!important; margin:0!important;}
.figma-row .aband{overflow:visible!important; margin:0!important; padding:0!important; width:2520px!important; border-radius:0!important;}
.figma-row .atrack{display:flex!important; flex-direction:row!important; transform:none!important; width:2520px!important;}
.figma-row .aup{flex:0 0 360px!important; width:360px!important; margin:0!important;}
.figma-row #uspdots{display:none!important;}
/* 기본 앱 홈: 배너 7장이 프레임 오른쪽 밖으로 이어져 보이게 (잘라내기 해제) */
.figma-strip .sheet, .figma-strip .uspband, .figma-strip .aband{overflow:visible!important;}
.figma-strip .atrack{width:max-content!important;}
/* 목록 행: 아이콘과 글자 사이 간격을 gap 대신 margin 으로 (피그마 가져오기에서 gap 이 빠지던 문제) */
.gbtn.grow{gap:0!important;} .gbtn.grow > .ic{margin-right:12px!important;}
/* ?only=1: 시트만 남긴 화면 */
.figma-only body, .figma-only .apphull{background:transparent!important; box-shadow:none!important; min-height:0!important; padding:0!important; margin:0!important; width:360px!important; max-width:none!important;}
.figma-only .atab{display:none!important;}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar"><div class="back" onclick="location.href='등록3_결제.html'">‹</div><div class="ttl">결제 등록</div></div>
  <div class="prog4"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
  <div class="stepcap">STEP 4 / 4</div>

  <div class="body">
    <div class="q">서류를 올리고 확인하세요</div>

    <div class="docs" id="서류안내">
      <b id="서류제목">필요 서류</b>
      <div id="서류목록"></div>
    </div>

    <button class="gbtn2" type="button" id="안내열기">
      <iconify-icon icon="mingcute:document-2-fill"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 8.5a1.5 1.5 0 0 0 1.5 1.5H20v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h6zM9 16a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2zm0-4a1 1 0 1 0 0 2h1a1 1 0 1 0 0-2zm5-9.956a2 2 0 0 1 1 .542L19.414 7a2 2 0 0 1 .541 1H14z"/></svg></iconify-icon>이렇게 서류를 준비해주세요
    </button>

    <div class="up" onclick="document.getElementById('파일').click()">
      <iconify-icon icon="mingcute:camera-2-fill"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M14.793 3a1.5 1.5 0 0 1 1.06.44L17.415 5H20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2.586l1.56-1.56A1.5 1.5 0 0 1 9.207 3zM12 7.5a5 5 0 1 0 0 10a5 5 0 0 0 0-10m0 2a3 3 0 1 1 0 6a3 3 0 0 1 0-6"/></svg></iconify-icon>
      <p>서류 촬영 또는 파일 올리기</p>
      <small>PDF · 사진 · 문서 파일 최대 5개</small>
      <input type="file" id="파일" accept="image/*,.pdf" multiple hidden>
    </div>
    <div class="files" id="파일들"></div>


    
    <div class="sum">
      <b>입력 내용 확인</b>
      <div class="sr"><span>항목</span><em id="요약유형">-</em></div>
      <div class="sr"><span>받는 분</span><em id="요약받는분">-</em></div>
      <div class="sr"><span>송금액</span><em id="요약금액">-</em></div>
      <div class="sr"><span>결제</span><em id="요약결제">-</em></div>
      <div class="sr"><span>송금 시점</span><em id="요약시점">-</em></div>
    </div>
    <div class="hint">등록하면 연중무휴로 검토가 시작되고 끝나는 대로 결과를 알려드려요.</div>
    <div class="hint err" id="오류" style="display:none"></div>

    <div class="navs">
      <button class="prev" type="button" onclick="location.href='등록3_결제.html'">이전</button>
      <button class="next" type="button" id="완료">등록 완료</button>
    </div>
  </div>
</div>

<div class="gdim" id="안내딤"></div>
<div class="gsheet" id="안내시트">
  <div class="gh"><b id="안내제목">확인서류 첨부 안내</b><button type="button" id="안내닫기">×</button></div>
  <div class="gbody" id="안내내용"></div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var 저장 = {};
  try { 저장 = JSON.parse(sessionStorage.getItem('lp_reg') || '{}'); } catch (e) {}

  var 서류 = {
    '월세': ['정식 임대차계약서면 바로 돼요','확정일자 없으면 입금내역 2~3회','분실 시 건축물대장등본이면 돼요'],
    '관리비': ['최근 관리비 고지서 한 장','공과금은 기관 고지서나 납부서','분실 시 관리사무소 확인 내역'],
    '인건비': ['급여는 근로계약서 + 명세서','알바는 근무 확인 내역','용역비는 용역계약서 + 지급 내역'],
    '보증금': ['임대차계약서 촬영본 한 장','상가는 상가 임대차계약서','가계약금은 확인 문자 + 계좌'],
    '매입대금': ['전자세금계산서 한 장','발행 전엔 거래명세서 + 발주서','정기 납품은 계약서 + 거래 내역'],
    '학원비': ['수강증이나 등록 안내문','과외는 계약서나 안내 문자','인강은 수강 신청 내역'],
    '학교공과금': ['등록금 고지서 한 장','기숙사비는 납부 안내문','그 외는 학교 발행 고지서'],
    '인테리어': ['공사 계약서 + 견적서','설치는 견적서나 결제 안내','자재는 구매 내역 + 판매자 계좌'],
    '이사': ['이사업체 견적서 한 장','용달은 예약 내역이나 안내 문자','보관 이사는 보관 계약서'],
    '청소비': ['견적서나 예약 내역','정기 청소는 용역 계약서','특수 청소는 견적서 + 계좌 정보'],
    '중개수수료': ['부동산 계약서','월세 복비는 임대차계약서','영수증 있으면 더 빨라요'],
    '기타': ['계약서나 거래 확인 내역','청구서나 안내문','증빙 + 받는 분 계좌 정보']
  };
  var 유형 = 저장.유형 || '기타';
  document.getElementById('요약유형').textContent = 유형;
  document.getElementById('요약받는분').textContent = 저장.예금주 ? 저장.예금주 + ' · ' + (저장.은행||'') + ' ' + (저장.계좌||'') : '-';
  document.getElementById('요약금액').textContent = 저장.금액 ? Number(저장.금액).toLocaleString('ko-KR') + '원' : '-';
  document.getElementById('요약결제').textContent = (저장.카드 || '-') + (저장.할부 ? ' · ' + 저장.할부 : '');
  document.getElementById('요약시점').textContent = 저장.시점 === '예약' ? ((저장.반복 === '매달' ? '매달 예약 · 첫 송금 ' : '예약 송금 · ') + (저장.예약일 || '')) : '즉시 송금';
  $('서류제목').textContent = 유형 + ' 필요 서류';
  $('서류목록').innerHTML = (서류[유형] || 서류['기타']).map(function (t) {
    return '<div class="dr"><i>✓</i>' + t + '</div>';
  }).join('');

  /* ── 항목별 확인서류 첨부 안내 ── */
  var 안내글 = {"월세": "<h4>1. 계좌 예금주 확인</h4>\n<p>등록한 계좌의 예금주와 임대인이 일치하는 경우에만 진행됩니다.</p>\n<h4>2. 중개사 확인 또는 확정일자가 있는 계약</h4>\n<p>중개사 정보 · 날인이 확인되는 정식 계약서나 확정일자 도장이 찍힌 계약서라면 <b>계약서</b>만 첨부하세요.</p>\n<h4>3. 중개사 확인도 확정일자도 없는 계약</h4>\n<ol><li><span class=\"n\">1</span><span><b>계약서</b></span></li><li><span class=\"n\">2</span><span>일정한 월세 금액으로 입금했던 <b>입금내역 2~3회분</b></span></li></ol>\n<p>두 가지를 함께 첨부해주세요.</p>\n<h4>4. 계약서를 분실한 경우</h4>\n<p>재발급이 어렵다면 아래 두 가지를 함께 첨부해주세요.</p>\n<ol><li><span class=\"n\">1</span><span><b>건축물대장등본</b>: <a href=\"https://www.gov.kr/mw/AA020InfoCappView.do?HighCtgCD=A09005&CappBizCD=15000000098&tp_seq=03\" target=\"_blank\" rel=\"noopener\">무료로 발급받기 (PC에서 가능)</a></span></li><li><span class=\"n\">2</span><span>일정한 월세 금액으로 입금했던 <b>입금내역 2~3회분</b></span></li></ol>\n<div class=\"warn\"><b>유의사항</b><br>계약서에서 소재지 · 보증금 · 월세 · 관리비 · 납입일 · 입금계좌를 확인할 수 있어야 합니다.<br><br>임대차 계약서를 첨부할 때는 임대인 · 임차인의 개인정보를 반드시 가려주세요. 거주지 주소 · 주민번호 · 휴대폰번호가 대상이며 사업자번호는 가리지 않아도 됩니다.<br><br>확인이 어려운 내용이 있거나 날인이 없으면 서류 보완을 요청드립니다. 등본상 명의와 임대인 명의가 다르거나 공인중개사 확인이 없는 직거래 계약은 검토 과정에서 추가 증빙을 요청드릴 수 있습니다.</div>", "보증금": "<h4>1. 계좌 예금주 확인</h4>\n<p>등록한 계좌의 예금주와 임대인이 일치하는 경우에만 진행됩니다.</p>\n<h4>2. 중개사 확인 또는 확정일자가 있는 계약</h4>\n<p>중개사 정보 · 날인이 확인되는 정식 계약서나 확정일자 도장이 찍힌 계약서라면 <b>계약서</b>만 첨부하세요.</p>\n<h4>3. 중개사 확인도 확정일자도 없는 계약</h4>\n<ol><li><span class=\"n\">1</span><span><b>계약서</b></span></li><li><span class=\"n\">2</span><span>일정한 월세 금액으로 입금했던 <b>입금내역 2~3회분</b></span></li></ol>\n<p>두 가지를 함께 첨부해주세요.</p>\n<h4>4. 계약서를 분실한 경우</h4>\n<p>재발급이 어렵다면 아래 두 가지를 함께 첨부해주세요.</p>\n<ol><li><span class=\"n\">1</span><span><b>건축물대장등본</b>: <a href=\"https://www.gov.kr/mw/AA020InfoCappView.do?HighCtgCD=A09005&CappBizCD=15000000098&tp_seq=03\" target=\"_blank\" rel=\"noopener\">무료로 발급받기 (PC에서 가능)</a></span></li><li><span class=\"n\">2</span><span>일정한 월세 금액으로 입금했던 <b>입금내역 2~3회분</b></span></li></ol>\n<div class=\"warn\"><b>유의사항</b><br>계약서에서 소재지 · 보증금 · 월세 · 관리비 · 납입일 · 입금계좌를 확인할 수 있어야 합니다.<br><br>임대차 계약서를 첨부할 때는 임대인 · 임차인의 개인정보를 반드시 가려주세요. 거주지 주소 · 주민번호 · 휴대폰번호가 대상이며 사업자번호는 가리지 않아도 됩니다.<br><br>확인이 어려운 내용이 있거나 날인이 없으면 서류 보완을 요청드립니다. 등본상 명의와 임대인 명의가 다르거나 공인중개사 확인이 없는 직거래 계약은 검토 과정에서 추가 증빙을 요청드릴 수 있습니다.</div>", "관리비": "<p>다음 서류 중 하나를 첨부해주세요.</p>\n<ol><li><span class=\"n\">1</span><span><b>관리비 고지서(청구서)</b></span></li><li><span class=\"n\">2</span><span><b>알림톡 캡쳐본</b></span></li><li><span class=\"n\">3</span><span><b>관리비 영수증</b></span></li><li><span class=\"n\">4</span><span><b>세금계산서</b></span></li></ol>\n<div class=\"warn\">증빙에서 관리비 금액과 납부계좌를 확인할 수 있어야 합니다.<br><br>알림톡은 내용을 자르거나 복사하지 마시고 발신자와 메시지 내용이 모두 보이게 한 화면으로 캡쳐해주세요.</div>", "인테리어": "<p>다음 서류 중 하나를 첨부해주세요.</p>\n<ol><li><span class=\"n\">1</span><span><b>세금계산서</b></span></li><li><span class=\"n\">2</span><span><b>계약서</b></span></li><li><span class=\"n\">3</span><span><b>견적서</b></span></li><li><span class=\"n\">4</span><span><b>거래명세서</b></span></li></ol>\n<div class=\"warn\">증빙에서 금액과 계좌정보, 업체 사업자정보를 반드시 확인할 수 있어야 합니다. 사업자 정보가 확인되지 않으면 추가로 요청드립니다.<br><br>수기로 작성된 약식 증빙만으로는 진행이 어려운 점 양해 부탁드립니다.</div>", "중개수수료": "<p>다음 서류 중 하나를 첨부해주세요.</p>\n<ol><li><span class=\"n\">1</span><span><b>중개보수가 포함된 계약서</b></span></li><li><span class=\"n\">2</span><span><b>중개보수 영수증</b></span></li></ol>\n<div class=\"warn\">증빙에서 금액과 계좌정보를 확인할 수 있어야 합니다.<br><br>첨부한 증빙에 납부계좌 정보가 없으면 계좌정보가 나오는 부동산 명함사진이 추가로 필요합니다. 예금주가 중개사 사업자 계좌로 확인되면 생략할 수 있습니다.</div>", "이사": "<p>다음 서류 중 하나를 첨부해주세요.</p>\n<ol><li><span class=\"n\">1</span><span>이사앱 등의 <b>주문내역 캡처본</b></span></li><li><span class=\"n\">2</span><span><b>이사비 견적서</b></span></li><li><span class=\"n\">3</span><span><b>계약서</b></span></li><li><span class=\"n\">4</span><span><b>문자/카톡 내역</b> (업자 명함 포함 필수)</span></li></ol>\n<div class=\"warn\">증빙에서 금액과 계좌정보를 확인할 수 있어야 합니다.<br><br>100만원 이상 거래는 업체 <b>사업자등록증</b>을 추가로 요청드립니다. 납부계좌가 사업자계좌로 확인되면 생략할 수 있습니다.</div>", "청소비": "<p>다음 서류 중 하나를 첨부해주세요.</p>\n<ol><li><span class=\"n\">1</span><span>청소앱 등의 <b>주문내역 캡처본</b></span></li><li><span class=\"n\">2</span><span><b>청소비 견적서</b></span></li><li><span class=\"n\">3</span><span><b>계약서</b></span></li><li><span class=\"n\">4</span><span><b>문자/카톡 내역</b> (업자 명함 포함 필수)</span></li></ol>\n<div class=\"warn\">증빙에서 금액과 계좌정보를 확인할 수 있어야 합니다.<br><br>50만원 이상 거래는 업체 <b>사업자등록증</b>을 추가로 요청드립니다. 납부계좌가 사업자계좌로 확인되면 생략할 수 있습니다.</div>", "매입대금": "<p>B2B 매입 거래는 1. 매입처 사업자 계좌 2. 매입처 대표 개인계좌 3. 전용 가상계좌로 송금할 때만 진행됩니다. 유형별 첨부서류는 다음과 같습니다.</p>\n<h4>1. 사업자계좌로 송금</h4>\n<p><b>세금계산서</b>, <b>거래명세서</b>, <b>영수증</b>, <b>계약서</b> 중 하나 첨부</p>\n<h4>2. 대표 개인계좌로 송금</h4>\n<p><b>세금계산서</b>, <b>거래명세서</b>, <b>영수증</b>, <b>계약서</b> 중 하나 + 거래처 <b>사업자등록증</b> 사본</p>\n<h4>3. 매입거래 전용 가상계좌로 송금</h4>\n<p>주문내역과 입금계좌가 확인되는 발주용 전산 프로그램 <b>화면 캡처본</b> + 거래처 <b>사업자등록증</b> 사본</p>\n<div class=\"warn\"><b>사업자등록증을 생략할 수 있는 경우</b><br>승인번호가 나온 전자세금계산서, POS식으로 출력된 전자영수증, 명판이 찍히거나 인쇄된 영수증<br><br><b>간이영수증 제출 시</b><br>공급자정보와 계좌정보가 명판으로 찍혀 있거나 인쇄되어 있어야 합니다. 수기로만 작성된 증빙은 진행이 어렵습니다.<br><br><b>이용한도</b><br>계약 승인 시 증빙에서 확인되는 금액으로 이용 한도를 설정해드리며, 이후 같은 거래는 다시 등록하지 않아도 승인한도 내에서 매월 재결제할 수 있습니다. 한도 증액이 필요하면 고객센터로 문의주세요. 거래 규모를 확인할 수 있는 적격증빙(세금계산서 등)으로 한도를 늘려드립니다.</div>", "인건비": "<h4>1. 정규직 급여</h4>\n<ol><li><span class=\"n\">1</span><span><b>근로계약서</b> 날인본</span></li><li><span class=\"n\">2</span><span><b>4대보험 가입자 명부</b> (4대보험 연계센터 출력본)</span></li><li><span class=\"n\">3</span><span><b>급여이체내역</b></span></li></ol>\n<h4>2. 알바비 (일용직 · 단기)</h4>\n<ol><li><span class=\"n\">1</span><span><b>근로계약서</b> 날인본</span></li><li><span class=\"n\">2</span><span><b>일용근로소득 지급명세서</b> (정상자료 상세내역)</span></li></ol>\n<h4>3. 용역비: 비사업자 (프리랜서, 3.3%)</h4>\n<ol><li><span class=\"n\">1</span><span><b>용역계약서</b> 날인본</span></li><li><span class=\"n\">2</span><span><b>간이지급명세서</b> (거주자의 사업소득 · 정상자료 상세내역)</span></li></ol>\n<h4>4. 용역비: 사업자</h4>\n<ol><li><span class=\"n\">1</span><span><b>전자세금계산서</b> (홈택스 발급본)</span></li></ol>\n<div class=\"warn\">반드시 수급자(근로자 · 프리랜서) 본인 명의 계좌로만 송금됩니다.<br><br>계약 유형별 증빙서류를 모두 제출해주세요. 2 · 3번은 직접 신고인지 세무사무소 대행인지에 따라 조회 경로가 다릅니다. <a href=\"https://drive.google.com/file/d/15_9ToBEL2QktS1UCcxQpQMDrZhUn1LRH/view?usp=sharing\" target=\"_blank\" rel=\"noopener\">발급방법 보기</a><br><br>원천징수영수증은 국세청 제출 사실 확인이 어려워 증빙으로 채택되지 않으며, 퇴직금은 진행이 어렵습니다.</div>", "학원비": "<h4>1. 학원비 · 수강료 · 등록금</h4>\n<p>다음 서류 중 하나를 첨부해주세요.</p>\n<ol><li><span class=\"n\">1</span><span><b>고지서</b> (납부통지서 · 청구서)</span></li><li><span class=\"n\">2</span><span><b>알림톡 또는 납부안내 메일 캡처본</b></span></li><li><span class=\"n\">3</span><span><b>온라인 공지문 캡처본</b></span></li><li><span class=\"n\">4</span><span>교육기관에 게시된 <b>수강비 안내문 · 공지사항</b></span></li></ol>\n<h4>2. 과외비 · 레슨비</h4>\n<p>강사 자격증빙과 거래증빙을 함께 첨부해주세요.</p>\n<p class=\"mid\">[1] 강사 자격증빙: 아래 A 또는 B 중 하나</p>\n<ol><li><span class=\"n\">A.</span><span>공식 자격증빙 : 1. <b>개인과외교습자신고필증</b> 2. <b>강사 등록 확인서</b> 중 하나</span></li><li><span class=\"n\">B.</span><span>간접 증빙 : 1. <b>학생증</b> 2. <b>자격증</b> 3. 각종 플랫폼 <b>강사 프로필 화면 캡처본</b> 중 하나</span></li></ol>\n<p class=\"mid\">[2] 거래증빙</p>\n<ol><li><span class=\"n\">1</span><span><b>과외 계약서</b> 2. <b>영수증</b> 3. 전문 사이트 <b>주문서 캡쳐본</b> 4. <b>문자나 카톡 대화 내역 캡쳐본</b> 중 하나</span></li></ol>\n<div class=\"warn\">증빙에서 계좌와 금액을 확인할 수 있어야 합니다.<br><br>문자 · 카톡 증빙은 수업일정 · 납부계좌 · 납부금액이 확인되어야 하며, 특정 문자만 자르거나 당일 소통 하나만 보이는 화면은 진행이 어렵습니다. 이전 내역이 어느 정도 확인되는 수준으로 부탁드립니다.</div>", "학교공과금": "<h4>1. 학원비 · 수강료 · 등록금</h4>\n<p>다음 서류 중 하나를 첨부해주세요.</p>\n<ol><li><span class=\"n\">1</span><span><b>고지서</b> (납부통지서 · 청구서)</span></li><li><span class=\"n\">2</span><span><b>알림톡 또는 납부안내 메일 캡처본</b></span></li><li><span class=\"n\">3</span><span><b>온라인 공지문 캡처본</b></span></li><li><span class=\"n\">4</span><span>교육기관에 게시된 <b>수강비 안내문 · 공지사항</b></span></li></ol>\n<h4>2. 과외비 · 레슨비</h4>\n<p>강사 자격증빙과 거래증빙을 함께 첨부해주세요.</p>\n<p class=\"mid\">[1] 강사 자격증빙: 아래 A 또는 B 중 하나</p>\n<ol><li><span class=\"n\">A.</span><span>공식 자격증빙 : 1. <b>개인과외교습자신고필증</b> 2. <b>강사 등록 확인서</b> 중 하나</span></li><li><span class=\"n\">B.</span><span>간접 증빙 : 1. <b>학생증</b> 2. <b>자격증</b> 3. 각종 플랫폼 <b>강사 프로필 화면 캡처본</b> 중 하나</span></li></ol>\n<p class=\"mid\">[2] 거래증빙</p>\n<ol><li><span class=\"n\">1</span><span><b>과외 계약서</b> 2. <b>영수증</b> 3. 전문 사이트 <b>주문서 캡쳐본</b> 4. <b>문자나 카톡 대화 내역 캡쳐본</b> 중 하나</span></li></ol>\n<div class=\"warn\">증빙에서 계좌와 금액을 확인할 수 있어야 합니다.<br><br>문자 · 카톡 증빙은 수업일정 · 납부계좌 · 납부금액이 확인되어야 하며, 특정 문자만 자르거나 당일 소통 하나만 보이는 화면은 진행이 어렵습니다. 이전 내역이 어느 정도 확인되는 수준으로 부탁드립니다.</div>", "기타": "<p>서비스 불가 거래를 제외한 모든 상거래 결제에 이용할 수 있습니다.</p>\n<p>다음 서류 중 하나를 첨부해주세요.</p>\n<ol><li><span class=\"n\">1</span><span><b>계약서</b> 또는 <b>거래 확인 내역</b></span></li><li><span class=\"n\">2</span><span><b>청구서 · 안내문</b></span></li><li><span class=\"n\">3</span><span><b>영수증 · 결제 안내 캡처본</b></span></li></ol>\n<p>증빙과 함께 <b>받는 분 계좌 정보</b>가 확인되어야 합니다.</p>\n<div class=\"warn\">증빙에서 상품명 · 거래금액 · 납부계좌를 확인할 수 있어야 합니다.<br><br>개인 간 거래에서 수기로 작성된 약식 증빙은 진행이 어려운 점 양해 부탁드립니다.<br><br>진행에 어려움이 있으면 언제든 고객센터로 문의주세요.</div>"};

  $('완료').addEventListener('click', function () {

<script>/* 피그마 가져오기용(앱): ?drawer=open 서랍 열림 · ?sheet=1 첫 번째 시트 열림 · 그 외엔 서랍·시트 요소 제거 */
 /* 색 반전 필터로 흰색을 만든 로고는 진짜 흰 로고 그림으로 교체 (필터는 피그마로 안 옮겨짐) */
 document.querySelectorAll('img').forEach(function(im){var f=getComputedStyle(im).filter||''; if(f.indexOf('invert')<0) return;
   var src=im.getAttribute('src')||''; if(src.indexOf('logo-text')>=0) im.src=src.replace(/logo-text[^/]*\.png/,'logo-text-white.png');
   else if(src.indexOf('logo3.png')>=0) im.src=src.replace('logo3.png','logo3-white.png');
   else if(/item3d\/(\d+)\.png/.test(src)) im.src=src.replace(/item3d\/(\d+)\.png/,'item3d/w$1.png');
   im.style.setProperty('filter','none','important');});
(function(){var q=new URLSearchParams(location.search);
 if(q.get('drawer')==='open'){document.documentElement.classList.add('figma-drawer'); if(typeof drawer==='function') drawer(true);}
 else{['drawer','dim'].forEach(function(id){var e=document.getElementById(id); if(e) e.remove();});}
 if(q.get('open')==='all'){document.querySelectorAll('details').forEach(function(d){d.open=true;});}
 var doList=q.get('do');
 if(q.get('sheet')==='1'){document.documentElement.classList.add('figma-sheet'); var b=document.getElementById('ap-doclink')||document.querySelector('.pickbtn'); if(b) b.click();}
 else if(doList){document.documentElement.classList.add('figma-sheet');
   doList.split(';').forEach(function(step){var i=step.indexOf(':'), kind=step.slice(0,i), arg=step.slice(i+1), el=null;
     if(kind==='click') el=document.querySelector(arg);
     else if(kind==='clickn'){var pp=arg.split('|'); el=document.querySelectorAll(pp[0])[+pp[1]||0];}
     else if(kind==='text'){el=Array.prototype.find.call(document.querySelectorAll('button,a,div,span,label,li'), function(e){return e.children.length<3 && e.textContent.trim()===arg;});}
     if(el){el.click();}});}
 /* 열려 있지 않은 시트·서랍·어둠막은 전부 지운다 (화면 밖 아래에 숨어 있다가 긴 프레임에 찍히던 문제) */
 var OVL='.docdim,.docsheet,.ask-layer,.pkdim,.pksheet,.ddim,.dsheet,.gdim,.gsheet,.drawer,.dim';
 function isOn(e){ var cs=getComputedStyle(e); if(cs.display==='none'||cs.visibility==='hidden'||cs.opacity==='0') return false;
   var r=e.getBoundingClientRect(); return r.height>0 && r.top<innerHeight-1 && r.bottom>1; }   /* 지금 화면 안에 실제로 보이는 것만 */
 document.querySelectorAll(OVL).forEach(function(e){ if(!isOn(e)) e.remove(); });
 /* ?only=1 → 열린 시트(또는 서랍)만 남기고 페이지는 전부 숨겨, 시트 하나가 곧 프레임이 되게 */
 if(q.get('only')==='1'){
   var panels=Array.prototype.filter.call(document.querySelectorAll(OVL), function(e){ return isOn(e) && !/dim|ask-layer/.test(e.className); });
   /* 여러 개가 겹쳐 열려 있으면 맨 위(z-index 큰 것)를, 같으면 큰 것을 고른다 */
   panels.sort(function(a,b){ var za=+getComputedStyle(a).zIndex||0, zb=+getComputedStyle(b).zIndex||0; return (zb-za) || (b.getBoundingClientRect().height - a.getBoundingClientRect().height); });
   var panel=panels[0];
   if(panel){
     document.querySelectorAll('.docdim,.pkdim,.ddim,.gdim,.dim').forEach(function(e){e.remove();});
     var node=panel; while(node && node!==document.body){ var par=node.parentElement;
       Array.prototype.forEach.call(par.children, function(c){ if(c!==node) c.style.setProperty('display','none','important'); }); node=par; }
     ['position','transform','left','right','top','bottom','margin','max-height','height'].forEach(function(k){ panel.style.setProperty(k, k==='position'?'static':(k==='transform'?'none':(k==='margin'?'0':'auto')),'important'); });
     panel.style.setProperty('width','360px','important'); panel.style.setProperty('max-width','none','important');
     document.documentElement.classList.add('figma-only');
   }
 }
 /* 롤링 배너: 자동 넘김을 멈추고 1번 장에 고정 · ?slides=all 이면 7장(중복 제거) 전부 세로로 */
 for(var t=1;t<50000;t++){clearInterval(t);}
 var band=document.querySelector('.uspband'), tk=document.getElementById('usptrack');
 if(band&&tk){var ups=Array.prototype.slice.call(tk.querySelectorAll('.aup')), seen={}, uniq=[];
   ups.forEach(function(u){var im=u.querySelector('img'); var k=im?im.getAttribute('src'):u.textContent.trim(); if(!seen[k]){seen[k]=1; uniq.push(u);}});
   if(q.get('slides')==='row'){document.documentElement.classList.add('figma-row'); ups.forEach(function(u){if(uniq.indexOf(u)<0) u.remove();});
     /* 배너는 제자리에 두고(스타일이 조상에 묶여 있음) 조상 사슬의 형제들만 숨긴다 */
     var node=band; while(node && node!==document.body){ var par=node.parentElement;
       Array.prototype.forEach.call(par.children, function(c){ if(c!==node) c.style.setProperty('display','none','important'); }); node=par; }
     tk.style.setProperty('transform','none','important');}
   else if(q.get('slides')==='all'){document.documentElement.classList.add('figma-slides'); ups.forEach(function(u){if(uniq.indexOf(u)<0) u.remove();}); tk.style.setProperty('transform','none','important');}
   else if(q.get('slides')==='strip'){ /* 7장을 왼쪽부터 가로로 쭉 (프레임 밖으로 이어짐) */
     document.documentElement.classList.add('figma-strip'); ups.forEach(function(u){if(uniq.indexOf(u)<0) u.remove();});
     tk.style.transition='none'; tk.style.setProperty('transform','none','important');}
   else{ /* 기본: 1번 장에 고정 */
     var f=uniq[0]; tk.style.transition='none'; tk.style.transform='translateX('+(band.clientWidth/2-(f.offsetLeft+f.offsetWidth/2))+'px)';}
 }
 /* 안쪽에서 스크롤되는 상자를 전부 펼친다 */
 document.querySelectorAll('*').forEach(function(el){var cs=getComputedStyle(el);
   if(/(auto|scroll)/.test(cs.overflowY) && el.scrollHeight>el.clientHeight+4){el.style.setProperty('overflow','visible','important'); el.style.setProperty('height','auto','important'); el.style.setProperty('max-height','none','important');}});
 /* 그림 크기 고정: 그려진 크기를 px 로 못 박아 피그마에서 찌그러지지 않게 (지연 로딩도 즉시) */
 document.querySelectorAll('img').forEach(function(im){im.loading='eager';});
 setTimeout(function(){document.querySelectorAll('img').forEach(function(im){var r=im.getBoundingClientRect(); if(r.width>0&&r.height>0){im.style.setProperty('width',r.width+'px','important'); im.style.setProperty('height',r.height+'px','important'); im.style.setProperty('max-width','none','important'); im.style.setProperty('max-height','none','important');}});},250);
})();
/* 글줄: 크롬이 실제로 줄을 끊은 자리에 <br> 을 넣는다 (피그마는 한글을 글자 단위로 끊어 '누르세/요'가 됨) */
function figmaPrebreak(){
  var sel='p,li,h1,h2,h3,h4,dd,dt,summary,label,.head-sub,.tx,.tt,.lm,small,b,em,strong,.cd,.cn,.sub';
  document.querySelectorAll(sel).forEach(function(bl){
    if(bl.closest('svg,iconify-icon,script,style,textarea,input')) return;
    var cs=getComputedStyle(bl); if(cs.display==='none'||cs.whiteSpace==='nowrap'||cs.whiteSpace==='pre') return;
    var lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.5; if(bl.getBoundingClientRect().height<lh*1.6) return;
    var w=document.createTreeWalker(bl,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(function(tn){ var t=tn.nodeValue; if(!t||!t.trim()) return; if(tn.parentNode.closest('svg,iconify-icon')) return;
      var r=document.createRange(), lastTop=null, breaks=[];
      for(var i=0;i<t.length;i++){ if(/\s/.test(t[i])) continue; r.setStart(tn,i); r.setEnd(tn,i+1); var rc=r.getClientRects()[0]; if(!rc||!rc.height) continue;
        if(lastTop!==null && rc.top-lastTop>rc.height*0.5) breaks.push(i); lastTop=rc.top; }
      if(!breaks.length) return;
      var pos=0, frag=document.createDocumentFragment();
      breaks.forEach(function(bi){ frag.appendChild(document.createTextNode(t.slice(pos,bi).replace(/\s+$/,''))); frag.appendChild(document.createElement('br')); pos=bi; });
      frag.appendChild(document.createTextNode(t.slice(pos).replace(/^\s+/,''))); tn.parentNode.replaceChild(frag,tn); });
  });
}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){setTimeout(figmaPrebreak,120);});} else {setTimeout(figmaPrebreak,400);}
