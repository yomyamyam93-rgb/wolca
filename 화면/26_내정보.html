<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>랜선페이 — 내 정보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --primary:#2563EB; --primary-dark:#1D4ED8; --primary-50:#EFF4FF; --primary-100:#DBE7FF;
    --page-bg:#c9cdd4; --bg:#F4F5F6; --card:#FFFFFF; --line:#ECEEF1; --border:#B1B8BE;
    --tile:#EEF1F4; --icon-off:#B0B8C1;
    --sub:#4E5968; --ink:#191F28; --placeholder:#8B95A1;
    --success:#059669; --success-bg:#EAF7F0;
    --primary-grad:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #ffffff), var(--primary));
    --btn-shadow:0 4px 12px color-mix(in srgb, var(--primary) 32%, transparent), inset 0 1px 0 rgba(255,255,255,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  /* 한글은 단어 단위로만 줄바꿈 (한 글자만 떨어지는 것 방지) */
  body{word-break:keep-all; overflow-wrap:break-word;}
  body{font-family:'Pretendard',-apple-system,sans-serif; color:var(--ink); background:var(--page-bg);
       display:flex; justify-content:center; align-items:flex-start; padding:24px 0; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .phone{width:390px; height:844px; max-width:100%; background:var(--bg); position:relative; display:flex; flex-direction:column;
         border-radius:46px; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.28);}
  iconify-icon{display:inline-block;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 30px; background:var(--bg); flex:0 0 auto;}
  .statusbar .time{font-size:15px; font-weight:700;}
  .statusbar .stat{display:flex; align-items:center; gap:7px;}
  .topbar{height:54px; display:flex; align-items:center; padding:0 10px; background:var(--bg); flex:0 0 auto;}
  .topbar .back{width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink); cursor:pointer;}
  .topbar .ttl{flex:1; text-align:center; font-size:17px; font-weight:700; margin-right:44px;}

  .body{flex:1; overflow-y:auto; padding:6px 20px 110px; scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}

  .sec-t{font-size:14px; font-weight:700; color:var(--sub); margin:24px 4px 10px;}
  .box{background:var(--card); border-radius:18px; padding:4px 16px; box-shadow:0 1px 3px rgba(0,0,0,.04);}

  .field{padding:15px 0;}
  .field+.field{border-top:1px solid var(--line);}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--placeholder); margin-bottom:8px;}
  .tin{width:100%; height:48px; border:1.5px solid var(--line); border-radius:12px; padding:0 14px; font-family:inherit;
    font-size:15px; font-weight:600; color:var(--ink); background:#fff; transition:border-color .2s, box-shadow .2s;}
  .tin:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(37,99,235,.1);}
  .tin:disabled{background:var(--tile); color:var(--sub); border-color:transparent;}
  .inrow{display:flex; gap:8px;}
  .inrow .tin{flex:1;}
  .inbtn{flex:0 0 auto; height:48px; padding:0 14px; border:none; border-radius:12px; background:var(--primary-50);
    color:var(--primary-dark); font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;}
  .hint{font-size:12px; color:var(--placeholder); margin-top:7px; line-height:1.5;}
  .ok{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:800; color:var(--success);
    background:var(--success-bg); padding:4px 8px; border-radius:7px; margin-left:6px;}
  .ok iconify-icon{font-size:13px;}

  .row{display:flex; align-items:center; gap:12px; padding:15px 0; cursor:pointer;}
  .row+.row{border-top:1px solid var(--line);}
  .row .t{flex:1; font-size:14.5px; font-weight:600;}
  .row .v{font-size:13.5px; font-weight:700; color:var(--placeholder);}
  .row .gv{color:var(--icon-off); font-size:18px;}

  .footer{position:absolute; bottom:0; left:0; right:0; padding:14px 20px 28px; background:#fff; border-top:1px solid var(--line);}
  .save{width:100%; height:54px; border:none; border-radius:15px; background:var(--primary-grad); box-shadow:var(--btn-shadow);
    color:#fff; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span><span class="stat">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1" fill="#191F28"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#191F28"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#191F28"/><rect x="15" width="3" height="12" rx="1" fill="#191F28"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2C11 2 13.3 3 15 4.7l-1.3 1.4C12.3 4.7 10.5 4 8.5 4S4.7 4.7 3.3 6.1L2 4.7C3.7 3 6 2 8.5 2z" fill="#191F28"/><circle cx="8.5" cy="10" r="1.3" fill="#191F28"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#191F28" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#191F28"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#191F28" fill-opacity=".35"/></svg>
  </span></div>

  <div class="topbar"><div class="back" onclick="goBack()">‹</div><div class="ttl">내 정보</div></div>

  <div class="body">

    <div class="sec-t">기본 정보</div>
    <div class="box">
      <div class="field">
        <label>이름 <span class="ok"><iconify-icon icon="mingcute:check-fill"></iconify-icon>본인인증 완료</span></label>
        <input class="tin" value="김랜선" disabled>
        <div class="hint">본인인증으로 확인된 이름이라 직접 바꿀 수 없어요.</div>
      </div>
      <div class="field">
        <label>휴대폰 번호</label>
        <div class="inrow">
          <input class="tin" inputmode="numeric" value="010-1234-5678">
          <button class="inbtn" onclick="toast('인증번호를 보냈어요 (준비 중)')">재인증</button>
        </div>
        <div class="hint">번호를 바꾸면 본인인증을 다시 해야 해요.</div>
      </div>
      <div class="field">
        <label>이메일</label>
        <input class="tin" type="email" placeholder="영수증 · 안내를 받을 이메일">
      </div>
    </div>

    <div class="sec-t" id="bizT" style="display:none">사업자 정보</div>
    <div class="box" id="bizBox" style="display:none">
      <div class="field">
        <label>상호 <span class="ok"><iconify-icon icon="mingcute:check-fill"></iconify-icon>확인 완료</span></label>
        <input class="tin" value="미라클상사" disabled>
      </div>
      <div class="field">
        <label>사업자등록번호</label>
        <input class="tin" value="437-88-03148" disabled>
      </div>
      <div class="field">
        <label>세금계산서 받을 이메일</label>
        <input class="tin" type="email" placeholder="tax@example.com">
      </div>
    </div>

    <div class="sec-t">계정 · 보안</div>
    <div class="box">
      <div class="row" onclick="toast('비밀번호 변경은 준비 중이에요')">
        <span class="t">간편 비밀번호 변경</span><iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon>
      </div>
      <div class="row" onclick="location.href='25_카드관리.html'">
        <span class="t">등록한 카드</span><span class="v">2장</span>
      </div>
      <div class="row" onclick="toast('연결 계정은 준비 중이에요')">
        <span class="t">연결된 간편로그인</span><span class="v">카카오</span>
      </div>
      <div class="row" onclick="toast('가입일 · 등급 안내는 준비 중이에요')">
        <span class="t">가입일</span><span class="v">2026.03.14</span>
      </div>
    </div>

  </div>

  <div class="footer">
    <button class="save" onclick="toast('저장했어요 (준비 중)')">저장하기</button>
  </div>
</div>
<script src="app.js"></script>
<script>
(function(){
  var biz = (function(){try{if(sessionStorage.getItem('lp_type')==='biz')return true;}catch(e){} return new URLSearchParams(location.search).get('type')==='biz';})();
  document.getElementById('bizT').style.display = biz ? 'block' : 'none';
  document.getElementById('bizBox').style.display = biz ? 'block' : 'none';
})();
function goBack(){ lpBack('21_더보기.html'); }
function toast(msg){
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = "position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:#191F28;color:#fff;padding:12px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:30;opacity:0;transition:.2s;white-space:nowrap";
  document.querySelector('.phone').appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity = '1'; });
  setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 200); }, 1600);
}
</script>
</body>
</html>
