<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>랜선페이 — 결제하기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css?v=26">
<link rel="icon" type="image/png" href="img/logo3.png">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script src="app.js?v=15"></script>
<style>
  .pay{max-width:640px; margin:0 auto;}
  @media(min-width:1024px){ .pay{max-width:720px;} }

  /* 항목 고르기 — 사장님페이처럼 격자로 */
  .cats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .cat{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 6px 12px; text-align:center; transition:border-color .15s, background .15s;}
  .cat iconify-icon{font-size:26px; color:var(--primary);}
  .cat span{display:block; margin-top:8px; font-size:13px; font-weight:700; line-height:1.3;}
  .cat.on{border:2px solid var(--primary); background:var(--primary-50); padding:13px 5px 11px;}
  @media(min-width:640px){ .cats{grid-template-columns:repeat(6,1fr); gap:10px;} }

  /* 금액 — 이 화면에서 제일 큰 글자 */
  .amt{position:relative;}
  .amt input{height:72px; font-size:32px; font-weight:700; letter-spacing:-1px; padding-right:48px;}
  .amt .won{position:absolute; right:18px; top:0; height:72px; display:flex; align-items:center;
    font-size:20px; font-weight:700; color:var(--sub);}
  .quick{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .quick button{height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); font-size:13px; font-weight:700; color:var(--sub);}
  .quick button:hover{border-color:var(--primary); color:var(--primary-600);}

  /* 예상 혜택 — 이 화면의 강조 (파란 박스) */
  .benefit{margin-top:28px; border-radius:14px; padding:24px;
    background:var(--primary-50); border:1px solid var(--primary-100);}
  .benefit .ttl{display:flex; align-items:center; gap:6px; font-size:15px; font-weight:700; color:var(--primary-600);}
  .benefit .big{margin-top:12px; font-size:44px; font-weight:700; letter-spacing:-1.6px; line-height:1.1; color:var(--primary);}
  @media(min-width:768px){ .benefit .big{font-size:54px; letter-spacing:-2px;} }
  .benefit .brk{margin-top:14px; padding-top:14px; border-top:1px solid var(--primary-100);}
  .benefit .brow{display:flex; justify-content:space-between; font-size:14px; padding:5px 0; color:var(--sub);}
  .benefit .brow b{color:var(--ink); font-weight:700;}
  .benefit .more{border-top-color:var(--primary-100);}
  .benefit .note{margin-top:10px; font-size:12px; color:var(--sub);}

  .guide{margin-top:24px;}
  .guide .row{cursor:pointer;}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <a class="back" href="index.html" aria-label="뒤로"><iconify-icon icon="mingcute:left-line"></iconify-icon></a>
    <span class="ttl">결제하기</span>
    <div class="acts">
      <a class="act" href="guide.html" aria-label="이용안내"><iconify-icon icon="mingcute:question-fill"></iconify-icon></a>
    </div>
  </div>
</header>

<main class="main hascta">
  <section class="sec tight">
    <div class="wrap pay">

      <h2 class="h-sec">무엇을 <span class="hl">보내시나요?</span></h2>
      <div class="cats" style="margin-top:12px" id="cats">
        <button class="cat on" data-n="월세"><iconify-icon icon="mingcute:home-4-fill"></iconify-icon><span>월세</span></button>
        <button class="cat" data-n="관리비"><iconify-icon icon="mingcute:building-2-fill"></iconify-icon><span>관리비</span></button>
        <button class="cat" data-n="인건비"><iconify-icon icon="mingcute:group-3-fill"></iconify-icon><span>인건비</span></button>
        <button class="cat" data-n="보증금"><iconify-icon icon="mingcute:key-2-fill"></iconify-icon><span>보증금</span></button>
        <button class="cat" data-n="매입대금"><iconify-icon icon="mingcute:store-fill"></iconify-icon><span>매입대금</span></button>
        <button class="cat" data-n="학원비"><iconify-icon icon="mingcute:mortarboard-fill"></iconify-icon><span>학원비</span></button>
        <button class="cat" data-n="학교공과금"><iconify-icon icon="mingcute:school-fill"></iconify-icon><span>학교공과금</span></button>
        <button class="cat" data-n="인테리어"><iconify-icon icon="mingcute:brush-fill"></iconify-icon><span>인테리어</span></button>
        <button class="cat" data-n="이사"><iconify-icon icon="mingcute:truck-fill"></iconify-icon><span>이사</span></button>
        <button class="cat" data-n="청소비"><iconify-icon icon="mingcute:broom-fill"></iconify-icon><span>청소비</span></button>
        <button class="cat" data-n="중개수수료"><iconify-icon icon="mingcute:certificate-fill"></iconify-icon><span>중개수수료</span></button>
        <button class="cat" data-n="기타"><iconify-icon icon="mingcute:grid-fill"></iconify-icon><span>기타</span></button>
      </div>

      <div class="field" style="margin-top:28px">
        <label for="money">보낼 금액</label>
        <div class="amt">
          <input class="input" id="money" type="text" inputmode="numeric" value="700,000" aria-label="보낼 금액">
          <span class="won">원</span>
        </div>
        <div class="quick">
          <button type="button" data-add="100000">+10만</button>
          <button type="button" data-add="500000">+50만</button>
          <button type="button" data-add="1000000">+100만</button>
          <button type="button" data-clear="1">지우기</button>
        </div>
      </div>

      <!-- 이 화면의 강조 : 얼마나 이득인가 -->
      <div class="benefit">
        <div class="ttl"><iconify-icon icon="mingcute:gift-fill"></iconify-icon>이번 송금으로 받는 혜택</div>
        <div class="big" id="총혜택">183,000원</div>
        <details class="more">
          <summary>계산 내역 보기<iconify-icon icon="mingcute:down-line"></iconify-icon></summary>
          <div class="more-b">
            <div class="brow"><span>카드 포인트 적립 (0.5%)</span><b id="포인트">3,500원</b></div>
            <div class="brow"><span>월세 세액공제 (연 17%)</span><b id="공제">119,000원</b></div>
            <div class="brow"><span>결제 수수료</span><b id="수수료" style="color:var(--danger)">-26,600원</b></div>
            <p class="note">실제 금액은 카드사·소득 구간에 따라 달라질 수 있어요.</p>
          </div>
        </details>
      </div>

      <div class="guide">
        <h2 class="h-card" style="margin-bottom:4px">보내기 전에 확인하세요</h2>
        <a class="row" href="guide.html#서류">
          
          <span class="tx"><b>필요 서류 확인</b><span>월세는 계약서 한 장이면 돼요</span></span>
          <iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon>
        </a>
        <a class="row" href="guide.html">
          
          <span class="tx"><b>이용 방법 4단계</b><span>신청 3분 · 입금 평균 5분</span></span>
          <iconify-icon class="gv" icon="mingcute:right-line"></iconify-icon>
        </a>
      </div>

    </div>
  </section>
</main>

<div class="cta">
  <div class="cta-in">
    <a class="btn btn-primary" href="#"><img class="btn-logo" src="img/logo3-white.png" alt=""><span id="ctaLabel">700,000원 송금 신청하기</span></a>
  </div>
</div>



<script>
/* 홈에서 누르고 온 항목을 그대로 골라 둔다 (pay.html?c=월세) */
(function () {
  var c = new URLSearchParams(location.search).get('c');
  if (!c) return;
  var b = [...document.querySelectorAll('.cat')].find(function (x) { return x.dataset.n === c; });
  if (!b) return;
  document.querySelectorAll('.cat').forEach(function (x) { x.classList.toggle('on', x === b); });
})();

/* 항목 고르기 */
document.getElementById('cats').addEventListener('click', function (e) {
  var b = e.target.closest('.cat'); if (!b) return;
  this.querySelectorAll('.cat').forEach(function (c) { c.classList.toggle('on', c === b); });
  계산();
});

/* 금액 입력 — 숫자만, 세 자리마다 쉼표 */
var 돈 = document.getElementById('money');
function 값() { return Number((돈.value || '').replace(/[^0-9]/g, '')) || 0; }
function 넣기(n) { 돈.value = n ? n.toLocaleString('ko-KR') : ''; }
돈.addEventListener('input', function () { var n = 값(); 넣기(n); 계산(); });
document.querySelector('.quick').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.clear) 넣기(0); else 넣기(값() + Number(b.dataset.add));
  계산();
});

/* 혜택 미리보기 — 이 화면에서 제일 보여주고 싶은 것 */
function 계산() {
  var n = 값();
  var 항목 = document.querySelector('.cat.on');
  var 월세인가 = 항목 && 항목.dataset.n === '월세';
  var 포인트 = Math.round(n * 0.005);
  var 공제   = 월세인가 ? Math.round(n * 12 * 0.17 / 12) * 1 : 0;   /* 한 달분 기준 환산 */
  var 수수료 = Math.round(n * 0.038);
  document.getElementById('포인트').textContent = 포인트.toLocaleString('ko-KR') + '원';
  document.getElementById('공제').textContent   = 월세인가 ? 공제.toLocaleString('ko-KR') + '원' : '해당 없음';
  document.getElementById('수수료').textContent = '-' + 수수료.toLocaleString('ko-KR') + '원';
  document.getElementById('총혜택').textContent = Math.max(0, 포인트 + 공제).toLocaleString('ko-KR') + '원';
  document.getElementById('ctaLabel').textContent =
    n ? n.toLocaleString('ko-KR') + '원 송금 신청하기' : '금액을 입력해주세요';
}
계산();
</script>
</body>
</html>
