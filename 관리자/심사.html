<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜선페이 관리자 — 심사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  :root{
    --primary:#2563EB; --primary-dark:#1D4ED8; --primary-50:#EFF4FF; --primary-100:#DBE7FF;
    --bg:#F4F6F9; --card:#FFFFFF; --line:#E7EBF0; --border:#CBD3DD;
    --ink:#191F28; --sub:#4E5968; --placeholder:#8B95A1; --icon-off:#B0B8C1;
    --ok:#059669; --ok-bg:#EAF7F0; --warn:#B45309; --warn-bg:#FFF7ED; --danger:#DC2626; --danger-bg:#FEECEC;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:'Pretendard',-apple-system,sans-serif; background:var(--bg); color:var(--ink);
    line-height:1.5; word-break:keep-all; -webkit-font-smoothing:antialiased;}
  iconify-icon{display:inline-block;}

  /* 상단 */
  .top{height:60px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center;
    padding:0 22px; gap:14px; position:sticky; top:0; z-index:20;}
  .top .lg{display:flex; align-items:center; gap:9px; font-size:17px; font-weight:800; letter-spacing:-.3px;}
  .top .lg img{height:26px;}
  .top .tag{font-size:11.5px; font-weight:800; color:var(--primary-dark); background:var(--primary-50); padding:4px 9px; border-radius:7px;}
  .top .me{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--sub);}
  .top .me b{color:var(--ink);}
  .top .out{height:34px; padding:0 13px; border:1px solid var(--line); border-radius:9px; background:#fff;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer;}

  .layout{display:flex; min-height:calc(100vh - 60px);}

  /* 왼쪽 메뉴 */
  .side{width:196px; flex:0 0 auto; background:#fff; border-right:1px solid var(--line); padding:16px 12px;}
  .side .grp{font-size:11px; font-weight:800; color:var(--placeholder); padding:14px 10px 7px; letter-spacing:.3px;}
  .side a{display:flex; align-items:center; gap:10px; padding:11px 10px; border-radius:10px;
    font-size:14px; font-weight:600; color:var(--sub); text-decoration:none; cursor:pointer;}
  .side a:hover{background:var(--bg);}
  .side a.on{background:var(--primary-50); color:var(--primary-dark); font-weight:800;}
  .side a iconify-icon{font-size:18px;}
  .side a .n{margin-left:auto; font-size:11.5px; font-weight:800; color:#fff; background:var(--danger);
    min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 5px;}

  .main{flex:1; min-width:0; padding:20px 22px 40px;}
  h1{font-size:21px; font-weight:800; letter-spacing:-.4px;}
  .h-sub{font-size:13.5px; color:var(--placeholder); margin-top:5px;}

  /* 지표 */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:11px; margin:18px 0 20px;}
  .kpi{background:#fff; border-radius:14px; padding:15px 17px; border:1px solid var(--line);}
  .kpi .l{font-size:12.5px; color:var(--placeholder);}
  .kpi .v{font-size:23px; font-weight:800; letter-spacing:-.5px; margin-top:5px;}
  .kpi.warn .v{color:var(--danger);}
  .kpi.good .v{color:var(--ok);}

  /* 본문 2단 */
  .cols{display:flex; gap:16px; align-items:flex-start;}
  .list{flex:0 0 340px; background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden;}
  .list .lh{display:flex; align-items:center; gap:8px; padding:13px 15px; border-bottom:1px solid var(--line);}
  .list .lh .t{font-size:14px; font-weight:800;}
  .list .lh .cnt{font-size:12px; font-weight:800; color:var(--primary-dark); background:var(--primary-50); padding:3px 8px; border-radius:7px;}
  .list .lh .sortbtn{margin-left:auto; font-size:12px; color:var(--placeholder); background:none; border:none; font-family:inherit; cursor:pointer;}
  .items{max-height:560px; overflow-y:auto;}
  .it{padding:13px 15px; border-bottom:1px solid var(--line); cursor:pointer; transition:.12s;}
  .it:hover{background:#FAFCFF;}
  .it.on{background:var(--primary-50); box-shadow:inset 3px 0 0 var(--primary);}
  .it .r1{display:flex; align-items:center; gap:7px;}
  .it .ty{font-size:13.5px; font-weight:800;}
  .it .amt{margin-left:auto; font-size:13.5px; font-weight:800;}
  .it .r2{display:flex; align-items:center; gap:7px; margin-top:5px; font-size:12px; color:var(--placeholder);}
  .badge{font-size:10.5px; font-weight:800; padding:3px 7px; border-radius:6px;}
  .badge.sla{background:var(--danger-bg); color:var(--danger);}
  .badge.lock{background:#EEF1F4; color:var(--sub);}
  .badge.two{background:var(--warn-bg); color:var(--warn);}
  .badge.mine{background:var(--ok-bg); color:var(--ok);}

  /* 상세 */
  .detail{flex:1; min-width:0; background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 22px;}
  .dtop{display:flex; align-items:flex-start; gap:12px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .dtop .tt{font-size:19px; font-weight:800; letter-spacing:-.4px;}
  .dtop .ss{font-size:13px; color:var(--placeholder); margin-top:5px;}
  .dtop .st{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}

  .dgrid{display:flex; gap:18px; margin-top:18px; align-items:flex-start; flex-wrap:wrap;}
  .docbox{flex:1 1 320px; min-width:0;}
  .docview{height:330px; border:1px solid var(--line); border-radius:12px; background:#F7F9FC;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--icon-off);}
  .docview iconify-icon{font-size:44px;}
  .docview .dn{font-size:13px; font-weight:700; color:var(--sub);}
  .doctools{display:flex; gap:7px; margin-top:9px;}
  .doctools button{height:34px; padding:0 12px; border:1px solid var(--line); border-radius:9px; background:#fff;
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--sub); cursor:pointer;}
  .doctools button:hover{border-color:var(--primary-100); color:var(--primary-dark);}

  .info{flex:1 1 300px; min-width:0;}
  .irow{display:flex; justify-content:space-between; gap:12px; padding:10px 0; font-size:13.5px; border-bottom:1px solid var(--line);}
  .irow .l{color:var(--placeholder); flex:0 0 auto;}
  .irow .v{font-weight:700; text-align:right; word-break:break-all;}
  .check{display:flex; align-items:center; gap:8px; margin-top:14px; padding:12px 14px; border-radius:11px;
    background:var(--ok-bg); font-size:13px; font-weight:700; color:var(--ok);}
  .check.bad{background:var(--danger-bg); color:var(--danger);}
  .check iconify-icon{font-size:18px;}

  /* 액션 */
  .acts{display:flex; gap:9px; margin-top:20px; padding-top:18px; border-top:1px solid var(--line);}
  .acts button{height:48px; border-radius:12px; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer; border:none;}
  .acts .claim{flex:1; background:var(--primary); color:#fff;}
  .acts .ok{flex:1; background:var(--ok); color:#fff;}
  .acts .no{flex:0 0 130px; background:#fff; border:1.5px solid var(--border); color:var(--danger);}
  .acts .hold{flex:0 0 120px; background:#fff; border:1.5px solid var(--border); color:var(--sub);}
  .acts button:disabled{background:#EEF1F4; color:var(--placeholder); border-color:var(--line); cursor:default;}
  .lockmsg{margin-top:12px; font-size:13px; color:var(--placeholder); text-align:center;}

  /* 반려 팝업 */
  .dim{position:fixed; inset:0; background:rgba(15,20,30,.45); opacity:0; pointer-events:none; transition:.25s; z-index:50;}
  .dim.on{opacity:1; pointer-events:auto;}
  .modal{position:fixed; left:50%; top:50%; transform:translate(-50%,-46%) scale(.97); opacity:0; pointer-events:none;
    width:460px; max-width:calc(100vw - 32px); background:#fff; border-radius:18px; padding:24px; z-index:51;
    box-shadow:0 30px 70px rgba(15,20,30,.35); transition:.28s;}
  .modal.on{transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto;}
  .modal h3{font-size:18px; font-weight:800;}
  .modal .ms{font-size:13.5px; color:var(--placeholder); margin:7px 0 16px;}
  .rsn{display:flex; align-items:center; gap:10px; padding:12px 13px; border:1.5px solid var(--line);
    border-radius:11px; margin-bottom:8px; cursor:pointer; font-size:14px;}
  .rsn.on{border-color:var(--danger); background:var(--danger-bg); font-weight:700;}
  .memo{width:100%; height:80px; border:1.5px solid var(--border); border-radius:11px; padding:11px 12px;
    font-family:inherit; font-size:13.5px; resize:none; margin-top:6px;}
  .memo:focus{outline:none; border-color:var(--primary);}
  .mbtns{display:flex; gap:9px; margin-top:16px;}
  .mbtns button{flex:1; height:46px; border-radius:11px; font-family:inherit; font-size:14.5px; font-weight:800; cursor:pointer;}
  .mbtns .c{border:1.5px solid var(--border); background:#fff; color:var(--sub);}
  .mbtns .d{border:none; background:var(--danger); color:#fff;}

  .toast{position:fixed; left:50%; bottom:36px; transform:translateX(-50%); background:#191F28; color:#fff;
    padding:13px 20px; border-radius:24px; font-size:13.5px; font-weight:700; z-index:60; opacity:0; transition:.2s;}
  .toast.on{opacity:1;}

  @media(max-width:1100px){
    .side{display:none;}
    .cols{flex-direction:column;}
    .list{flex:1 1 auto; width:100%;}
  }
</style>
</head>
<body>

<div class="top">
  <span class="lg"><img src="../img/logo-mark.png" alt="">랜선페이</span>
  <span class="tag">관리자</span>
  <span class="me">
    <span><b>김심사</b> · 심사자</span>
    <button class="out" onclick="toast('로그아웃')">로그아웃</button>
  </span>
</div>

<div class="layout">
  <nav class="side">
    <div class="grp">운영</div>
    <a class="on"><iconify-icon icon="mingcute:search-2-fill"></iconify-icon>심사<span class="n">8</span></a>
    <a onclick="soon()"><iconify-icon icon="mingcute:transfer-3-fill"></iconify-icon>결제 · 송금</a>
    <a onclick="soon()"><iconify-icon icon="mingcute:link-2-fill"></iconify-icon>요청 링크</a>
    <a onclick="soon()"><iconify-icon icon="mingcute:message-3-fill"></iconify-icon>문의</a>
    <div class="grp">관리</div>
    <a onclick="soon()"><iconify-icon icon="mingcute:user-3-fill"></iconify-icon>회원</a>
    <a onclick="soon()"><iconify-icon icon="mingcute:alert-fill"></iconify-icon>이상거래</a>
    <a onclick="soon()"><iconify-icon icon="mingcute:chart-bar-fill"></iconify-icon>통계 · 정산</a>
    <div class="grp">시스템</div>
    <a onclick="soon()"><iconify-icon icon="mingcute:settings-3-fill"></iconify-icon>설정</a>
    <a onclick="soon()"><iconify-icon icon="mingcute:history-fill"></iconify-icon>기록</a>
  </nav>

  <main class="main">
    <h1>심사</h1>
    <div class="h-sub">서류를 확인하고 승인하면 카드 결제와 송금이 진행됩니다.</div>

    <div class="kpis">
      <div class="kpi"><div class="l">대기</div><div class="v" id="kWait">8건</div></div>
      <div class="kpi warn"><div class="l">30분 초과</div><div class="v" id="kSla">2건</div></div>
      <div class="kpi good"><div class="l">오늘 내가 처리</div><div class="v" id="kMine">12건</div></div>
      <div class="kpi"><div class="l">평균 심사시간</div><div class="v">6분</div></div>
    </div>

    <div class="cols">
      <section class="list">
        <div class="lh">
          <span class="t">대기열</span><span class="cnt" id="lCnt">8</span>
          <button class="sortbtn" onclick="toast('마감 임박순으로 보고 있어요')">마감 임박순 ▾</button>
        </div>
        <div class="items" id="items"></div>
      </section>

      <section class="detail" id="detail"></section>
    </div>
  </main>
</div>

<!-- 반려 -->
<div class="dim" id="dim" onclick="closeNo()"></div>
<div class="modal" id="modal">
  <h3>반려 사유를 골라주세요</h3>
  <div class="ms">고른 사유가 신청자에게 문자로 안내됩니다.</div>
  <div id="rsns"></div>
  <textarea class="memo" id="memo" placeholder="덧붙일 말 (선택)"></textarea>
  <div class="mbtns">
    <button class="c" onclick="closeNo()">취소</button>
    <button class="d" onclick="doReject()">반려하고 다음 건</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── 예시 데이터 ── */
var ME = '김심사';
var DATA = [
  { id:'A-0142', type:'부동산 임대차 · 월세', amt:500000, user:'홍길동', min:34, doc:'임대차계약서 1장',
    payee:'대성부동산', acct:'KB국민 123456-78-901234', card:'삼성 Deep Dream · 3개월', match:true, lock:null },
  { id:'A-0143', type:'B2B 매입대금', amt:3500000, user:'미라클상사', min:31, doc:'거래명세서 1장',
    payee:'한빛식자재', acct:'기업 302-1122-3344', card:'현대 the Green · 일시불', match:true, lock:null, two:true },
  { id:'A-0144', type:'별도 관리비', amt:156000, user:'김지연', min:12, doc:'관리비 고지서 1장',
    payee:'행복관리사무소', acct:'신한 110-234-567890', card:'국민 tantan · 3개월', match:true, lock:'박심사' },
  { id:'A-0145', type:'인건비 · 용역비', amt:1200000, user:'미라클상사', min:9, doc:'용역계약서 1장',
    payee:'김직원', acct:'토스뱅크 1000-1234-5678', card:'현대 the Green · 3개월', match:false, lock:null, two:true },
  { id:'A-0146', type:'복비', amt:680000, user:'홍길동', min:6, doc:'중개보수 영수증 1장',
    payee:'대성부동산', acct:'KB국민 123456-78-901234', card:'삼성 Deep Dream · 3개월', match:true, lock:null },
  { id:'A-0147', type:'이사비', amt:450000, user:'이수민', min:4, doc:'이사비 견적서 1장',
    payee:'영구크린', acct:'우리 1002-345-678901', card:'롯데 로카 · 2개월', match:true, lock:null },
  { id:'A-0148', type:'렌트료 · 렌탈료', amt:390000, user:'박준호', min:3, doc:'렌탈 계약서 1장',
    payee:'미니렌트카', acct:'하나 123-456789-01', card:'BC 바로 · 일시불', match:true, lock:null },
  { id:'A-0149', type:'교육비', amt:380000, user:'최유진', min:1, doc:'학원비 고지서 1장',
    payee:'한빛학원', acct:'농협 302-9876-5432', card:'신한 딥드림 · 3개월', match:true, lock:null }
];
var REASONS = ['증빙에 금액이 보이지 않아요','예금주와 계약자가 달라요','서류가 흐리거나 잘렸어요',
               '유형에 맞지 않는 서류예요','거래를 확인할 수 없어요','이용할 수 없는 거래예요'];
var cur = 0, pickedReason = -1;

/* ── 목록 ── */
function won(n){ return n.toLocaleString('ko-KR') + '원'; }
function drawList(){
  document.getElementById('items').innerHTML = DATA.map(function(d, i){
    var b = [];
    if (d.min >= 30) b.push('<span class="badge sla">' + d.min + '분 경과</span>');
    if (d.two)      b.push('<span class="badge two">2인 확인</span>');
    if (d.lock === ME) b.push('<span class="badge mine">내가 심사 중</span>');
    else if (d.lock)   b.push('<span class="badge lock">' + d.lock + ' 검토 중</span>');
    return '<div class="it' + (i === cur ? ' on' : '') + '" onclick="pick(' + i + ')">' +
      '<div class="r1"><span class="ty">' + d.type + '</span><span class="amt">' + won(d.amt) + '</span></div>' +
      '<div class="r2"><span>' + d.user + '</span><span>·</span><span>' + d.min + '분 전</span></div>' +
      (b.length ? '<div class="r2">' + b.join('') + '</div>' : '') +
      '</div>';
  }).join('');
  document.getElementById('lCnt').textContent = DATA.length;
  document.getElementById('kWait').textContent = DATA.length + '건';
  document.getElementById('kSla').textContent = DATA.filter(function(d){ return d.min >= 30; }).length + '건';
}

/* ── 상세 ── */
function drawDetail(){
  var d = DATA[cur];
  if (!d) { document.getElementById('detail').innerHTML = '<div class="lockmsg">대기 중인 건이 없어요.</div>'; return; }
  var mine = d.lock === ME, other = d.lock && !mine;

  var badges = '';
  if (d.min >= 30) badges += '<span class="badge sla">' + d.min + '분 경과</span>';
  if (d.two)      badges += '<span class="badge two">2인 확인 필요</span>';
  if (other)      badges += '<span class="badge lock">' + d.lock + ' 검토 중</span>';
  if (mine)       badges += '<span class="badge mine">내가 심사 중</span>';

  document.getElementById('detail').innerHTML =
  '<div class="dtop"><div><div class="tt">' + d.type + '</div>' +
  '<div class="ss">' + d.id + ' · ' + d.user + ' 신청 · ' + d.min + '분 전</div></div>' +
  '<div class="st">' + badges + '</div></div>' +

  '<div class="dgrid">' +
    '<div class="docbox">' +
      '<div class="docview"><iconify-icon icon="mingcute:document-fill"></iconify-icon>' +
      '<div class="dn">' + d.doc + '</div></div>' +
      '<div class="doctools">' +
        '<button onclick="toast(\'크게 보기\')">크게 보기</button>' +
        '<button onclick="toast(\'회전\')">회전</button>' +
        '<button onclick="toast(\'원본 내려받기\')">원본</button>' +
      '</div>' +
    '</div>' +
    '<div class="info">' +
      row('신청 금액', won(d.amt)) +
      row('수수료 4%', won(Math.round(d.amt * 0.04))) +
      row('결제 예정', won(d.amt + Math.round(d.amt * 0.04))) +
      row('받는 분', d.payee) +
      row('입금 계좌', d.acct) +
      row('등록 카드', d.card) +
      (d.match
        ? '<div class="check"><iconify-icon icon="mingcute:check-circle-fill"></iconify-icon>예금주와 계약 상대가 일치해요</div>'
        : '<div class="check bad"><iconify-icon icon="mingcute:alert-fill"></iconify-icon>예금주가 서류와 달라요 — 확인 필요</div>') +
    '</div>' +
  '</div>' +

  '<div class="acts">' +
    (mine
      ? '<button class="ok" onclick="doApprove()">' + (d.two ? '1차 승인 (선임 확인 필요)' : '승인하고 다음 건') + '</button>' +
        '<button class="no" onclick="openNo()">반려</button>' +
        '<button class="hold" onclick="unclaim()">놓기</button>'
      : '<button class="claim" onclick="claim()"' + (other ? ' disabled' : '') + '>' +
        (other ? d.lock + ' 님이 보고 있어요' : '내가 심사하기') + '</button>') +
  '</div>' +
  (mine ? '' : '<div class="lockmsg">' + (other
      ? '다른 담당자가 먼저 가져갔어요. 다른 건을 골라주세요.'
      : '먼저 가져와야 승인 · 반려할 수 있어요.') + '</div>');
}
function row(l, v){ return '<div class="irow"><span class="l">' + l + '</span><span class="v">' + v + '</span></div>'; }

/* ── 동작 ── */
function pick(i){ cur = i; drawList(); drawDetail(); }
function claim(){
  var d = DATA[cur];
  if (d.lock) { toast('다른 담당자가 먼저 가져갔어요'); drawList(); drawDetail(); return; }
  d.lock = ME;
  drawList(); drawDetail();
  toast('이 건을 가져왔어요 · 10분 뒤 자동으로 풀려요');
}
function unclaim(){ DATA[cur].lock = null; drawList(); drawDetail(); toast('다시 대기열로 보냈어요'); }
function nextOne(msg){
  DATA.splice(cur, 1);
  if (cur >= DATA.length) cur = Math.max(0, DATA.length - 1);
  var done = parseInt(document.getElementById('kMine').textContent, 10) + 1;
  document.getElementById('kMine').textContent = done + '건';
  drawList(); drawDetail(); toast(msg);
}
function doApprove(){
  var d = DATA[cur];
  nextOne(d.two ? '1차 승인했어요 · 선임 확인 대기로 넘어갔어요' : '승인했어요 · 결제와 송금이 진행됩니다');
}
function openNo(){
  pickedReason = -1;
  document.getElementById('rsns').innerHTML = REASONS.map(function(r, i){
    return '<div class="rsn" onclick="pickR(' + i + ')" id="r' + i + '">' + r + '</div>';
  }).join('');
  document.getElementById('memo').value = '';
  document.getElementById('dim').classList.add('on');
  document.getElementById('modal').classList.add('on');
}
function closeNo(){
  document.getElementById('dim').classList.remove('on');
  document.getElementById('modal').classList.remove('on');
}
function pickR(i){
  pickedReason = i;
  REASONS.forEach(function(_, k){ document.getElementById('r' + k).classList.toggle('on', k === i); });
}
function doReject(){
  if (pickedReason < 0) { toast('반려 사유를 골라주세요'); return; }
  closeNo();
  nextOne('반려했어요 · 신청자에게 문자로 안내됩니다');
}
function soon(){ toast('이 메뉴는 아직 화면만 잡아둔 상태예요'); }
var tmr;
function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(tmr); tmr = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

drawList(); drawDetail();
</script>
</body>
</html>
